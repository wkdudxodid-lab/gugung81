살피고, 전체가 지속될 수 있도록 조정하는 지혜입니다.",steps:["시간·돈·관심·에너지의 사용처를 적어 과도하게 쏠린 곳을 확인하십시오.","내가 이미 충분히 가진 자원 중 나눌 수 있는 것을 하나 정하십시오.","부족한 영역에 현실적으로 보탤 작은 조정—시간 배분, 지출 조정, 도움 요청—을 실행하십시오."],domains:{연애:"한 사람만 감정 노동을 떠맡지 않는지 살펴보십시오. 서로의 필요를 듣고 관심과 책임을 균형 있게 나누십시오.",재물:"수입과 자산이 한 곳에 과도하게 집중되어 있는지 확인하십시오. 위험을 감당할 수 있는 수준으로 관리하고 여유 자원을 계획적으로 배분하십시오.",사업·일:"성과가 큰 부서나 사람에게만 보상이 집중되지는 않는지 점검하십시오. 조직 전체의 지속 가능성을 높이는 자원 배분이 필요합니다.",인간관계:"늘 주기만 하거나 받기만 하는 관계가 있는지 돌아보십시오. 도움을 주고받는 균형과 건강한 경계를 함께 세우십시오.",건강·생활:"일에만 에너지를 쏟고 수면·식사·휴식을 줄이지 않았는지 살펴보십시오. 부족해진 기본 생활을 먼저 보충하십시오.",인생:"한 가지 성취를 위해 다른 소중한 것을 지나치게 희생하고 있지는 않은지 돌아보십시오. 삶 전체의 균형을 다시 맞추십시오."},advice:"넘치는 곳과 부족한 곳을 함께 보십시오. 조금 덜어 조금 보태는 조정이 전체의 균형을 회복시킵니다.",hope:"균형은 한 번에 완성되지 않습니다. 오늘 한 곳을 바로잡는 작은 조정이 삶 전체를 더 편안하게 만듭니다."},{n:78,title:"물의 위대한 승리",core:"《도덕경》 78장은 물이 세상에서 가장 부드러우면서도 단단한 것을 이긴다는 역설을 말합니다. 물은 낮은 곳에 머물고 다투지 않으면서도 오래도록 길을 냅니다. 부드러움과 겸손의 깊은 힘을 보여 줍니다.",situation:"강한 상대나 어려운 환경 앞에서 정면으로 맞서야 할지 고민하고 있을 수 있습니다. 힘겨루기 외에 오래 견디며 길을 내는 방법이 있는지 살펴보십시오.",hidden:"물의 힘은 한 번에 상대를 무너뜨리는 데 있지 않습니다. 낮아지고 흐르고 스며들며, 상황에 맞춰 모양을 바꾸는 지속성에 있습니다. 약한 위치에 있다고 해서 영향력까지 없는 것은 아닙니다.",steps:["지금의 문제에서 정면충돌 외에 사용할 수 있는 우회로와 협력 방법을 찾아보십시오.","상대의 말과 상황을 충분히 듣고, 사실에 근거한 한 가지 제안을 준비하십시오.","작지만 지속할 수 있는 행동을 정해 꾸준히 이어 가십시오."],domains:{연애:"상대를 이기려는 말보다 마음을 이해하는 질문을 먼저 건네십시오. 부드러움은 자신을 희생하는 것이 아니라 다툼을 줄이는 소통입니다.",재물:"단기간의 큰 성과보다 오래 유지할 수 있는 저축·투자 원칙을 세우십시오. 물처럼 꾸준히 흐르는 계획이 중요합니다.",사업·일:"경쟁자와 무조건 맞붙기보다 고객의 불편을 해결하는 차별화된 길을 찾으십시오. 작더라도 꾸준한 신뢰가 경쟁력이 됩니다.",인간관계:"목소리를 높이는 대신 사실과 태도로 신뢰를 쌓으십시오. 다투지 않는다고 해서 부당함을 모두 참아야 하는 것은 아닙니다.",건강·생활:"몸에 맞는 낮은 강도의 꾸준한 움직임과 충분한 회복을 선택하십시오. 통증이나 증상을 억지로 참지 말고 필요하면 진료를 받으십시오.",인생:"남보다 앞서는 속도보다 자신에게 맞는 흐름을 찾으십시오. 낮은 곳에서 시작해도 꾸준히 흐르면 길을 만들 수 있습니다."},advice:"강함을 흉내 내기보다 물의 지혜를 배우십시오. 낮추고 살피고 지속하는 태도가 막힌 곳에 새로운 길을 냅니다.",hope:"작은 물줄기도 멈추지 않으면 길을 냅니다. 주군의 꾸준한 걸음에도 분명 의미가 쌓이고 있습니다."},{n:79,title:"원망을 풀고 화합하는 마음",core:"《도덕경》 79장은 큰 원망을 해결해도 흔적이 남을 수 있음을 말하며, 성인은 원망을 키우기보다 자신의 몫을 돌아보고 약속과 책임을 지키는 태도를 취한다고 설명합니다.",situation:"오래된 갈등이나 섭섭함이 완전히 풀리지 않았을 수 있습니다. 화해를 서두르기보다 상처의 원인과 아직 해결되지 않은 책임이 무엇인지 살펴보십시오.",hidden:"화해는 한쪽이 모든 것을 잊고 참는 일이 아닙니다. 원망을 줄이려면 실제 피해를 인정하고 가능한 책임을 다하며, 다시 같은 일이 생기지 않도록 경계를 세워야 합니다.",steps:["갈등에서 확인된 사실, 내 감정, 상대에게 바라는 변화를 구분해 적으십시오.","내가 책임질 부분은 인정하고, 상대의 책임까지 대신 떠안지는 마십시오.","안전하고 적절한 방식으로 대화하거나, 필요한 경우 거리를 두고 중재자의 도움을 구하십시오."],domains:{연애:"상처를 덮어 두는 것을 화해라고 여기지 마십시오. 진심 어린 사과와 행동의 변화가 있는지 확인하고, 신뢰는 시간을 두고 회복하십시오.",재물:"금전 갈등은 감정만으로 해결하지 말고 약속·기록·증빙을 확인하십시오. 필요한 경우 전문가의 조언을 받아 공정하게 정리하십시오.",사업·일:"분쟁 이후에는 책임 소재와 재발 방지 절차를 명확히 하십시오. 겉으로만 봉합하면 갈등이 다시 생길 수 있습니다.",인간관계:"원망을 반복해서 되새기기보다 해결 가능한 부분을 찾으십시오. 다만 반복되는 모욕이나 폭력에는 분명한 경계를 세우십시오.",건강·생활:"스트레스가 몸과 수면에 영향을 주고 있다면 혼자 견디지 마십시오. 신뢰할 사람이나 전문가에게 도움을 요청하십시오.",인생:"모든 관계가 예전처럼 돌아가야만 회복인 것은 아닙니다. 용서와 거리 두기, 책임 있는 정리는 각기 필요한 선택일 수 있습니다."},advice:"원망을 억지로 지우려 하지 말고, 책임질 일은 책임지고 지킬 경계는 지키십시오. 진정한 화합은 정직한 정리에서 시작됩니다.",hope:"상처가 있었다고 해서 앞으로의 관계와 삶까지 결정된 것은 아닙니다. 오늘부터 더 건강한 방식으로 다시 시작할 수 있습니다."},{n:80,title:"소박하고 평화로운 세상",core:"《도덕경》 80장은 작은 나라와 적은 백성의 소박한 삶을 그립니다. 멀리 있는 것을 끝없이 탐하기보다 가까운 삶을 돌보고, 만족과 평화가 있는 공동체를 소중히 여기는 이상을 제시합니다.",situation:"더 넓은 성취와 빠른 변화에 쫓기며 현재의 일상과 가까운 사람들을 놓치고 있지는 않은지 돌아볼 때입니다. 지금 내 곁에서 지켜야 할 소중한 것이 무엇인지 살펴보십시오.",hidden:"이 장의 작은 공동체는 단순히 과거로 돌아가자는 처방이라기보다, 끝없는 확장과 경쟁이 행복의 유일한 기준이 될 수 없다는 성찰입니다. 가까운 삶의 충실함과 자립, 평화가 중요합니다.",steps:["내가 진정으로 필요로 하는 것과 남과 비교하며 원하는 것을 구분하십시오.","가족·이웃·동료와 나누는 작은 시간이나 식사, 대화를 한 번 마련하십시오.","생활을 복잡하게 만드는 약속이나 소비 한 가지를 줄이고 가까운 일상을 돌보십시오."],domains:{연애:"거창한 이벤트보다 함께하는 일상의 신뢰를 돌보십시오. 작은 약속을 지키고 평온한 시간을 나누는 것이 관계를 깊게 합니다.",재물:"과시성 소비와 무리한 확장을 줄이고 생활의 안정성을 우선하십시오. 자신에게 필요한 수준의 재정 목표를 세우십시오.",사업·일:"규모만 키우기보다 고객과 구성원에게 실제로 필요한 가치를 제공하십시오. 작지만 건강한 기반을 단단히 하는 것이 중요합니다.",인간관계:"넓은 인맥보다 서로 믿고 도울 수 있는 관계를 소중히 하십시오. 가까운 사람에게 먼저 안부를 전하십시오.",건강·생활:"복잡한 계획보다 규칙적인 수면·식사·산책 같은 기본을 회복하십시오. 가까운 자연과 일상에서 쉼을 찾으십시오.",인생:"남들이 정한 성공의 크기보다 내가 지키고 싶은 삶의 모양을 생각하십시오. 소박함은 포기가 아니라 선택일 수 있습니다."},advice:"멀리 있는 큰 성취만 바라보지 말고 가까운 삶을 정성껏 돌보십시오. 작고 평화로운 일상도 충분히 귀한 완성입니다.",hope:"행복은 먼 곳에만 있지 않습니다. 오늘 곁에 있는 사람과 작은 평온을 나누는 순간부터 다시 시작됩니다."},{n:81,title:"진실과 완성",core:"《도덕경》 81장은 참된 말은 화려하지 않고, 참된 앎은 말싸움을 하지 않으며, 성인은 쌓아 두기보다 베풀고 남을 이롭게 할수록 자신도 넉넉해진다고 말합니다. 진실·겸손·나눔으로 도덕경의 여정을 맺습니다.",situation:"많이 말하고 증명해야 한다는 부담을 느끼거나, 지식과 성과를 인정받기 위해 애쓰고 있을 수 있습니다. 지금 필요한 것은 더 화려한 표현인지, 삶으로 보여 주는 진실함인지 돌아보십시오.",hidden:"81장은 앞선 가르침을 하나로 모읍니다. 진실은 과장보다 담백하고, 지혜는 논쟁에서 이기는 능력보다 삶을 이롭게 하는 힘이며, 나눔은 자신을 비우면서도 함께 풍요로워지는 길입니다.",steps:["오늘 한 말 중 과장하거나 방어하려 했던 부분이 있는지 돌아보고 필요한 말만 남기십시오.","알고 있는 것을 뽐내기보다 누군가에게 실제 도움이 되도록 한 가지 나누십시오.","작은 친절이나 지식, 시간, 자원을 대가를 과시하지 않고 베풀어 보십시오."],domains:{연애:"화려한 약속보다 진실한 말과 꾸준한 행동으로 사랑을 표현하십시오. 상대를 바꾸려는 설득보다 서로를 이해하는 대화를 선택하십시오.",재물:"돈의 크기만으로 삶의 가치를 판단하지 마십시오. 정직한 수입과 절제된 지출, 지속 가능한 나눔의 균형을 세우십시오.",사업·일:"과장된 홍보보다 실제 품질과 약속 이행으로 신뢰를 얻으십시오. 지식과 성과를 나누는 조직이 더 건강하게 성장합니다.",인간관계:"논쟁에서 이기는 것보다 서로에게 도움이 되는 결론을 찾으십시오. 경청하고 필요한 말을 담백하게 전하십시오.",건강·생활:"몸과 마음을 돌보는 일을 거창하게 말하기보다 매일 실천하십시오. 건강에 관한 중요한 판단은 신뢰할 수 있는 전문가와 확인하십시오.",인생:"배움과 성취를 자신만의 소유로 가두지 말고 세상에 좋은 영향을 주는 데 사용하십시오. 나눔과 겸손 속에서 삶의 깊이가 자랍니다."},advice:"81장의 마지막 지혜는 더 많이 말하고 쌓는 데 있지 않습니다. 진실하게 살고, 필요한 것을 나누며, 말보다 행동으로 삶을 완성해 가십시오.",hope:"여정의 끝은 멈춤이 아니라 새로운 시작입니다. 지금까지 쌓아 온 지혜를 오늘의 작은 선행과 실천으로 이어 가십시오."}];var Bc=mt(dn(),1),wh=Symbol.for("react.element");var kh=Object.prototype.hasOwnProperty,Sh=Bc.__SECRET_INTERNALS_DO_NOT_USE_OR_YOU_WILL_BE_FIRED.ReactCurrentOwner,Eh={key:!0,ref:!0,__self:!0,__source:!0};function Wc(e,t,n){var r,l={},i=null,o=null;n!==void 0&&(i=""+n),t.key!==void 0&&(i=""+t.key),t.ref!==void 0&&(o=t.ref);for(r in t)kh.call(t,r)&&!Eh.hasOwnProperty(r)&&(l[r]=t[r]);if(e&&e.defaultProps)for(r in t=e.defaultProps,t)l[r]===void 0&&(l[r]=t[r]);return{$$typeof:wh,type:e,key:i,ref:o,props:l,_owner:Sh.current}}var E=Wc,P=Wc;var $c=Vc,Ch={"연애":{icon:"♡",label:"연애"},"재물":{icon:"◍",label:"재물"},"사업·일":{icon:"◈",label:"사업·일"},"인간관계":{icon:"◎",label:"인간관계"},"건강·생활":{icon:"✦",label:"건강·생활"},"삶":{icon:"✧",label:"삶"},"인생":{icon:"✧",label:"삶"}};function eu(){let[e,t]=Ke.useState(null),[n,r]=Ke.useState(""),[l,i]=Ke.useState(""),[o,u]=Ke.useState(!1),s=Ke.useR
