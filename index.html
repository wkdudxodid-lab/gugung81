성이 있는지 살펴보십시오.","오늘 시작할 수 있는 가장 작은 행동 하나를 정하고 실행하십시오."],domains:{연애:"사랑: 상대를 내 기준으로 규정하기보다 있는 모습 그대로 이해하려는 대화를 시작하십시오.",재물:"재물: 수익 기대보다 자금의 흐름과 위험의 실체를 먼저 확인하십시오.",사업·일:"사업·일: 유행하는 이름보다 고객이 실제로 필요로 하는 본질을 찾아보십시오.",인간관계:"인간관계: 사람을 한 번의 말이나 행동으로 단정하지 말고 맥락을 살피십시오.",건강·생활:"건강·생활: 몸의 상태를 막연히 판단하지 말고 관찰 가능한 생활 습관부터 점검하십시오.",삶:"삶: 아직 정해지지 않은 가능성을 열어 두고 한 걸음씩 방향을 만들어 가십시오."},advice:"답을 서둘러 붙이지 마십시오. 본질을 보는 눈이 맑아지면 선택의 길도 조금씩 드러납니다.",hope:"모든 시작은 작은 알아차림에서 비롯됩니다. 지금의 주군께도 새 길을 열어 갈 여백이 있습니다."},{n:2,title:"반대 속의 조화",core:"서로 반대되는 것들은 대립만 하는 것이 아니라 서로를 드러내고 완성합니다. 아름다움과 추함, 어려움과 쉬움, 앞섬과 뒤섬은 관계 속에서 의미를 얻습니다.",situation:"옳고 그름을 빨리 가르거나 상대와 자신을 비교하느라 마음이 소모될 수 있습니다. 한쪽만 없애려 하기보다 두 측면이 어떻게 연결되어 있는지 살펴보십시오.",hidden:"대립을 없애는 것이 아니라 대립에 끌려다니지 않는 지혜입니다. 차이를 인정하면 균형 잡힌 선택이 가능해집니다.",steps:["갈등 상황에서 상대의 관점과 나의 관점을 각각 한 문장으로 써 보십시오.","좋고 나쁨의 평가를 잠시 멈추고 상황의 장단점을 함께 살피십시오.","양쪽이 조금씩 나아질 수 있는 작은 조정안을 하나 제안하십시오."],domains:{연애:"사랑: 서로 다른 성향을 결함으로 보지 말고 조율할 차이로 받아들이십시오.",재물:"재물: 수익 가능성과 손실 가능성을 한 화면에 놓고 판단하십시오.",사업·일:"사업·일: 성과와 휴식, 속도와 품질 사이의 균형을 설계하십시오.",인간관계:"인간관계: 의견 차이를 관계의 실패로 여기지 말고 이해의 계기로 삼으십시오.",건강·생활:"건강·생활: 활동과 회복, 식사와 절제의 균형을 함께 관리하십시오.",삶:"삶: 좋은 날과 어려운 날 모두 삶의 일부임을 받아들이고 긴 흐름을 보십시오."},advice:"한쪽을 억지로 이기게 하기보다 전체의 균형을 회복하는 길을 찾으십시오.",hope:"서로 다른 것들이 조화를 이룰 때 삶은 더 넓어집니다. 차이를 품는 마음이 주군의 힘이 됩니다."},{n:3,title:"비움과 평온",core:"도덕경 3장은 지나친 경쟁과 욕망을 부추기지 않고, 마음을 비우며 삶의 질서를 안정시키는 정치를 말합니다. 비움은 무기력이 아니라 불필요한 자극을 덜어 내는 힘입니다.",situation:"주변의 성과와 소식에 마음이 흔들리거나, 더 많이 가져야 안심할 것 같은 순간일 수 있습니다. 비교와 과열을 잠시 멈추고 지금 꼭 필요한 것을 가려내십시오.",hidden:"욕망을 자극하는 환경을 줄이면 마음은 차분해지고 판단은 선명해집니다. 비움은 포기가 아니라 중요한 것을 지키기 위한 공간 만들기입니다.",steps:["오늘 나를 불필요하게 자극하는 정보나 비교의 통로 하나를 줄이십시오.","꼭 필요한 일과 남에게 보이기 위한 일을 구분해 보십시오.","하루의 일정에 아무것도 하지 않고 생각을 가라앉히는 시간을 마련하십시오."],domains:{연애:"사랑: 상대를 바꾸려는 요구를 줄이고 함께 편안해지는 시간을 늘리십시오.",재물:"재물: 충동 구매와 과도한 위험 추구를 멈추고 필요한 지출부터 정리하십시오.",사업·일:"사업·일: 보여 주기식 확장보다 핵심 업무와 고객 신뢰에 집중하십시오.",인간관계:"인간관계: 인정받으려는 경쟁을 내려놓고 진심 어린 경청을 실천하십시오.",건강·생활:"건강·생활: 과한 계획보다 수면·식사·걷기 같은 기본을 꾸준히 지키십시오.",삶:"삶: 더 많이 채우기보다 무엇이 충분한지 스스로 정하는 기준을 세우십시오."},advice:"비워야 할 것을 비우면 지켜야 할 것이 보입니다. 오늘은 덜어 내는 선택을 해도 좋습니다.",hope:"마음의 자리가 넓어지면 삶의 숨통도 트입니다. 작은 비움이 평온의 시작입니다."},{n:4,title:"무한한 근원",core:"도덕경 4장은 도를 텅 빈 그릇에 비유합니다. 아무리 써도 다하지 않는 근원이며, 날카로운 것을 무디게 하고 얽힌 것을 풀며 빛을 부드럽게 합니다.",situation:"능력과 자원이 한정되어 있다고 느끼거나, 복잡하게 얽힌 일을 어떻게 풀지 막막할 수 있습니다. 모든 것을 한 번에 해결하려 하지 말고 여유와 여백을 확보하십시오.",hidden:"빈 그릇은 부족함의 상징이 아니라 받아들이고 담아낼 수 있는 가능성입니다. 힘을 과시하기보다 부드럽게 조정할 때 해결의 실마리가 생깁니다.",steps:["복잡한 문제를 세 부분으로 나누고 지금 다룰 한 부분만 고르십시오.","상대의 말을 끊지 않고 끝까지 들은 뒤 핵심을 되짚어 확인하십시오.","일정과 마음에 여백을 하나 만들어 새로운 정보를 받아들일 준비를 하십시오."],domains:{연애:"사랑: 상대에게 답을 강요하기보다 마음을 들을 여백을 주십시오.",재물:"재물: 모든 자금을 한 곳에 몰기보다 유동성과 안전 여지를 확보하십시오.",사업·일:"사업·일: 복잡한 절차를 단순화하고 막힌 흐름부터 풀어 보십시오.",인간관계:"인간관계: 오래된 오해를 단정하지 말고 차분한 대화로 매듭을 풀어 보십시오.",건강·생활:"건강·생활: 무리한 일정을 줄이고 회복할 시간을 확보하십시오.",삶:"삶: 모르는 것을 인정하고 배울 공간을 남겨 두십시오."},advice:"빈틈을 두려워하지 마십시오. 여백은 새로운 길이 들어오는 자리입니다.",hope:"지금 비어 있는 자리는 끝이 아니라 가능성의 자리입니다. 서두르지 않아도 다시 채워질 수 있습니다."},{n:5,title:"자연의 균형",core:"도덕경 5장은 하늘과 땅이 사사로운 감정으로 만물을 대하지 않는다고 말합니다. 자연의 운행은 한쪽에 치우치지 않으며, 말보다 비어 있는 중심과 절도가 중요합니다.",situation:"누군가에게 지나치게 맞추거나, 반대로 감정에 휩쓸려 판단하고 있을 수 있습니다. 공평함은 차갑게 대하는 것이 아니라 사사로운 감정과 사실을 구분하는 태도입니다.",hidden:"자연의 균형은 무관심이 아니라 각자의 자리가 작동하도록 하는 질서입니다. 지나친 개입과 과도한 기대를 줄이면 관계와 일의 흐름이 안정됩니다.",steps:["판단이 필요한 사안에서 사실·감정·추측을 따로 적어 보십시오.","내가 통제할 수 있는 일과 상대에게 맡겨야 할 일을 구분하십시오.","말을 늘리기보다 핵심을 간결하고 정직하게 전달하십시오."],domains:{연애:"사랑: 상대를 내 기대에 맞추려 하지 말고 서로의 자율성을 존중하십시오.",재물:"재물: 감정적 확신보다 기준과 원칙에 따라 매수·매도·지출을 판단하십시오.",사업·일:"사업·일: 특정 사람에게만 의존하지 않도록 공정한 절차와 역할을 마련하십시오.",인간관계:"인간관계: 편 가르기보다 사실을 확인하고 균형 있게 들으십시오.",건강·생활:"건강·생활: 과식·과로·과도한 절제를 피하고 몸의 리듬을 살피십시오.",삶:"삶: 세상을 내 뜻대로 움직이려 하기보다 자연스러운 흐름에 맞춰 조정하십시오."},advice:"모든 것을 직접 움직이려는 부담을 내려놓으십시오. 균형은 억지보다 절도에서 자랍니다.",hope:"주군께 필요한 것은 더 큰 힘이 아니라 흔들리지 않는 중심일 수 있습니다. 중심을 지키면 흐름은 다시 고르게 됩니다."},{n:6,title:"생명의 근원",core:"도덕경 6장은 골짜기의 신비로운 생명력을 말합니다. 비어 있고 낮은 곳은 만물을 받아들이며, 끊이지 않는 근원은 생명을 낳고 이어 줍니다.",situation:"당장 눈에 띄는 성과가 없더라도 밑바탕을 다지는 시간이 필요할 수 있습니다. 낮고 조용한 자리에서 이어지는 힘을 과소평가하지 마십시오.",hidden:"골짜기는 자신을 드러내지 않지만 물과 생명을 품습니다. 겸손하게 받아들이고 꾸준히 이어 가는 힘이 오래가는 성장의 토대입니다.",steps:["눈에 띄지 않지만 계속 유지해야 할 기본 습관 하나를 정하십시오.","도움을 받을 수 있는 사람이나 자원을 찾아 겸손하게 요청하십시오.","성과를 재촉하기보다 과정이 지속될 수 있도록 환경을 정비하십시오."],domains:{연애:"사랑: 상대의 약한 모습도 안전하게 드러낼 수 있는 관계를 만드십시오.",재물:"재물: 단기 성과보다 현금흐름과 장기 생존력을 차분히 관리하십시오.",사업·일:"사업·일: 기초 역량과 신뢰를 쌓는 보이지 않는 일을 소홀히 하지 마십시오.",인간관계:"인간관계: 말할 차례만 기다리지 말고 상대의 이야기를 받아들이십시오.",건강·생활:"건강·생활: 몸을 몰아붙이기보다 회복과 지속 가능한 생활 리듬을 만드십시오.",삶:"삶: 낮은 자리에서 배우고 품는 태도가 더 큰 성장을 준비합니다."},advice:"눈에 띄지 않는 시간도 헛되지 않습니다. 뿌리가 깊어지는 동안 열매는 준비됩니다.",hope:"조용히 이어 가는 힘을 믿으십시오. 보이지 않는 근원이 주군의 다음 걸음을 받쳐 줍니다."},{n:7,title:"자신을 넘어서는 길",core:"도덕경 7장은 하늘과 땅이 오래 지속되는 까닭을 자신만을 위해 살지 않기 때문이라고 풀이합니다. 성인은 자신을 뒤에 두기에 앞서고, 사사로움을 덜기에 자신을 보존합니다.",situation:"내가 양보하면 손해 보는 것 같거나, 인정받기 위해 지나치게 애쓰고 있을 수 있습니다. 자신을 지우라는 뜻이 아니라 자기중심적 집착을 줄이고 더 큰 흐름을 보라는 가르침입니다.",hidden:"자신을 넘어선다는 것은 자기 돌봄을 포기하는 것이 아닙니다. 공동의 이익과 지속 가능한 관계를 생각할 때 오히려 신뢰와 존재감이 깊어질 수 있습니다.",steps:["오늘 한 가지 일에서 공로보다 공동의 결과를 먼저 생각해 보십시오.","도움을 주되 자신의 한계와 경계를 함께 지키십시오.","내가 꼭 인정받아야 한다는 마음이 선택에 영향을 주는지 점검하십시오."],domains:{연애:"사랑: 이기려는 태도보다 서로의 행복을 함께 키우는 행동을 선택하십시오.",재물:"재물: 단기 이익만 보지 말고 신뢰와 지속 가능성을 포함해 판단하십시오.",사업·일:"사업·일: 팀의 성과를 함께 나누고 책임과 공을 공정하게 인정하십시오.",인간관계:"인간관계: 먼저 양보할 수 있는 부분은 양보하되 부당한 희생은 거절하십시오.",건강·생활:"건강·생활: 남을 돌보는 만큼 자신의 휴식과 건강도 책임 있게 챙기십시오.",삶:"삶: 개인의 성취를 더 큰 의미와 연결할 때 만족이 깊어집니다."},advice:"자신을 낮추되 자신을 함부로 대하지 마십시오. 겸손과 자기 존중은 함께 갈 수 있습니다.",hope:"주군의 가치는 남의 박수로만 정해지지 않습니다. 넓은 마음으로 살아온 시간은 반드시 삶의 힘이 됩니다."},{n:8,title:"물처럼 흐르는 지혜",core:"도덕경 8장은 가장 높은 선을 물에 비유합니다. 물은 만물을 이롭게 하면서 다투지 않고, 사람들이 싫어하는 낮은 곳에 머뭅니다. 물의 지혜는 겸손·이로움·때에 맞는 흐름에 있습니다.",situation:"힘으로 밀어붙여야 할지, 한발 물러서야 할지 고민하는 상황일 수 있습니다. 무조건 참거나 양보하라는 뜻이 아니라 상황에 맞게 유연하면서도 본래 방향을 잃지 않는 방법을 찾으십시오.",hidden:"물은 부드럽지만 길을 찾아 흐르고, 낮은 곳에 머물지만 생명을 살립니다. 부드러움은 약함이 아니라 오래 지속되는 적응력입니다.",steps:["문제에 정면충돌하기 전 우회하거나 순서를 바꿀 방법을 찾아보십시오.","내가 실제로 도울 수 있는 한 가지를 행동으로 옮기십시오.","환경이 바뀌면 방법은 바꾸되 지키려는 핵심 가치는 분명히 하십시오."],domains:{연애:"사랑: 상대를 이기려 하지 말고 마음이 흐를 수 있는 대화의 길을 만드십시오.",재물:"재물: 시장 상황에 유연하게 대응하되 원칙 없는 추격 매매는 피하십시오.",사업·일:"사업·일: 고객과 현장의 필요에 맞춰 방법을 조정하고 실질적 가치를 제공하십시오.",인간관계:"인간관계: 낮은 자세로 듣되 필요한 경계와 원칙은 차분히 지키십시오.",건강·생활:"건강·생활: 무리한 목표보다 꾸준히 이어갈 수 있는 걷기와 생활 습관을 선택하십시오.",삶:"삶: 한 가지 길만 고집하지 말고 흐름에 맞춰 방향을 조정하십시오."},advice:"물처럼 유연하게 움직이되 어디로 가려는지는 잊지 마십시오.",hope:"부드러움은 주군을 약하게 만들지 않습니다. 유연한 마음이 막힌 길을 열어 줍니다."},{n:9,title:"넘침을 경계하는 지혜",core:"도덕경 9장은 가득 채우고도 계속 더하려는 것은 오래 지키기 어렵다고 경계합니다. 일을 이루었다면 물러날 줄 알고, 날카로움과 부귀를 과시하지 않는 것이 하늘의 도입니다.",situation:"성과가 보이기 시작해 더 밀어붙이고 싶거나, 이미 가진 것을 잃을까 불안해 무리하게 움켜쥘 수 있습니다. 지금은 확장보다 유지와 점검이 중요한 시점인지 살펴보십시오.",hidden:"넘침을 경계한다는 것은 성취를 부정하는 것이 아닙니다. 적절한 때 멈추고 정리해야 성과가 오래갑니다. 절제는 다음 기회를 지키는 기술입니다.",steps:["현재 진행 중인 일에서 더하지 않아도 되는 부분을 하나 덜어 내십시오.","성과와 함께 비용·피로·위험이 얼마나 쌓였는지 점검하십시오.","잘된 일을 과시하기보다 다음 단계에 필요한 준비와 정리를 하십시오."],domains:{연애:"사랑: 사랑을 확인받으려는 과도한 요구를 줄이고 안정적인 신뢰를 쌓으십시오.",재물:"재물: 수익이 났을 때 탐욕으로 위험을 키우지 말고 사전에 정한 원칙을 지키십시오.",사업·일:"사업·일: 무리한 확장보다 품질·현금흐름·조직의 지속 가능성을 확인하십시오.",인간관계:"인간관계: 자신의 성취를 내세우기보다 겸손하게 나누고 상대의 공도 인정하십시오.",건강·생활:"건강·생활: 과로와 과식을 멈추고 충분한 회복 시간을 확보하십시오.",삶:"삶: 잘되는 순간에도 절제와 감사의 태도를 유지하면 오래 지킬 수 있습니다."},advice:"더하는 것만이 발전은 아닙니다. 알맞은 때 멈추고 지키는 선택도 큰 지혜입니다.",hope:"이미 이룬 것을 소중히 돌보십시오. 절제는 주군의 성취를 오래 빛나게 하는 힘입니다."},{n:10,title:"마음과 정신의 조화",core:"도덕경 10장은 몸과 마음을 하나로 품고, 기운을 부드럽게 하며, 자신이 낳고 기른 것을 소유하려 들지 않는 태도를 묻습니다. 능력과 감정을 억누르는 것이 아니라 서로 어긋나지 않게 돌보는 지혜입니다.",situation:"해야 할 일이 많거나 책임이 커지면서 마음과 몸이 따로 움직이는 듯한 때입니다. 성과를 내기 위해 자신을 몰아붙이고 있지는 않은지, 가까운 사람을 돌본다는 이유로 그 사람의 선택까지 대신하고 있지는 않은지 살펴보십시오.",hidden:"이 장의 질문은 ‘내가 잘하고 있는가’에 앞서 ‘내 안의 여러 부분이 조화를 이루고 있는가’입니다. 진정한 역량은 강하게 통제하는 데서만 나오지 않습니다. 부드럽게 살피고, 성장할 공간을 남겨 둘 때 오래 지속됩니다.",steps:["오늘 몸의 긴장과 감정 상태를 각각 한 문장으로 기록하고, 필요한 휴식이나 대화를 하나 정하십시오.","누군가를 돕고 있다면 조언을 먼저 하기보다 그 사람이 원하는 도움의 형태를 물어보십시오.","일을 마친 뒤 결과를 독점하려 하지 말고 함께한 사람의 몫과 공을 분명히 인정하십시오."],domains:{연애:"상대의 감정과 자신의 감정을 함께 살피십시오. 사랑은 상대를 내 뜻대로 만드는 일이 아니라 서로의 본래 모습을 지켜 주는 관계입니다.",재물:"돈을 통제하려는 불안에 끌려가기보다 수입·지출·저축의 흐름을 균형 있게 관리하십시오. 무리한 확장보다 지속 가능한 관리가 중요합니다.",사업·일:"성과만 재촉하면 사람과 과정이 소진됩니다. 목표와 자율성을 함께 주고, 구성원이 성장할 여지를 남기는 운영을 생각하십시오.",인간관계:"상대의 선택을 대신 결정하지 마십시오. 경청과 신뢰를 바탕으로 돕되, 각자의 책임과 경계를 존중하십시오.",건강·생활:"몸과 마음을 따로 취급하지 말고 수면·식사·움직임·정서적 휴식을 함께 돌보십시오. 불편한 증상은 전문가와 상의하십시오.",인생:"내가 만든 결과에 집착하기보다 과정에서 배운 것을 다음 사람과 나누십시오. 돌보되 소유하지 않는 태도가 삶을 가볍게 합니다."},advice:"강한 의지로 모든 것을 붙잡으려 하지 마십시오. 몸과 마음을 조화롭게 돌보고, 다른 존재가 스스로 자랄 자리를 남겨 두는 것이 오래가는 힘입니다.",hope:"오늘 자신을 조금 더 부드럽게 대하고 누군가의 성장을 믿어 주십시오. 조화는 작은 배려에서 시작됩니다."},{n:11,title:"비움의 힘",core:"도덕경 11장은 바퀴살 사이의 빈 곳, 그릇의 빈 공간, 문과 창의 빈 곳이 실제 쓰임을 만든다고 말합니다. 재료만큼이나 비어 있음이 중요하다는 통찰입니다.",situation:"일정과 계획, 물건과 책임을 계속 채우는데도 여유가 없고 답답하게 느껴질 수 있습니다. 더 많이 갖추는 것이 해결책인지, 오히려 비워야 제 기능을 되찾는 부분이 있는지 살펴볼 때입니다.",hidden:"비움은 무기력이나 포기가 아닙니다. 쓸모가 생겨날 공간을 만드는 적극적인 선택입니다. 이미 가진 능력과 자원을 제대로 쓰려면 불필요한 일정, 과한 기대, 낡은 방식이 차지한 자리를 비워야 합니다.",steps:["오늘 일정에서 중요하지 않은 일 하나를 덜어내고 확보한 시간을 가장 중요한 일에 사용하십시오.","책상·휴대전화·작업 공간 중 한 곳을 정리해 필요한 것이 바로 보이게 하십시오.","대화에서 즉시 답하거나 판단하기 전에 잠시 멈추고 상대의 말을 끝까지 들으십시오."],domains:{연애:"관계에 대한 과도한 기대와 확인 요구를 조금 내려놓으십시오. 서로 숨 쉴 공간이 있을 때 애정도 자연스럽게 자랍니다.",재물:"무조건 더 벌거나 더 사는 계획보다 새는 지출과 불필요한 고정비를 먼저 점검하십시오. 여유 자금은 안전판이 됩니다.",사업·일:"회의·절차·보고를 늘리기보다 실제 성과를 막는 불필요한 단계를 제거하십시오. 단순한 구조가 실행력을 높입니다.",인간관계:"모든 부탁을 받아들일 필요는 없습니다. 정중한 거절과 적절한 거리는 관계를 오래 지키는 공간입니다.",건강·생활:"휴식 시간을 일정에 실제로 비워 두십시오. 수면과 회복은 남는 시간에 하는 일이 아니라 생활의 기반입니다.",인생:"새로운 것을 더하기 전에 무엇이 본질을 가리고 있는지 살펴보십시오. 비워진 자리에 다음 가능성이 들어옵니다."},advice:"빈 공간을 결핍으로 여기지 마십시오. 지금 필요한 것은 더 채우는 일이 아니라 꼭 필요한 것이 제 역할을 하도록 자리를 내어 주는 일일 수 있습니다.",hope:"한 가지를 비우면 한 가지 길이 열립니다. 오늘 만든 작은 여백이 내일의 가능성을 키웁니다."},{n:12,title:"욕망을 넘어서는 눈",core:"도덕경 12장은 지나친 색과 소리, 맛, 사냥과 희귀한 물건에 마음을 빼앗기면 감각과 판단이 흐려진다고 경계합니다. 자극을 좇기보다 내면의 중심을 지키라는 가르침입니다.",situation:"정보와 광고, 비교와 자극이 넘치는 환경에서 무엇이 정말 필요한지 판단하기 어려울 수 있습니다. 순간의 즐거움이나 타인의 시선이 중요한 선택을 대신하고 있지는 않은지 돌아보십시오.",hidden:"문제는 감각 자체가 아니라 감각의 자극에 끌려 다니는 상태입니다. 욕망을 무조건 억압하기보다 자극과 행동 사이에 멈춤을 두면, 자신에게 중요한 기준을 다시 들을 수 있습니다.",steps:["구매나 중요한 결정을 앞두고 하루의 숙려 시간을 두고, 필요한 이유와 감당할 비용을 적으십시오.","하루 중 일정 시간 알림과 불필요한 콘텐츠를 끄고 조용한 집중 시간을 확보하십시오.","남과 비교하게 만드는 정보 하나를 멀리하고, 자신이 중요하게 여기는 기준 세 가지를 적으십시오."],domains:{연애:"외모나 조건, 순간의 자극만으로 관계를 판단하지 마십시오. 함께 있을 때 존중과 신뢰가 있는지 살피십시오.",재물:"충동구매와 유행 추종을 경계하십시오. 구매 전 필요성·총비용·대체 가능성을 확인하고 투자도 근거와 위험을 먼저 살피십시오.",사업·일:"눈에 띄는 숫자나 유행만 좇지 말고 고객에게 실제로 필요한 가치와 장기적인 품질에 집중하십시오.",인간관계:"소문과 겉모습보다 직접 확인한 사실을 기준으로 판단하십시오. 자극적인 말에 즉시 반응하지 않는 것이 좋습니다.",건강·생활:"과도한 자극과 늦은 시간의 화면 사용을 줄이고 규칙적인 식사와 수면을 지키십시오. 건강 문제는 검증된 의료 조언을 따르십시오.",인생:"남들이 부러워하는 삶보다 자신에게 의미 있는 삶을 선택하십시오. 조용한 만족은 외부의 박수와 다를 수 있습니다."},advice:"감각을 닫을 필요는 없지만, 감각이 삶의 주인이 되게 하지는 마십시오. 자극을 잠시 내려놓으면 본질을 판단하는 눈이 맑아집니다.",hope:"세상의 소음이 잦아들면 내 마음이 원하는 방향도 조금씩 또렷해집니다."},{n:13,title:"집착에서 벗어나는 자유",core:"도덕경 13장은 총애와 모욕, 얻음과 잃음에 지나치게 흔들리는 마음을 살핍니다. 큰 근심은 자신을 지나치게 중요하게 여기고 외부 평가에 자신을 맡길 때 깊어진다는 통찰입니다.",situation:"칭찬을 받으면 들뜨고 비판을 받으면 무너지거나, 지위와 성과를 잃을까 두려워 선택을 미루고 있을 수 있습니다. 지금의 평가가 자신의 전체 가치를 결정한다고 여기지는 않는지 살펴보십시오.",hidden:"명예와 평판은 현실에서 영향을 주지만 나라는 존재의 전부는 아닙니다. 외부 평가를 참고하되 그것에 자기 가치를 맡기지 않는 것이 집착에서 벗어나는 자유입니다.",steps:["최근 마음을 크게 흔든 칭찬이나 비판을 적고, 사실과 해석을 구분하십시오.","내가 통제할 수 있는 행동과 타인이 결정하는 평가를 나누어 보십시오.","오늘 결과와 무관하게 지키고 싶은 원칙 하나를 정해 행동으로 옮기십시오."],domains:{연애:"상대의 반응 하나로 자신의 매력을 판단하지 마십시오. 서로의 존엄을 지키는 관계인지 차분히 살피십시오.",재물:"수익률이나 자산 규모로 자신의 가치를 재단하지 마십시오. 손실 공포와 과시 욕구를 줄이고 감당 가능한 원칙을 세우십시오.",사업·일:"직함과 평판에만 매달리면 중요한 판단을 놓칠 수 있습니다. 고객과 동료에게 실제로 제공한 가치로 성과를 점검하십시오.",인간관계:"모두에게 인정받으려 애쓰지 마십시오. 신뢰할 수 있는 사람의 구체적인 피드백을 듣고 나머지는 거리를 두십시오.",건강·생활:"스트레스가 몸에 미치는 영향을 살피고 휴식과 상담 등 필요한 도움을 구하십시오. 불편함을 약함으로 여기지 마십시오.",인생:"성공과 실패는 삶의 일부이지 존재의 판결문이 아닙니다. 자신이 지키려는 가치에 따라 다음 선택을 하십시오."},advice:"평판을 무시하라는 뜻이 아니라 평판에 지배당하지 말라는 뜻으로 받아들이십시오. 자신을 소중히 여기되, 자신에 대한 집착은 조금씩 내려놓으십시오.",hope:"한 번의 평가가 주군의 삶 전체를 결정하지 않습니다. 다시 중심을 잡고 선택할 힘은 언제나 남아 있습니다."},{n:14,title:"보이지 않는 진리",core:"도덕경 14장은 보아도 보이지 않고, 들어도 들리지 않으며, 잡으려 해도 잡히지 않는 도의 성격을 말합니다. 눈앞에 드러난 현상만으로 근본을 다 알 수 없다는 가르침입니다.",situation:"상황의 겉모습은 분명해 보이지만 이유와 흐름을 이해하기 어렵거나, 답을 빨리 얻으려 할수록 더 혼란스러울 수 있습니다. 보이는 사실과 아직 알 수 없는 부분을 구분해야 할 때입니다.",hidden:"모든 것을 즉시 설명하고 통제할 수 있다는 생각을 내려놓으면 관찰의 깊이가 생깁니다. 보이지 않는 것을 함부로 상상해 단정하지 말고, 반복되는 흐름과 조건을 차분히 살피는 태도가 중요합니다.",steps:["현재 문제에서 직접 확인한 사실, 추측, 아직 모르는 것을 세 칸으로 나누어 적으십시오.","결론을 내리기 전에 신뢰할 만한 자료나 당사자의 설명을 한 번 더 확인하십시오.","당장 답이 나지 않는 문제는 관찰할 기간과 다시 판단할 기준을 정해 두십시오."],domains:{연애:"상대의 말과 행동을 넘겨짚지 마십시오. 확인되지 않은 마음을 단정하기보다 차분히 물어보는 대화가 필요합니다.",재물:"눈에 보이는 가격이나 소문만으로 판단하지 말고 기업의 현금흐름·부채·사업 구조와 위험 요인을 함께 살피십시오.",사업·일:"표면적인 실적 뒤에 있는 고객 경험, 공급망, 조직의 병목을 관찰하십시오. 원인을 확인한 뒤 해결책을 정하십시오.",인간관계:"말하지 않은 의도를 추측해 갈등을 키우지 마십시오. 사실을 확인하고 서로의 관점을 들으십시오.",건강·생활:"증상만으로 스스로 진단하지 말고 지속되거나 우려되는 변화는 의료 전문가에게 확인하십시오.",인생:"모든 길이 처음부터 선명할 필요는 없습니다. 알 수 없는 부분을 인정하면서도 확인 가능한 한 걸음을 내딛으십시오."},advice:"보이지 않는 것을 억지로 붙잡으려 하지 마십시오. 관찰하고 확인하고 기다리는 태도가 성급한 확신보다 깊은 지혜를 만듭니다.",hope:"아직 보이지 않는다고 길이 없는 것은 아닙니다. 차분히 살피는 동안 다음 한 걸음의 윤곽이 드러날 수 있습니다."},{n:15,title:"깊은 지혜와 신중함",core:"도덕경 15장은 옛 도를 얻은 사람들의 깊고 신중한 모습을 묘사합니다. 얼어붙은 강을 건너듯 조심하고, 사방을 경계하듯 살피며, 다듬어지지 않은 통나무처럼 소박하고 겸허한 태도를 말합니다.",situation:"중요한 변화나 선택 앞에서 확신이 부족하거나, 반대로 경험을 믿고 너무 빨리 결론을 내리고 있을 수 있습니다. 지금은 서두르는 능력보다 상황을 충분히 읽는 신중함이 필요합니다.",hidden:"신중함은 우유부단함과 다릅니다. 위험을 살피면서도 움직일 때를 놓치지 않는 균형입니다. 자신이 모르는 부분을 인정하는 사람은 배우고 수정할 수 있어 오히려 더 멀리 갑니다.",steps:["결정 전에 최선의 경우뿐 아니라 실패할 경우의 비용과 대응책도 적으십시오.","경험이 적은 분야라면 먼저 작은 규모로 시험하고 결과를 확인하십시오.","하루를 마치며 오늘 내가 성급하게 판단한 일과 잘 기다린 일을 하나씩 돌아보십시오."],domains:{연애:"관계를 서둘러 규정하거나 상대를 단정하지 마십시오. 시간을 두고 말과 행동이 일치하는지 살피십시오.",재물:"큰 금액을 한 번에 움직이기보다 위험과 손실 가능성을 먼저 점검하십시오. 이해하지 못한 상품에는 서명하거나 투자하지 마십시오.",사업·일:"새 사업과 변화는 작은 검증부터 시작하십시오. 현장의 목소리를 듣고 수정할 수 있는 여지를 남기십시오.",인간관계:"자신의 경험만으로 상대를 판단하지 마십시오. 질문하고 듣는 태도가 오해를 줄입니다.",건강·생활:"몸 상태가 달라졌다면 무리하게 버티지 말고 원인을 확인하십시오. 꾸준하고 무리 없는 습관을 쌓으십시오.",인생:"겸손하게 배우되 자신을 과소평가하지 마십시오. 조심스럽게 준비한 사람은 기회가 왔을 때 더 단단하게 움직일 수 있습니다."},advice:"깊은 지혜는 모든 것을 안다고 말하는 데 있지 않습니다. 모르는 것을 살피고, 작은 징후를 놓치지 않으며, 필요하면 방향을 고치는 데 있습니다.",hope:"천천히 걷는다고 뒤처지는 것은 아닙니다. 신중하게 내딛는 한 걸음이 오래 가는 길을 만듭니다."},{n:16,title:"고요 속의 깨달음",core:"도덕경 16장은 지극한 비움과 고요함에 이르고, 만물이 움직이고 돌아가는 모습을 관찰하라고 합니다. 변화의 끝에는 근원으로 돌아가는 흐름이 있으며, 그 흐름을 아는 것이 밝음이라는 가르침입니다.",situation:"생각과 감정이 복잡해 무엇을 선택해야 할지 모르겠거나, 일이 빠르게 바뀌어 중심을 잃은 듯할 수 있습니다. 당장 결론을 내리기보다 마음을 가라앉히고 변화의 흐름을 관찰할 필요가 있습니다.",hidden:"고요함은 현실을 외면하는 정지가 아닙니다. 반응을 잠시 늦추어 사물의 시작과 변화, 돌아가는 방향을 보는 힘입니다. 지금의 혼란도 조건이 바뀌면 달라질 수 있음을 기억하십시오.",steps:["하루 5~10분 조용히 앉거나 천천히 걸으며 호흡과 주변의 변화를 관찰하십시오.","문제의 시작부터 지금까지 어떤 조건이 바뀌었는지 시간순으로 적으십시오.","반복되는 일에서 내가 바꿀 수 있는 습관 하나를 찾아 일주일 동안 실천하십시오."],domains:{연애:"감정이 격해졌을 때 즉시 결론을 내리지 말고 잠시 진정한 뒤 대화하십시오. 반복되는 관계의 패턴도 함께 살펴보십시오.",재물:"시장의 하루 움직임에 과잉 반응하지 말고 처음 세운 기준과 장기적인 재무 흐름을 점검하십시오. 상황 변화가 확인되면 계획을 조정하십시오.",사업·일:"단기 성과만 보지 말고 일이 시작된 목적과 현재의 흐름을 비교하십시오. 불필요해진 절차는 정리하고 핵심으로 돌아가십시오.",인간관계:"갈등이 반복된다면 한 번의 말다툼보다 누적된 패턴을 살펴보십시오. 조용한 대화로 원인을 확인하십시오.",건강·생활:"규칙적인 수면과 휴식으로 몸의 리듬을 회복하십시오. 지속적인 증상이나 급격한 변화는 의료진과 상의하십시오.",인생:"변화와 끝맺음은 새로운 시작의 조건이 될 수 있습니다. 지나간 것을 억지로 붙잡기보다 배움을 가지고 다음 시기로 나아가십시오."},advice:"마음이 흔들릴수록 잠시 고요해지십시오. 멈춤은 포기가 아니라 더 정확히 움직이기 위한 준비입니다.",hope:"모든 변화에는 흐름이 있습니다. 오늘 마음을 가라앉히면 어제 보이지 않던 길이 보일 수 있습니다."},{n:17,title:"스스로 이루는 리더십",core:"도덕경 17장은 가장 좋은 지도자는 백성이 그 존재를 겨우 알 정도로 자연스럽게 이끈다고 말합니다. 신뢰가 바탕이 되고, 일을 이루어도 공을 앞세우지 않는 리더십입니다.",situation:"가정이나 조직에서 책임을 맡고 있거나, 누군가를 이끌면서도 일이 뜻대로 되지 않아 답답할 수 있습니다. 모든 것을 직접 지시하고 통제해야 한다는 부담을 내려놓을 필요가 있습니다.",hidden:"좋은 리더십은 자신의 영향력을 과시하는 일이 아니라 사람들이 스스로 역량을 발휘할 조건을 만드는 일입니다. 신뢰가 부족하면 규칙과 감시가 늘어나고, 신뢰가 쌓이면 자율과 책임이 자랍니다.",steps:["함께 일하는 사람에게 목표와 기준을 분명히 설명하되 실행 방법은 맡겨 보십시오.","결과가 좋았을 때 기여한 사람의 이름과 역할을 구체적으로 인정하십시오.","지시를 하나 줄이는 대신 필요한 자원과 장애물 제거를 지원하십시오."],domains:{연애:"상대를 바꾸려 하기보다 서로 신뢰할 수 있는 약속을 지키십시오. 통제보다 믿음이 관계를 안정시킵니다.",재물:"가족이나 동업자와 재정 결정을 할 때 정보를 투명하게 공유하고 각자의 책임을 분명히 하십시오.",사업·일:"목표·권한·책임을 명확히 하고 구성원이 자율적으로 일할 수 있게 지원하십시오. 성과는 함께 나누십시오.",인간관계:"인정받으려는 말보다 약속을 지키는 행동으로 신뢰를 쌓으십시오. 상대가 스스로 결정할 여지를 존중하십시오.",건강·생활:"가족의 건강 습관을 강요하기보다 함께 실천할 수 있는 환경을 만드십시오. 각자의 선택과 필요도 존중하십시오.",인생:"자신이 남긴 흔적이 얼마나 크게 보이는가보다 주변 사람이 얼마나 성장하고 편안해졌는지를 돌아보십시오."},advice:"앞에서 끌고 가는 것만이 리더십은 아닙니다. 믿고 맡기며 필요한 순간에 돕는 태도가 사람과 조직을 오래 성장시킵니다.",hope:"주군이 모든 짐을 혼자 짊어질 필요는 없습니다. 신뢰를 나누면 함께 나아갈 힘이 커집니다."},{n:18,title:"본질을 잃은 세상",core:"도덕경 18장은 큰 도가 사라졌다고 여겨질 때 인의와 지혜, 효와 자애 같은 이름이 두드러지게 등장한다고 말합니다. 덕목 자체를 부정하기보다 본래의 자연스러운 조화가 무너진 뒤 겉으로 내세우는 표지가 늘어나는 상황을 비춥니다.",situation:"규칙과 구호는 많지만 실제 신뢰와 배려가 부족하다고 느끼거나, 옳은 말을 많이 하는데 행동이 따라오지 않는 상황을 만날 수 있습니다. 겉으로 내세운 가치와 실제 생활 사이의 간격을 살펴보십시오.",hidden:"좋은 원칙과 제도는 필요하지만 그것이 본질을 대신할 수는 없습니다. 진정한 배려는 말보다 행동에서 드러나며, 신뢰는 선언이 아니라 반복되는 일관성에서 자랍니다.",steps:["자신이 자주 말하는 가치 하나를 고르고 오늘 그 가치를 보여 줄 행동을 정하십시오.","가정이나 조직에서 형식적으로 반복하지만 실효가 낮은 절차 하나를 찾아 개선 의견을 내십시오.","누군가를 평가하기 전에 그 사람이 처한 조건과 실제 행동을 함께 살피십시오."],domains:{연애:"사랑한다는 말만큼 일상의 존중과 책임이 있는지 살피십시오. 사과와 약속은 행동으로 이어져야 합니다.",재물:"고수익을 약속하는 홍보 문구보다 계약 조건, 수수료, 위험 설명, 실제 사업 구조를 확인하십시오.",사업·일:"조직의 구호보다 고객 응대와 품질, 약속 이행을 점검하십시오. 문화는 포스터가 아니라 매일의 행동으로 만들어집니다.",인간관계:"도덕적 우월감을 앞세우기보다 먼저 자신의 행동을 돌아보십시오. 비난보다 구체적인 개선과 책임 있는 대화가 도움이 됩니다.",건강·생활:"건강을 위한 유행 문구보다 검증된 기본 습관을 꾸준히 실천하십시오. 과장된 건강 정보는 근거를 확인하십시오.",인생:"남에게 보여 주는 올바름보다 실제로 지키는 작은 원칙을 소중히 여기십시오. 본질은 일상의 선택에 드러납니다."},advice:"겉으로 좋은 말을 더하는 데서 멈추지 마십시오. 지금 필요한 덕목을 작고 구체적인 행동으로 회복할 때 본래의 조화가 다시 시작됩니다.",hope:"세상이 복잡해 보여도 주군의 작은 진실한 행동까지 사라지는 것은 아닙니다. 본질을 지키는 한 걸음이 변화를 시작합니다."},{n:19,title:"소박함으로 돌아가는 길",core:"도덕경 19장의 핵심은 인위적인 지식 자랑과 과도한 욕망을 덜어 내고, 소박함과 자연스러운 본성으로 돌아가자는 데 있습니다. 많이 갖추는 것보다 불필요한 것을 덜어 내어 삶의 바탕을 맑게 하는 지혜입니다.",situation:"해야 할 일과 원하는 것이 지나치게 많아 마음이 복잡해졌다면, 지금은 더 보태기보다 무엇을 덜어야 하는지 살필 때입니다. 남에게 보여 주기 위한 목표와 실제로 필요한 일을 구분해 보십시오.",hidden:"복잡함의 밑바닥에는 인정받고 싶은 마음이나 놓치면 안 된다는 불안이 숨어 있을 수 있습니다. 그 마음을 탓하지 말고, 내게 정말 중요한 가치가 무엇인지 다시 확인하면 선택이 단순해집니다.",steps:["현재의 목표와 약속을 적고, 꼭 필요한 것·미뤄도 되는 것·내려놓을 것을 나누십시오.","하루 동안 과시나 비교를 부추기는 소비와 행동 하나를 줄여 보십시오.","작지만 본질적인 일 하나에 온전히 집중하고, 마친 뒤 그 경험을 기록하십시오."],domains:{연애:"상대에게 이상적인 모습을 요구하기보다 있는 그대로의 사람을 알아가십시오. 꾸밈없는 표현과 작은 배려가 관계의 신뢰를 키웁니다.",재물:"남에게 보이기 위한 지출을 줄이고 실제 생활에 필요한 지출을 구분하십시오. 절약은 무조건 참는 일이 아니라 돈의 쓰임을 본질에 맞추는 일입니다.",사업·일:"복잡한 절차와 보여 주기식 성과보다 고객에게 실제 가치를 주는 핵심 업무를 먼저 정리하십시오. 단순한 과정이 품질을 높일 수 있습니다.",인간관계:"많은 인맥보다 서로 진심을 나눌 수 있는 관계를 돌보십시오. 필요 없는 경쟁과 비교에서 한발 물러나면 마음의 여유가 생깁니다.",건강·생활:"무리한 계획을 늘리기보다 규칙적인 수면, 단순한 식사, 가벼운 움직임부터 회복하십시오. 생활의 기본을 꾸준히 지키는 것이 중요합니다.",인생:"성공의 기준을 남의 평가에서 자신의 가치로 옮겨 보십시오. 덜어 낸 자리에 시간과 마음의 자유가 들어옵니다."},advice:"더 많이 얻어야만 나아지는 것은 아닙니다. 지금 삶에서 불필요한 무게 하나를 내려놓고, 꼭 지키고 싶은 한 가지를 정하십시오.",hope:"소박함은 부족함이 아니라 본질을 알아보는 힘입니다. 덜어 낸 만큼 주군의 삶에는 더 맑은 선택과 새로운 여유가 생길 수 있습니다."},{n:20,title:"세상과 다른 나의 길",core:"도덕경 20장은 세상의 통념과 평가에 매이지 않는 태도를 말합니다. 배움과 분별을 무조건 버리라는 뜻이라기보다, 남들이 정한 기준에 휩쓸리지 않고 자기 마음의 근원을 살피라는 가르침으로 읽을 수 있습니다.",situation:"주변 사람들의 속도와 선택이 나와 달라 불안하거나, 다수의 의견과 내 생각 사이에서 흔들릴 수 있습니다. 남들과 다르다는 이유만으로 자신을 틀렸다고 판단하지 마십시오.",hidden:"비교가 커질수록 자신의 감각을 듣기 어려워집니다. 고독감은 때로 자기 기준을 다시 세우라는 신호일 수 있지만, 모든 조언을 거부하라는 뜻은 아닙니다. 열린 마음과 독립적인 판단을 함께 지키십시오.",steps:["지금 나를 불안하게 만드는 비교 대상이나 사회적 기준을 구체적으로 적으십시오.","그 기준이 내 가치와 실제 상황에 맞는지 사실과 감정을 나누어 검토하십시오.","신뢰할 만한 한 사람의 조언은 듣되, 최종 선택의 이유를 자신의 말로 정리하십시오."],domains:{연애:"남들이 말하는 연애의 방식이나 시기에 자신을 맞추지 마십시오. 두 사람이 편안하고 존중받는 관계인지가 더 중요합니다.",재물:"유행하는 투자나 주변의 수익 이야기에 조급하게 반응하지 마십시오. 자신의 목표·기간·손실 감내 범위에 맞는 판단이 필요합니다.",사업·일:"업계의 관행을 무조건 따르거나 반대로 무조건 거부하지 말고, 고객과 현장의 근거를 통해 자신만의 경쟁력을 찾으십시오.",인간관계:"다른 취향과 생각을 가진 사람과도 공존할 수 있습니다. 다만 존중과 자기 경계를 함께 지키십시오.",건강·생활:"남의 생활 습관을 그대로 따라 하기보다 자신의 몸 상태와 생활 여건에 맞는 지속 가능한 방식을 찾으십시오. 필요한 건강 문제는 전문가와 상의하십시오.",인생:"남들과 다른 길을 걷는 시간이 있어도 그것이 실패를 뜻하지는 않습니다. 자신이 중요하게 여기는 방향을 차분히 확인하십시오."},advice:"세상의 소리를 잠시 낮추고 내 마음의 소리를 들어 보십시오. 다만 고립되기보다 좋은 조언을 가려 듣는 균형을 잊지 마십시오.",hope:"모두와 같은 길을 걷지 않아도 괜찮습니다. 자기 기준을 세우고 한 걸음씩 걸으면 나만의 길도 충분히 단단해질 수 있습니다."},{n:21,title:"본질을 따르는 믿음",core:"도덕경 21장은 큰 덕이 도를 따르며, 도의 모습은 희미하고 잡히지 않지만 그 안에 만물이 생겨나는 바탕이 있다고 말합니다. 눈에 보이는 결과만으로 본질을 단정하지 말고, 보이지 않는 흐름과 근거를 살피라는 뜻입니다.",situation:"결과가 아직 뚜렷하지 않은 일이나 사람을 두고 확신이 서지 않을 수 있습니다. 겉모습이나 말보다 실제 행동의 일관성과 시간이 쌓아 온 흔적을 살펴보십시오.",hidden:"당장 확인되는 성과가 없다고 가치가 없는 것은 아닙니다. 반대로 막연한 기대만으로 가능성을 확정해서도 안 됩니다. 보이지 않는 잠재력은 관찰과 검증을 통해 조금씩 드러납니다.",steps:["판단하려는 대상의 말보다 반복되는 행동과 실제 자료를 먼저 확인하십시오.","아직 알 수 없는 부분은 추측으로 채우지 말고 확인할 질문으로 남겨 두십시오.","작은 시험이나 관찰 기간을 정해 변화의 방향과 일관성을 점검하십시오."],domains:{연애:"화려한 말보다 약속을 지키는 태도와 어려울 때의 배려를 보십시오. 신뢰는 작은 행동이 쌓이며 형성됩니다.",재물:"장밋빛 전망보다 현금흐름, 부채, 사업의 실체와 위험을 확인하십시오. 잠재력은 근거를 통해 검토해야 합니다.",사업·일:"눈에 띄는 홍보보다 제품과 서비스의 본질, 고객의 실제 반응, 조직의 실행력을 살피십시오. 기초가 탄탄해야 성과가 오래갑니다.",인간관계:"첫인상만으로 사람을 규정하지 마십시오. 시간이 지나도 유지되는 성실함과 책임감을 관찰하십시오.",건강·생활:"몸의 변화를 막연히 해석하지 말고 기록과 검진 등 확인 가능한 근거를 활용하십시오. 이상 신호가 지속되면 의료진의 도움을 받으십시오.",인생:"아직 이름 붙이기 어려운 가능성도 꾸준히 돌보십시오. 조급한 결론보다 성실한 관찰이 올바른 방향을 드러냅니다."},advice:"보이지 않는 것을 믿되, 근거 없이 단정하지 마십시오. 열린 마음과 냉정한 확인이 함께할 때 본질에 가까워집니다.",hope:"오늘은 결과가 작아 보여도 성실하게 쌓은 바탕은 사라지지 않습니다. 차분히 살피고 돌보는 시간이 내일의 가능성을 키웁니다."},{n:22,title:"낮춤으로써 완성되는 힘",core:"도덕경 22장은 굽은 것이 온전해지고, 낮추는 것이 채워지며, 비우는 것이 새롭게 쓰인다는 역설을 전합니다. 자신을 앞세우지 않고 낮출 줄 아는 태도가 오히려 오래가는 힘과 조화를 만든다는 가르침입니다.",situation:"자신의 입장을 끝까지 관철해야 할지, 한발 물러나야 할지 고민하는 상황일 수 있습니다. 물러섬이 원칙을 포기하는 일인지, 더 큰 목적을 위한 유연함인지 구분하십시오.",hidden:"인정받으려는 마음이 강하면 작은 충돌도 자존심의 싸움이 되기 쉽습니다. 반대로 무조건 양보하면 자신을 잃을 수 있습니다. 겸손은 자기비하가 아니라 본질을 지키면서 불필요한 다툼을 줄이는 지혜입니다.",steps:["갈등에서 반드시 지켜야 할 원칙 한 가지와 양보할 수 있는 방식 한 가지를 구분하십시오.","상대의 말을 끝까지 듣고, 자신의 요구를 비난 없이 구체적으로 표현하십시오.","성과를 독차지하기보다 함께 만든 기여를 인정하고 다음 협력의 길을 여십시오."],domains:{연애:"누가 옳은지 겨루기보다 서로의 마음을 이해하려는 대화를 선택하십시오. 다만 존중받지 못하는 상황에는 분명한 경계를 세우십시오.",재물:"수익을 자랑하거나 무리하게 규모를 키우기보다 원칙과 위험 관리를 지키십시오. 겸손한 계획이 큰 손실을 막습니다.",사업·일:"팀의 의견을 듣고 공을 나누는 리더십을 발휘하십시오. 고객과 현장의 피드백을 받아들이는 조직이 더 오래 성장합니다.",인간관계:"먼저 사과하거나 양보하는 것이 언제나 패배는 아닙니다. 다만 반복되는 무례까지 감당할 필요는 없습니다.",건강·생활:"몸의 한계를 인정하고 무리한 경쟁을 줄이십시오. 휴식과 회복을 계획에 포함하는 것이 지속 가능한 힘입니다.",인생:"자신을 낮추되 자신의 가치를 깎아내리지는 마십시오. 겸손과 자기존중이 함께할 때 삶의 중심이 단단해집니다."},advice:"큰 목적을 위해 작은 자존심을 내려놓을 수 있는지 살펴보십시오. 지켜야 할 원칙은 지키고, 불필요한 대립은 부드럽게 풀어 가십시오.",hope:"낮춤은 작아지는 일이 아니라 더 넓은 가능성을 받아들이는 자세입니다. 유연함 속에서 주군의 진짜 힘이 드러날 것입니다."},{n:23,title:"자연스러운 변화",core:"도덕경 23장은 말이 적고 억지가 없는 자연의 흐름을 말합니다. 세찬 바람과 폭우도 오래 지속되지 않듯, 지나친 힘과 감정은 오래갈 수 없습니다. 상황의 흐름을 읽고 무리하지 않는 지혜가 핵심입니다.",situation:"일이 뜻대로 되지 않아 더 강하게 밀어붙이고 싶거나, 감정이 커져 말과 행동이 앞서려는 때일 수 있습니다. 지금은 속도를 낮추고 상황이 가라앉을 시간을 주십시오.",hidden:"불안은 즉각적인 반응을 재촉하지만, 모든 문제에 즉시 답할 필요는 없습니다. 억지로 통제하려는 마음을 줄이면 무엇을 할 수 있고 무엇을 기다려야 하는지 구분하기 쉬워집니다.",steps:["감정이 격해졌다면 중요한 답변과 결정을 잠시 미루고 호흡을 고르십시오.","상황을 바꿀 수 있는 행동과 시간이 필요한 변화를 나누어 적으십시오.","작은 행동을 꾸준히 이어 가되, 효과가 없는 방식은 조정하십시오."],domains:{연애:"감정이 격할 때 결론을 내리거나 상대를 몰아붙이지 마십시오. 차분해진 뒤 짧고 진솔하게 마음을 전하십시오.",재물:"급등락이나 소문에 즉시 반응하지 말고 미리 세운 기준을 따르십시오. 시장의 변동을 통제할 수 없지만 자신의 위험 수준은 관리할 수 있습니다.",사업·일:"무리한 일정과 과도한 지시보다 실제 역량에 맞는 속도를 정하십시오. 작은 개선을 지속하는 편이 일시적인 과속보다 효과적일 수 있습니다.",인간관계:"상대의 감정이 가라앉을 시간을 주고, 불필요한 말싸움은 멈추십시오. 침묵은 회피가 아니라 더 나은 대화를 위한 여백일 수 있습니다.",건강·생활:"과로와 수면 부족을 당연하게 여기지 마십시오. 생활 리듬을 회복하고 증상이 지속되면 적절한 진료를 받으십시오.",인생:"모든 계절이 같은 속도로 흐르지는 않습니다. 멈춤과 기다림도 삶의 과정으로 받아들이십시오."},advice:"지금은 힘을 더 주기보다 힘을 고르게 쓰는 때입니다. 흐름을 살피며 할 수 있는 일을 꾸준히 하십시오.",hope:"거센 순간도 영원히 계속되지는 않습니다. 오늘 한 번 숨을 고르고 다시 시작하는 선택이 새로운 균형을 만듭니다."},{n:24,title:"자신을 드러내지 않는 겸손",core:"도덕경 24장은 발끝으로 서거나 성큼성큼 걷는 모습처럼 자신을 과장하고 내세우는 태도는 오래가지 못한다고 말합니다. 참된 성취는 자기 과시보다 바른 내용과 꾸준한 실천에서 나옵니다.",situation:"성과를 빨리 인정받고 싶거나, 자신의 능력을 증명하려고 무리하고 있을 수 있습니다. 지금의 노력이 실제 결과와 연결되는지, 보여 주기 위한 행동에 에너지를 쓰는지 점검하십시오.",hidden:"과시는 자신감의 표현처럼 보이지만 때로는 내면의 불안을 가리는 방식일 수 있습니다. 인정 욕구를 부정하지 말고, 그것이 판단과 관계를 흔들지 않도록 살피십시오.",steps:["최근 한 행동 중 실질적인 성과보다 보여 주는 데 치중한 일을 찾아보십시오.","말로 약속한 것과 실제로 해낸 것을 비교하고, 부족한 부분을 조용히 보완하십시오.","오늘은 결과 하나를 성실히 완성하고 공은 함께한 사람들과 나누십시오."],domains:{연애:"상대의 관심을 얻으려고 자신을 꾸미거나 과장하기보다 솔직한 모습을 보여 주십시오. 편안함과 신뢰가 관계를 오래 지탱합니다.",재물:"수익 인증이나 주변의 소비 수준에 흔들리지 마십시오. 재정 상태를 실제 숫자로 점검하고 감당 가능한 선택을 하십시오.",사업·일:"겉으로 화려한 홍보보다 품질과 약속 이행을 우선하십시오. 과장된 성과 발표는 신뢰를 잃게 할 수 있습니다.",인간관계:"대화에서 자신의 이야기를 앞세우기보다 상대의 말을 들으십시오. 인정받으려는 경쟁을 줄이면 관계가 편안해집니다.",건강·생활:"남에게 보이기 위한 무리한 운동이나 식단보다 지속 가능한 습관을 선택하십시오. 몸의 상태를 기준으로 조절하십시오.",인생:"남에게 증명하는 삶에서 자신에게 충실한 삶으로 중심을 옮기십시오. 조용한 성취도 충분히 가치 있습니다."},advice:"자신을 크게 보이게 하는 일보다 실제로 단단해지는 일을 선택하십시오. 겸손은 능력을 감추는 것이 아니라 성과가 말하게 하는 태도입니다.",hope:"진실한 노력은 과장하지 않아도 조금씩 드러납니다. 오늘의 작은 완성이 주군의 신뢰와 자신감을 키워 줄 것입니다."},{n:25,title:"만물의 근원",core:"도덕경 25장은 하늘과 땅보다 앞서 있는 이름 붙이기 어려운 근원, 곧 도를 말합니다. 사람은 땅을, 땅은 하늘을, 하늘은 도를, 도는 자연스러움을 본받는다는 흐름을 통해 만물의 큰 질서와 조화를 가르칩니다.",situation:"눈앞의 문제만 따라가다 보니 삶 전체의 방향을 잃은 듯 느낄 수 있습니다. 개별 선택을 넘어 내가 어떤 원칙과 질서에 따라 살아가고 싶은지 돌아볼 때입니다.",hidden:"불안할 때는 모든 것을 내 뜻대로 통제하려 합니다. 그러나 삶에는 내가 정할 수 없는 조건과 흐름도 있습니다. 통제 가능한 책임은 다하되, 통제할 수 없는 부분은 인정하는 것이 균형의 출발입니다.",steps:["삶에서 반복해서 지키고 싶은 핵심 원칙 세 가지를 적으십시오.","현재의 중요한 선택이 그 원칙과 얼마나 맞는지 살펴보십시오.","자연과 일상의 리듬을 회복할 작은 시간을 정해 꾸준히 지키십시오."],domains:{연애:"관계를 소유하거나 통제하려 하기보다 서로의 성장과 자유를 존중하십시오. 함께 지킬 기본 원칙을 대화로 확인하십시오.",재물:"단기 수익만이 아니라 장기 목표와 위험 한도를 함께 보십시오. 재정의 큰 방향을 정하면 일시적 변동에 덜 흔들립니다.",사업·일:"조직의 존재 이유와 고객에게 제공하는 가치를 분명히 하십시오. 유행보다 본질에 맞는 전략이 지속성을 만듭니다.",인간관계:"사람마다 다른 조건과 속도를 인정하십시오. 모두를 바꾸려 하기보다 공통의 원칙과 서로의 역할을 찾으십시오.",건강·생활:"자연스러운 생체 리듬과 회복을 존중하십시오. 무리한 극단보다 수면·식사·활동의 균형을 유지하십시오.",인생:"내가 세상의 중심이라는 생각을 내려놓으면 오히려 큰 흐름 속에서 자신의 자리를 찾을 수 있습니다."},advice:"큰 질서를 한 번에 이해하려 애쓰기보다, 오늘의 선택을 자연스럽고 바른 원칙에 맞추십시오. 작은 조화가 삶 전체의 방향을 바로잡습니다.",hope:"주군의 삶에도 흔들리는 날과 고요한 날이 함께 있습니다. 큰 흐름을 믿고 자신의 몫을 성실히 해 나가면 길은 조금씩 선명해집니다."},{n:26,title:"고요함 속의 중심",core:"도덕경 26장은 무거움이 가벼움의 뿌리이고 고요함이 조급함의 주인이라고 말합니다. 가벼운 움직임이 필요할 때도 중심과 신중함을 잃지 말아야 한다는 가르침입니다.",situation:"일이 빠르게 진행되거나 선택지가 많아 마음이 들뜨고 산만해질 수 있습니다. 속도를 내기 전에 자신을 지탱하는 기본과 우선순위를 확인하십시오.",hidden:"중심이 흔들리면 사소한 자극에도 크게 반응하고, 중요한 것을 놓치기 쉽습니다. 고요함은 아무것도 하지 않는 상태가 아니라 움직임 속에서도 판단의 기준을 지키는 힘입니다.",steps:["오늘 반드시 지켜야 할 우선순위 한 가지를 정하고 나머지는 순서를 조정하십시오.","중요한 결정을 내리기 전 사실·감정·추측을 구분해 기록하십시오.","일정 중 짧은 멈춤 시간을 두어 몸과 마음의 상태를 확인하십시오."],domains:{연애:"감정이 흔들릴 때 즉각 반응하기보다 관계의 기본 신뢰와 약속을 돌아보십시오. 차분한 대화가 오해를 줄입니다.",재물:"흥분이나 공포에 따른 매매를 경계하고 자산 배분과 손실 한도를 지키십시오. 중심 있는 원칙이 변동성 속에서 도움이 됩니다.",사업·일:"빠른 확장보다 운영의 기초와 품질 관리가 먼저입니다. 현장을 이해하고 핵심 지표를 꾸준히 확인하십시오.",인간관계:"분위기에 휩쓸려 약속하거나 편을 가르지 마십시오. 자신의 기준을 차분히 설명하고 상대의 입장도 들으십시오.",건강·생활:"바쁜 일정 속에서도 식사와 수면, 회복 시간을 확보하십시오. 지속적인 피로가 있다면 원인을 살피고 전문가와 상담하십시오.",인생:"큰 변화 앞에서 자신을 지탱하는 가치와 습관을 기억하십시오. 중심이 있으면 변화 속에서도 방향을 잃지 않습니다."},advice:"속도보다 중심을 먼저 챙기십시오. 고요하게 살핀 뒤 움직이면 같은 힘으로도 더 정확한 길을 갈 수 있습니다.",hope:"잠시 멈추는 것은 뒤처지는 일이 아닙니다. 중심을 되찾은 한 걸음은 흔들리며 내딛는 열 걸음보다 멀리 갈 수 있습니다."},{n:27,title:"지혜로운 삶의 기술",core:"도덕경 27장은 참된 능숙함은 흔적을 남기지 않고, 잘하는 사람은 사람과 사물을 버리지 않는다고 말합니다. 좋은 기술은 과시가 아니라 세심한 배려와 상황에 맞는 도움으로 드러납니다.",situation:"문제를 해결하려 애쓰지만 주변의 협조가 부족하거나, 누군가의 실수와 부족함을 어떻게 대해야 할지 고민할 수 있습니다. 비난보다 원인을 살피고 다시 잘할 수 있는 조건을 만드는 것이 중요합니다.",hidden:"진정한 능숙함은 자기 실력을 드러내는 데 있지 않고 일이 잘 돌아가도록 돕는 데 있습니다. 사람을 쉽게 포기하지 않는 태도와 함께, 반복되는 문제를 줄이는 체계를 마련해야 합니다.",steps:["문제가 생겼을 때 사람을 탓하기 전에 과정과 환경의 원인을 먼저 살피십시오.","상대가 스스로 해낼 수 있도록 필요한 정보와 도구를 구체적으로 제공하십시오.","잘된 일의 과정을 기록해 다음에도 활용할 수 있는 간단한 기준으로 만드십시오."],domains:{연애:"상대의 부족함을 지적하기보다 서로 잘할 수 있는 방식과 환경을 함께 찾으십시오. 배려는 대신 해주는 것이 아니라 함께 성장하도록 돕는 일입니다.",재물:"복잡한 수익 기법보다 이해할 수 있는 원칙과 점검 절차를 갖추십시오. 모르는 상품이나 구조에는 충분히 확인하기 전 돈을 넣지 마십시오.",사업·일:"숙련된 리더는 모든 일을 직접 처리하기보다 구성원이 역량을 발휘할 수 있도록 과정과 도구를 마련합니다. 실수를 학습과 개선의 기회로 바꾸십시오.",인간관계:"상대의 약점을 이용하거나 공개적으로 망신 주지 마십시오. 조용히 돕되, 반복되는 피해가 생기지 않도록 합리적인 경계도 세우십시오.",건강·생활:"자신에게 맞는 생활 방식을 세심하게 조정하십시오. 몸의 신호를 무시하지 말고 필요할 때 전문적인 도움을 받는 것도 현명한 자기 돌봄입니다.",인생:"자신의 능력을 과시하기보다 주변과 세상에 어떤 도움을 남기는지 돌아보십시오. 좋은 영향은 조용히 오래 이어집니다."},advice:"능숙함은 완벽함이 아니라 세심함과 개선의 태도입니다. 사람을 살리고 과정이 좋아지도록 돕는 선택을 해 보십시오.",hope:"작은 배려와 정확한 도움은 눈에 띄지 않아도 누군가의 길을 바꿉니다. 주군의 경험과 지혜도 그런 방식으로 더 큰 가치를 만들 수 있습니다."},{n:28,title:"부드러움 속의 강인함",core:"도덕경 28장의 요지는 강함과 부드러움, 드러남과 낮춤의 양쪽을 함께 알아 균형을 잃지 않는 데 있습니다. 부드러움을 지닌다고 해서 원칙이 없는 것은 아니며, 강함을 안다고 해서 늘 앞서야 하는 것도 아닙니다.",situation:"강하게 밀어붙여야 할지 한발 물러서야 할지 고민하는 때일 수 있습니다. 지금은 어느 한쪽을 고집하기보다 상황에 맞는 힘의 크기와 표현 방식을 살펴볼 때입니다.",hidden:"참된 강인함은 상대를 누르는 힘보다 자신을 조절하는 힘에 가깝습니다. 부드러움은 약함이 아니라 변화에 적응하면서도 중심을 지키는 능력입니다.",steps:["내가 반드시 지켜야 할 원칙과 양보할 수 있는 방법을 구분해 적어 보십시오.","갈등이 생기면 즉시 맞서기보다 상대의 입장을 먼저 듣고 핵심을 차분히 말하십시오.","오늘 한 가지 상황에서 힘을 과시하는 대신 유연한 해결책을 선택해 보십시오."],domains:{연애:"상대에게 맞추기만 하거나 내 뜻만 관철하지 마십시오. 다정함과 분명한 경계를 함께 세울 때 관계가 오래갑니다.",재물:"공격적인 수익 추구와 지나친 방어 사이에서 균형을 잡으십시오. 감당 가능한 위험 한도를 정하고 원칙을 지키십시오.",사업·일:"리더십은 강압보다 유연한 조정에서 빛납니다. 목표는 분명히 하되 실행 방식은 현장에 맞게 조절하십시오.",인간관계:"부드럽게 말하되 중요한 약속과 기준은 명확히 하십시오. 양보가 반복되어 부담이 된다면 정중하게 선을 그으십시오.",건강·생활:"무리한 의지보다 지속 가능한 생활 리듬이 중요합니다. 활동과 휴식, 도전과 회복을 균형 있게 배치하십시오.",인생:"강함과 부드러움 중 하나를 버릴 필요는 없습니다. 때에 맞게 두 힘을 함께 쓰는 지혜가 삶을 단단하게 합니다."},advice:"부드럽게 대하되 중심을 잃지 마십시오. 유연함은 원칙을 포기하는 일이 아니라 원칙을 오래 지키기 위한 지혜입니다.",hope:"오늘 조금 유연해지는 선택이 내일의 더 큰 가능성을 열 수 있습니다."},{n:29,title:"억지로 얻지 않는 지혜",core:"도덕경 29장은 천하를 자기 뜻대로 움켜쥐고 바꾸려는 태도를 경계합니다. 세상에는 저마다의 흐름과 조건이 있으므로 지나친 개입과 조급한 통제는 오히려 일을 어그러뜨릴 수 있습니다.",situation:"결과를 빨리 만들고 싶어 여러 사람과 상황을 강하게 통제하고 있을 수 있습니다. 지금은 더 밀어붙이는 것이 실제로 도움이 되는지 살펴보십시오.",hidden:"통제하려는 마음 뒤에는 불안과 결과에 대한 집착이 숨어 있을 수 있습니다. 내가 바꿀 수 있는 일과 내 힘으로 좌우할 수 없는 일을 구분하면 불필요한 소모가 줄어듭니다.",steps:["현재 문제를 내가 직접 바꿀 수 있는 것과 기다리거나 받아들여야 하는 것으로 나누십시오.","다른 사람의 몫까지 대신 결정하거나 통제하고 있지는 않은지 점검하십시오.","가장 중요한 한 가지에만 힘을 모으고 나머지는 진행 상황을 지켜보십시오."],domains:{연애:"상대의 감정과 선택을 내 뜻대로 만들려 하지 마십시오. 진심을 전한 뒤에는 상대가 스스로 답할 공간을 존중하십시오.",재물:"시장을 억지로 예측하거나 손실을 만회하려 무리하지 마십시오. 계획과 위험 관리에 집중하고 통제할 수 없는 변동은 인정하십시오.",사업·일:"모든 일을 직접 쥐고 있기보다 역할과 책임을 나누십시오. 고객과 현장의 반응을 살피며 필요한 부분만 조정하십시오.",인간관계:"상대의 삶을 대신 운영하려 하지 마십시오. 조언은 요청받았을 때 건네고 선택의 책임은 각자에게 돌려주십시오.",건강·생활:"몸의 신호를 무시한 채 의지만으로 밀어붙이지 마십시오. 회복이 필요한 때에는 쉬고 지속 가능한 속도를 찾으십시오.",인생:"모든 것을 계획대로 만들 수는 없습니다. 방향을 세우되 삶의 흐름에 맞춰 조정하는 여유를 가지십시오."},advice:"힘을 쓰는 것만이 능사는 아닙니다. 지금은 억지로 움직이기보다 조건을 살피고 꼭 필요한 곳에만 힘을 쓰십시오.",hope:"내려놓는다고 모든 것을 잃는 것은 아닙니다. 불필요한 통제를 덜어내면 새로운 길이 보입니다."},{n:30,title:"승리 뒤의 절제",core:"도덕경 30장은 도로써 군주를 돕는 사람은 무력과 강압으로 세상을 장악하려 하지 않는다고 말합니다. 힘을 사용한 뒤에는 반드시 그 대가와 후유증이 남으므로 성취 뒤에도 절제해야 합니다.",situation:"성과를 얻었거나 경쟁에서 앞서 나가려는 상황일 수 있습니다. 이때 더 큰 확장만 생각하기보다 지금의 성과가 누구에게 어떤 부담을 주는지 살펴보십시오.",hidden:"승리 자체보다 승리 이후의 태도가 사람과 조직의 수준을 드러냅니다. 과도한 자신감과 보복심은 얻은 것을 다시 잃게 만들 수 있습니다.",steps:["최근 성취를 돌아보고 그 과정에서 생긴 부담이나 관계의 상처를 확인하십시오.","성과를 이유로 무리한 확장이나 상대를 압박하는 행동을 하지 않겠다는 기준을 세우십시오.","이긴 뒤에도 겸손하게 결과를 나누고 다음 단계의 위험을 점검하십시오."],domains:{연애:"다툼에서 이기는 것보다 관계를 회복하는 것이 중요합니다. 사과할 부분은 인정하고 상대를 굴복시키려는 말을 멈추십시오.",재물:"수익이 났을 때 위험을 더 키우지 않도록 원칙을 지키십시오. 성과 일부를 지키고 손실 가능성도 함께 관리하십시오.",사업·일:"계약이나 경쟁에서 유리한 위치를 얻어도 상대를 소진시키지 마십시오. 지속 가능한 협력과 신뢰가 장기 성과를 만듭니다.",인간관계:"우위에 있을수록 말과 행동을 조심하십시오. 체면을 세워 주고 공을 나누는 태도가 관계를 지켜 줍니다.",건강·생활:"목표를 달성한 뒤에도 몸을 혹사하지 마십시오. 회복과 유지 관리가 다음 도전을 가능하게 합니다.",인생:"성취는 끝이 아니라 책임의 시작입니다. 무엇을 얻었는지만큼 어떻게 지키고 사용할지도 중요합니다."},advice:"이겼을 때 더 낮아지고, 성취했을 때 더 신중해지십시오. 절제는 성공을 오래 지속시키는 힘입니다.",hope:"오늘의 성과를 겸손하게 다듬으면 내일의 더 단단한 기반이 됩니다."},{n:31,title:"무력보다 생명의 가치",core:"도덕경 31장은 병기와 전쟁을 상서롭지 않은 도구로 보고, 불가피하게 사용하더라도 승리를 기뻐하거나 살상을 미화하지 말라고 가르칩니다. 생명과 평화를 우선하는 태도가 핵심입니다.",situation:"갈등이나 경쟁이 격해져 강경한 대응을 고민하고 있을 수 있습니다. 정당한 방어가 필요한 경우에도 목적이 문제 해결인지 상대를 해치는 것인지 구별해야 합니다.",hidden:"분노에 기대는 승리는 더 큰 상처를 남길 수 있습니다. 힘은 마지막 수단이어야 하며, 가능하다면 피해를 줄이고 생명을 지키는 길을 먼저 찾아야 합니다.",steps:["갈등의 목적을 다시 확인하고 사람을 공격하는 말과 문제를 해결하는 행동을 구분하십시오.","안전과 권리를 지키는 데 필요한 최소한의 대응을 정하고 과잉 보복은 피하십시오.","대화·중재·공식 절차 등 폭력과 모욕을 줄일 수 있는 해결 경로를 찾아보십시오."],domains:{연애:"감정이 격해져도 모욕이나 위협으로 상대를 통제하지 마십시오. 안전이 위협받는 관계라면 믿을 수 있는 사람과 전문기관의 도움을 우선하십시오.",재물:"경쟁에서 이기기 위해 타인을 속이거나 해치는 선택은 장기적으로 큰 위험을 부릅니다. 정직한 기준과 합법적 절차를 지키십시오.",사업·일:"경쟁사를 무너뜨리는 데 집중하기보다 고객에게 더 나은 가치를 제공하십시오. 갈등은 기록과 절차를 통해 해결하십시오.",인간관계:"상처를 주고받는 말싸움에서 빠져나오십시오. 필요한 경계는 세우되 상대의 존엄을 해치지 않는 표현을 선택하십시오.",건강·생활:"분노와 긴장이 몸에 쌓이지 않도록 안전한 방식으로 감정을 다루십시오. 위협이나 폭력이 있다면 즉시 안전을 확보하십시오.",인생:"힘을 가졌다는 이유로 함부로 쓰지 않는 것이 진정한 힘입니다. 생명을 존중하는 선택이 더 큰 용기입니다."},advice:"강한 대응이 필요한 순간에도 생명과 존엄을 기준으로 삼으십시오. 이기는 것보다 피해를 줄이고 평화를 회복하는 일이 더 중요할 때가 많습니다.",hope:"갈등 속에서도 더 나은 길을 선택할 수 있습니다. 생명을 존중하는 마음은 새로운 화해의 출발점입니다."},{n:32,title:"이름 없는 근원",core:"도덕경 32장은 도를 이름 붙일 수 없는 소박한 근원으로 비유합니다. 이름과 구분은 일을 위해 필요하지만, 그것에 지나치게 매이면 근본을 잊기 쉽습니다. 만물이 제자리를 찾도록 하는 절제와 자연스러움이 중요합니다.",situation:"직함·평판·성과처럼 바깥의 이름이 자신의 가치보다 커져 있지는 않은지 돌아볼 때입니다. 복잡해진 일을 단순한 원칙으로 되돌려 보십시오.",hidden:"이름은 대상을 설명하는 도구이지 대상의 전부가 아닙니다. 본질을 기억하면 남의 평가에 휘둘리지 않고 필요한 질서를 세울 수 있습니다.",steps:["지금 중요하게 여기는 목표에서 겉치레와 실제 가치를 구분하십시오.","복잡한 약속이나 계획을 핵심 원칙 몇 가지로 정리하십시오.","성과를 과시하기보다 일이 자연스럽게 지속될 수 있는 구조를 만드십시오."],domains:{연애:"관계의 이름이나 겉으로 보이는 조건보다 서로를 대하는 실제 태도를 살피십시오. 진심과 존중이 관계의 바탕입니다.",재물:"유행하는 이름이나 상품의 이미지보다 실제 가치와 조건을 확인하십시오. 이해하지 못하는 투자에는 서두르지 마십시오.",사업·일:"브랜드와 직함도 중요하지만 고객에게 제공하는 본질적 가치가 먼저입니다. 조직의 목적을 간결하게 공유하십시오.",인간관계:"사람을 직업·지위·평판만으로 판단하지 마십시오. 이름표 뒤에 있는 사정과 인격을 보려는 태도가 필요합니다.",건강·생활:"건강을 보여 주는 숫자나 유행만 좇기보다 자신의 몸 상태와 생활 습관을 꾸준히 살피십시오. 필요한 검진은 전문가와 상의하십시오.",인생:"세상의 평가가 바뀌어도 삶의 근본 가치는 쉽게 바뀌지 않습니다. 무엇을 위해 사는지 조용히 되새기십시오."},advice:"이름과 형식은 활용하되 그것에 갇히지 마십시오. 본질을 붙들면 복잡한 선택도 한결 단순해집니다.",hope:"겉모습을 덜어낼수록 자신에게 정말 중요한 것이 선명해집니다."},{n:33,title:"자신을 아는 지혜",core:"도덕경 33장은 남을 아는 것은 지혜이고 자신을 아는 것은 밝음이며, 남을 이기는 것은 힘이고 자신을 이기는 것은 강함이라고 말합니다. 자기 인식과 자기 절제가 진정한 성장의 기준입니다.",situation:"다른 사람의 평가와 경쟁에 마음이 쏠려 있다면 자신의 기준과 현재 상태를 먼저 살펴보십시오. 무엇을 원하는지, 무엇을 감당할 수 있는지 아는 것이 출발점입니다.",hidden:"자신을 안다는 것은 자신을 무조건 높이거나 낮추는 일이 아닙니다. 장점과 한계, 욕구와 두려움을 있는 그대로 알아차리고 선택의 책임을 지는 태도입니다.",steps:["현재 자신의 강점 세 가지와 보완할 점 한 가지를 솔직하게 적으십시오.","반복되는 감정이나 행동의 원인을 살피고 바꿀 수 있는 습관 하나를 정하십시오.","남과 비교하는 시간을 줄이고 자신이 세운 기준에 맞춘 작은 행동을 실행하십시오."],domains:{연애:"상대의 마음을 읽으려 애쓰기 전에 내가 원하는 관계와 두려워하는 것을 솔직히 알아보십시오. 자기 이해가 건강한 대화의 토대입니다.",재물:"자신의 위험 감수 성향과 투자 목적을 파악하십시오. 남의 수익률을 따라가기보다 본인이 감당할 수 있는 계획을 세우십시오.",사업·일:"자신이 잘하는 일과 도움을 받아야 할 일을 구분하십시오. 부족한 점을 인정하고 적합한 동료와 협력하는 것도 능력입니다.",인간관계:"상대의 잘못만 보기 전에 내 말과 행동이 관계에 미친 영향도 돌아보십시오. 책임질 부분을 인정하면 관계가 성숙해집니다.",건강·생활:"몸의 신호와 생활 패턴을 관찰하십시오. 무리한 목표보다 자신의 체력과 상황에 맞는 습관을 꾸준히 이어가십시오.",인생:"자신을 이해하는 만큼 선택이 자유로워집니다. 남의 길이 아니라 자신의 가치와 한계에 맞는 길을 걸으십시오."},advice:"남을 이기려는 힘을 자신을 다스리는 힘으로 바꾸십시오. 자기 이해는 겸손과 자신감을 함께 키웁니다.",hope:"자신을 조금 더 정확히 이해하는 오늘이 더 자유로운 내일의 시작입니다."},{n:34,title:"모든 것을 품는 큰길",core:"도덕경 34장은 큰 도가 만물을 낳고 기르면서도 소유하거나 지배하지 않는다고 말합니다. 넓은 품은 모든 것을 감싸되 자신의 공으로 내세우지 않는 태도입니다.",situation:"가족이나 조직, 공동체에서 여러 사람의 필요를 조율해야 하는 때일 수 있습니다. 모두를 품으려 하되 모든 책임을 혼자 떠안지는 마십시오.",hidden:"큰 마음은 무조건 허용하는 마음이 아닙니다. 각자가 성장할 자리를 주고, 필요한 질서를 세우며, 공을 독차지하지 않는 넉넉함입니다.",steps:["함께하는 사람들의 필요와 역할을 먼저 듣고 정리하십시오.","도움을 주되 상대가 스스로 해낼 수 있는 몫까지 대신하지 마십시오.","공동의 성과가 생기면 기여한 사람들과 공을 나누고 다음 성장을 지원하십시오."],domains:{연애:"사랑은 상대를 소유하는 일이 아니라 서로의 성장을 품는 일입니다. 관심과 배려를 주되 각자의 자유와 공간도 존중하십시오.",재물:"돈을 자기 과시의 수단으로만 보지 말고 생활의 안정과 가족·공동체의 필요를 함께 고려하십시오. 나눔도 지속 가능한 범위에서 계획하십시오.",사업·일:"성과를 혼자 차지하지 말고 구성원의 기여를 인정하십시오. 조직이 성장할 수 있도록 권한과 기회를 나누십시오.",인간관계:"사람마다 다른 속도와 사정을 품되 반복되는 무례나 피해에는 분명한 경계를 세우십시오. 포용과 방임은 다릅니다.",건강·생활:"돌봄을 베푸는 사람도 자신의 회복이 필요합니다. 타인을 챙기는 만큼 휴식과 건강을 위한 시간을 확보하십시오.",인생:"큰길은 한 사람만을 위한 길이 아닙니다. 나의 성장이 다른 존재의 삶에도 도움이 되는 방향을 찾아보십시오."},advice:"넓게 품되 소유하려 하지 마십시오. 함께 성장할 공간을 만드는 사람이 오래도록 신뢰를 얻습니다.",hope:"당신의 작은 배려가 누군가에게는 다시 일어설 힘이 될 수 있습니다."},{n:35,title:"큰 뜻을 품는 마음",core:"도덕경 35장은 큰 형상을 붙들면 천하가 그에게로 향하지만, 도의 참된 맛은 담박하여 눈과 귀를 자극하지 않는다고 말합니다. 화려한 자극보다 오래 머무는 근본의 가치를 알아보라는 뜻입니다.",situation:"눈에 띄는 성과나 강한 자극에 끌려 방향을 바꾸고 싶을 수 있습니다. 잠시 멈추어 지금의 선택이 자신의 큰 뜻과 맞는지 확인하십시오.",hidden:"큰 뜻은 거창한 구호가 아니라 매일의 선택을 이끄는 조용한 기준입니다. 화려함이 없어도 가치 있는 일은 꾸준히 사람을 모읍니다.",steps:["내가 오래 지키고 싶은 가치와 목표를 한 문장으로 적으십시오.","당장의 자극이나 유행 때문에 그 목표에서 벗어나고 있는 부분을 찾아보십시오.","눈에 띄지 않아도 목표에 가까워지는 작은 행동을 오늘 반복하십시오."],domains:{연애:"강렬한 표현보다 일관된 배려와 신뢰를 소중히 여기십시오. 오래 함께할 관계는 일상의 작은 진심에서 자랍니다.",재물:"단기 유행과 과장된 수익 약속보다 자신의 재무 목표와 원칙을 우선하십시오. 이해 가능한 계획을 꾸준히 지키십시오.",사업·일:"큰 비전을 세우되 고객에게 주는 실제 가치로 증명하십시오. 화려한 홍보보다 신뢰할 수 있는 품질과 지속성이 중요합니다.",인간관계:"눈에 띄는 사람만 좇지 말고 조용히 신뢰를 쌓는 사람을 알아보십시오. 관계의 깊이는 일관된 행동에서 드러납니다.",건강·생활:"극단적인 건강 유행보다 수면·식사·움직임의 기본을 지키십시오. 작고 담백한 습관이 장기적으로 도움이 됩니다.",인생:"큰 뜻을 품되 조급하게 증명하려 하지 마십시오. 방향이 바르면 평범한 하루도 의미 있는 걸음이 됩니다."},advice:"화려함보다 오래 지속되는 가치를 선택하십시오. 큰 뜻은 소란스러운 선언보다 조용한 실천으로 완성됩니다.",hope:"오늘의 소박한 한 걸음도 큰 뜻을 향한 분명한 전진입니다."},{n:36,title:"줄어듦 속에 숨은 성장",core:"도덕경 36장은 무엇을 거두려면 먼저 펼쳐지고, 약하게 하려면 먼저 강해지는 등 사물의 변화에는 역설적인 흐름이 있음을 말합니다. 이 구절은 남을 조종하라는 뜻이 아니라 변화의 징후와 힘의 작용을 신중히 살피라는 경계로 읽을 수 있습니다.",situation:"무언가가 줄거나 약해지는 듯 보여 불안할 수 있습니다. 그것을 곧바로 실패로 단정하지 말고 변화가 일어나는 원인과 다음 흐름을 차분히 살펴보십시오.",hidden:"모든 감소가 성장의 전조인 것은 아니지만, 줄어드는 과정에서 불필요한 것을 덜고 핵심을 회복할 기회가 생길 수 있습니다. 반대로 겉으로 커지는 일에도 취약성이 숨어 있을 수 있습니다.",steps:["최근 줄어든 것과 늘어난 것을 기록하고 그 원인을 사실에 근거해 살펴보십시오.","겉으로 드러난 규모보다 지속 가능성과 숨은 위험을 점검하십시오.","불필요한 부담 하나를 줄이고 핵심 역량이나 관계에 자원을 다시 배분하십시오."],domains:{연애:"관계의 열기가 잠시 줄었다고 곧바로 끝을 단정하지 마십시오. 다만 반복되는 무관심이나 상처는 외면하지 말고 대화로 확인하십시오.",재물:"가격이나 자산 규모의 일시적 변화만으로 결론 내리지 마십시오. 기업·자산의 기초 여건과 위험을 다시 확인하고 손실 감당 범위를 지키십시오.",사업·일:"매출이나 조직 규모가 커지는 것만을 성장으로 보지 마십시오. 비용 구조와 품질, 현금 흐름을 살피며 내실을 다지십시오.",인간관계:"관계가 멀어지는 시기에는 억지로 붙잡기보다 원인을 살펴보십시오. 서로에게 필요한 거리와 회복의 시간을 존중하십시오.",건강·생활:"체중이나 체력의 변화는 단일 수치만으로 판단하지 말고 전체 건강 상태를 살피십시오. 급격하거나 우려되는 변화는 의료 전문가와 상의하십시오.",인생:"덜어내는 과정은 때로 중요한 것을 다시 발견하게 합니다. 잃은 것만 세지 말고 무엇을 회복하고 배울 수 있는지 살펴보십시오."},advice:"변화의 겉모습에 서둘러 판단을 내리지 마십시오. 줄어드는 과정에서는 원인을 확인하고, 커지는 과정에서는 위험을 살피는 균형이 필요합니다.",hope:"지금의 변화가 무엇을 가르치는지 차분히 살펴보십시오. 덜어낸 자리에서 더 중요한 것을 키울 수 있습니다."},{n:37,title:"무위의 완성",core:"도덕경 37장은 도가 억지로 움직이지 않지만 만물이 저절로 이루어진다고 말합니다. 무위는 손을 놓고 방치하는 태도가 아니라, 불필요한 강제를 덜어 사물과 사람이 제 힘을 발휘하도록 돕는 지혜입니다.",situation:"일이 뜻대로 되지 않아 더 세게 밀어붙이고 싶을 수 있습니다. 지금은 행동량을 늘리기보다 무엇이 과도한 통제인지 살펴볼 때입니다. 꼭 해야 할 일은 분명히 하되, 나머지는 자랄 여지를 주십시오.",hidden:"성과를 가로막는 원인이 능력 부족이 아니라 지나친 개입과 조급함일 수 있습니다. 목표는 유지하되 방법을 유연하게 바꾸면 사람과 일의 자발성이 살아납니다.",steps:["지금 억지로 통제하려는 일 한 가지를 찾아, 꼭 필요한 개입과 불필요한 간섭을 나누십시오.","상대가 스스로 판단하고 실행할 수 있도록 기준과 권한을 명확히 건네십시오.","오늘은 가장 중요한 한 가지에 집중하고, 나머지는 점검할 시간을 정해 기다리십시오."],domains:{연애:"상대의 감정과 선택을 내 방식대로 바꾸려 하지 마십시오. 마음을 전하되 답을 재촉하지 않고 서로의 자율성을 존중하십시오.",재물:"불안 때문에 잦은 매매나 무리한 통제를 반복하지 말고, 원칙·분산·현금흐름을 정해 계획대로 관리하십시오.",사업·일:"모든 일을 직접 쥐기보다 목적과 기준을 공유하고 담당자가 역량을 발휘하게 하십시오. 절차를 줄이되 책임은 분명히 하십시오.",인간관계:"충고를 앞세우기보다 먼저 듣고, 도움을 요청받은 부분에 정확히 힘을 보태십시오.",건강·생활:"몸을 몰아붙이는 극단적 계획보다 지속 가능한 수면·식사·운동 리듬을 만드십시오.",인생:"모든 결과를 즉시 만들어 내야 한다는 부담을 내려놓으십시오. 방향을 바로 세우고 꾸준히 돌보면 변화가 자랄 공간이 생깁니다."},advice:"힘을 더하는 것만이 해결책은 아닙니다. 오늘은 불필요한 힘을 하나 덜어 내고, 꼭 필요한 일에만 정성을 모으십시오.",hope:"억지로 밀지 않아도 자랄 수 있는 길이 있습니다. 여백을 만든 자리에서 새로운 가능성이 시작됩니다."},{n:38,title:"참된 덕과 겉치레",core:"도덕경 38장은 참된 덕은 스스로 덕을 내세우지 않지만 자연스럽게 덕을 행하고, 덕을 의식적으로 과시할수록 본래의 마음에서 멀어질 수 있다고 말합니다. 핵심은 겉모양보다 마음에서 우러나는 실천입니다.",situation:"칭찬이나 인정이 부족해 자신의 노력이 헛된 듯 느껴질 수 있습니다. 지금은 남에게 보이는 모습보다 실제로 무엇을 지키고 있는지 돌아보십시오.",hidden:"선한 행동조차 보상과 평판을 얻기 위한 수단이 되면 마음이 쉽게 지칩니다. 진심과 체면을 구분하고, 말보다 행동의 일관성을 살피는 것이 중요합니다.",steps:["최근 한 행동 가운데 인정받기 위해 한 일과 진심으로 필요해서 한 일을 구분해 보십시오.","약속·책임·배려 중 오늘 실제 행동으로 보여 줄 한 가지를 정하십시오.","자신의 선행이나 성과를 과장하지 말고, 결과와 부족한 점을 담담히 확인하십시오."],domains:{연애:"사랑을 증명하려는 말보다 꾸준한 배려와 약속을 지키는 행동이 신뢰를 만듭니다.",재물:"부를 과시하는 소비보다 실제 필요와 장기적 안정에 맞춰 지출하십시오. 겉으로 보이는 성공과 재정 건전성을 구분하십시오.",사업·일:"홍보 문구보다 제품과 서비스의 품질, 고객과의 약속 이행을 우선하십시오. 윤리와 실력이 평판의 토대입니다.",인간관계:"도움을 주고 대가를 기대하거나 생색내지 않는 연습을 하십시오. 다만 반복적으로 이용당하지 않도록 건강한 경계도 세우십시오.",건강·생활:"건강해 보이는 이미지보다 실제 몸의 상태와 생활 습관을 살피십시오. 꾸준한 기본기가 중요합니다.",인생:"타인의 평가보다 스스로 납득할 수 있는 기준을 세우십시오. 조용히 쌓은 진실한 행동은 삶의 중심을 단단하게 합니다."},advice:"겉으로 훌륭해 보이는 것보다 실제로 바른 일을 선택하십시오. 진심은 과장하지 않아도 행동 속에서 드러납니다.",hope:"누가 알아주지 않아도 가치 있는 일은 사라지지 않습니다. 진실한 하루가 쌓여 주군의 삶을 깊게 만듭니다."},{n:39,title:"하나로 이어지는 생명",core:"도덕경 39장은 만물이 하나의 근원과 조화를 통해 존재한다고 바라봅니다. 하늘과 땅, 정신과 삶의 각 요소가 제자리를 얻을 때 온전함이 유지된다는 뜻입니다.",situation:"일·가족·건강·마음 가운데 한 부분에만 힘이 쏠려 전체 균형이 흔들릴 수 있습니다. 지금은 어느 한 가지 성취보다 삶을 이루는 요소들의 연결을 살펴보십시오.",hidden:"문제는 개별 사건 하나보다 서로 연결된 균형의 붕괴일 수 있습니다. 한 부분을 무리하게 끌어올리기보다 기본을 회복하면 전체가 안정될 수 있습니다.",steps:["현재 삶을 일·관계·건강·마음·재정으로 나누어 어느 부분이 지나치게 소홀한지 확인하십시오.","가장 약해진 한 부분을 회복할 작은 행동을 이번 주 일정에 넣으십시오.","함께하는 사람과 공동의 목표를 확인하고, 서로 맡은 역할을 조정하십시오."],domains:{연애:"한 사람만 맞추는 관계가 아니라 서로가 존중받는 균형을 만들어 가십시오.",재물:"수익만 보지 말고 현금흐름·부채·위험·생활비를 함께 살펴 전체 재정의 균형을 맞추십시오.",사업·일:"개인의 성과와 조직 전체의 지속 가능성을 함께 보십시오. 부서와 사람 사이의 연결이 막힌 곳을 풀어 주십시오.",인간관계:"서로 다른 역할과 형편을 인정하고 공동의 기반을 찾으십시오. 차이를 없애기보다 조화를 이루는 것이 중요합니다.",건강·생활:"운동 하나에만 매달리지 말고 수면·영양·움직임·휴식의 균형을 돌보십시오.",인생:"삶은 한 가지 성취만으로 완성되지 않습니다. 자신과 주변, 일과 쉼이 함께 설 자리를 마련하십시오."},advice:"부분의 성공이 전체의 평화를 해치지 않는지 살피십시오. 제자리를 찾는 작은 조정이 큰 조화를 만듭니다.",hope:"흩어진 것들도 다시 연결될 수 있습니다. 균형을 회복하려는 오늘의 선택이 삶을 온전하게 합니다."},{n:40,title:"돌아감이 곧 시작",core:"도덕경 40장은 되돌아감이 도의 움직임이며, 약하고 부드러운 것이 도의 작용이라고 말합니다. 돌아감은 퇴보가 아니라 지나친 것을 덜고 근본으로 회복하는 순환입니다.",situation:"계획이 되돌아가거나 기대한 진전이 멈춘 듯 보일 수 있습니다. 이를 실패로 단정하지 말고 무엇을 다시 점검하고 회복해야 하는지 살펴보십시오.",hidden:"앞으로만 나아가려는 마음이 오히려 소진을 만들 수 있습니다. 기본으로 돌아가면 놓친 조건과 단순한 해결책이 보일 수 있습니다.",steps:["최근 무리하게 확장하거나 서둘렀던 부분을 하나 찾아 속도를 조정하십시오.","처음 시작한 이유와 반드시 지켜야 할 원칙을 다시 적어 보십시오.","잠시 멈춘 뒤 다시 시작할 수 있도록 시간·비용·체력을 현실적으로 배분하십시오."],domains:{연애:"관계가 어긋났다면 처음의 존중과 경청으로 돌아가십시오. 다만 상처나 폭력이 반복되는 관계라면 안전과 도움을 우선하십시오.",재물:"손실을 만회하려고 위험을 키우지 말고 예산과 투자 원칙을 재점검하십시오. 필요하면 규모를 줄여 안정성을 회복하십시오.",사업·일:"확장보다 핵심 제품·고객·현금흐름을 점검하십시오. 기본이 약해졌다면 단순한 구조로 되돌리는 것이 재출발의 힘입니다.",인간관계:"오해가 생겼다면 추측을 멈추고 사실과 처음의 약속을 확인하십시오.",건강·생활:"몸이 지쳤다면 강도를 낮추고 휴식과 기본 생활 리듬부터 회복하십시오. 지속되거나 심한 증상은 의료진과 상의하십시오.",인생:"되돌아보는 시간은 낭비가 아닙니다. 무엇이 중요한지 다시 확인하면 다음 걸음이 더 단단해집니다."},advice:"잠시 돌아가는 길이 반드시 길을 잃었다는 뜻은 아닙니다. 근본을 회복한 뒤 다시 걸으십시오.",hope:"다시 시작할 수 있는 힘은 언제나 작은 기본에서 나옵니다. 오늘의 회복이 새로운 출발점입니다."},{n:41,title:"역설 속의 진리",core:"도덕경 41장은 큰 도를 들은 사람은 힘써 따르지만, 중간 사람은 반신반의하고, 얕은 사람은 비웃을 수 있다고 말합니다. 참된 길은 겉으로 즉시 드러나지 않고 때로는 역설처럼 보입니다.",situation:"주변의 반응이 엇갈리거나 자신의 선택이 남들에게 이해받지 못할 수 있습니다. 다수의 평가만으로 옳고 그름을 정하지 말고 선택의 근거를 차분히 살피십시오.",hidden:"깊은 변화는 화려한 시작보다 꾸준한 실천으로 드러납니다. 당장 인정받지 못한다고 가치가 없는 것은 아니지만, 반대 의견을 무조건 무시해서도 안 됩니다.",steps:["자신이 믿는 선택의 이유를 사실과 가치로 나누어 적으십시오.","비판 가운데 검토할 만한 근거가 있는 부분은 겸손하게 확인하십시오.","결과를 서두르지 말고 작은 실천과 점검을 반복해 방향을 검증하십시오."],domains:{연애:"남들이 정한 관계의 기준보다 두 사람 사이의 존중과 안전, 신뢰를 기준으로 삼으십시오.",재물:"모두가 몰리는 선택이나 남들이 비웃는 선택이라는 이유만으로 결정하지 마십시오. 근거·위험·시간 범위를 따져 판단하십시오.",사업·일:"새로운 방식은 처음에 낯설 수 있습니다. 고객 반응과 데이터를 통해 검증하며 개선하십시오.",인간관계:"생각이 다르다고 상대를 낮추지 마십시오. 조롱과 맹신을 피하고 서로의 근거를 확인하십시오.",건강·생활:"유행하는 방법보다 자신에게 맞고 근거가 있는 습관을 선택하십시오. 효과와 부작용을 살피십시오.",인생:"남의 인정이 늦더라도 자신의 원칙을 점검하며 꾸준히 나아가십시오. 진정한 길은 시간이 지나며 실천으로 드러납니다."},advice:"낯설다는 이유로 버리지 말고, 익숙하다는 이유로 맹신하지 마십시오. 열린 마음과 꾸준한 검증이 지혜를 지킵니다.",hope:"지금은 이해받지 못하는 길도 성실한 실천으로 의미를 드러낼 수 있습니다. 주군의 걸음을 믿되 늘 배우는 마음을 간직하십시오."},{n:42,title:"창조와 탄생",core:"도덕경 42장은 도에서 하나가 생기고, 하나에서 둘과 셋, 그리고 만물이 생겨난다는 생성의 흐름을 말합니다. 만물은 서로 기대어 살아가며, 조화는 대립하는 힘을 함께 품는 데서 비롯됩니다.",situation:"새로운 일이나 관계가 시작되거나 여러 조건이 한꺼번에 얽혀 복잡하게 느껴질 수 있습니다. 결과만 서두르지 말고 시작의 씨앗과 주변 조건을 살피십시오.",hidden:"어떤 성취도 혼자 만들어지지 않습니다. 눈에 보이는 주체뿐 아니라 협력자·환경·시간·작은 조건이 함께 결과를 만듭니다.",steps:["지금 시작하려는 일의 가장 작은 씨앗과 반드시 필요한 조건을 적으십시오.","도움을 주고받을 사람과 자원을 확인하고 감사와 역할을 분명히 하십시오.","서로 다른 의견이나 조건을 적으로 보지 말고 조화를 이룰 방법을 찾아 작은 실험을 시작하십시오."],domains:{연애:"두 사람이 각자의 다름을 지닌 채 새로운 관계의 문화를 함께 만들어 가십시오.",재물:"수입원과 지출 구조, 위험 요인이 어떻게 연결되는지 살피십시오. 한 가지 수치만 보고 판단하지 마십시오.",사업·일:"아이디어 하나가 제품과 조직, 고객 경험으로 자라도록 단계별 조건과 협력 관계를 설계하십시오.",인간관계:"사람마다 역할과 관점이 다름을 인정하십시오. 차이를 연결할 공통 목적을 찾으십시오.",건강·생활:"건강은 식사·수면·활동·정서·환경이 함께 작용합니다. 한 가지 방법에만 의존하지 말고 전체 생활을 살피십시오.",인생:"새로운 가능성은 작은 시작과 여러 인연이 만나며 자랍니다. 혼자 모든 것을 해내려 하지 마십시오."},advice:"시작을 소중히 여기고, 그 시작을 돕는 조건과 사람을 함께 돌보십시오. 조화로운 연결이 성장의 바탕입니다.",hope:"작은 씨앗에도 여러 가능성이 담겨 있습니다. 오늘 맺은 좋은 연결이 내일의 큰 결실로 이어질 수 있습니다."},{n:43,title:"부드러움의 위대한 힘",core:"도덕경 43장은 세상에서 가장 부드러운 것이 가장 단단한 것을 뚫고 들어갈 수 있으며, 형체 없는 것이 틈 없는 곳에도 스며든다고 말합니다. 부드러움과 침묵, 꾸준함의 힘을 강조합니다.",situation:"강한 대립이나 막힌 문제 앞에서 더 강하게 맞서야 할지 고민할 수 있습니다. 정면충돌 외에 유연하게 접근할 길이 있는지 찾아보십시오.",hidden:"강압은 당장의 복종을 만들 수 있어도 마음을 얻지 못합니다. 부드러운 태도는 약함이 아니라 상대와 상황을 움직이는 섬세한 힘일 수 있습니다.",steps:["갈등에서 상대를 꺾으려는 목표를 잠시 내려놓고 해결해야 할 문제를 분리하십시오.","말을 줄이고 질문과 경청을 늘려 상대가 받아들일 수 있는 작은 접점을 찾으십시오.","한 번에 바꾸려 하지 말고 매일 반복할 수 있는 작은 행동으로 변화를 이어 가십시오."],domains:{연애:"상대의 마음을 압박하기보다 부드럽게 표현하고 충분히 들으십시오. 다정함과 분명한 경계를 함께 지키십시오.",재물:"조급한 한 방보다 작은 저축과 장기적 원칙이 재정의 틈을 메웁니다.",사업·일:"강한 지시만으로 해결되지 않는 문제는 현장의 목소리를 듣고 작은 개선을 반복하십시오.",인간관계:"논쟁에서 이기기보다 관계를 살릴 표현을 선택하십시오. 필요한 말은 차분하고 분명하게 전하십시오.",건강·생활:"무리한 극단보다 몸에 맞는 낮은 강도의 꾸준한 움직임과 회복 습관을 이어 가십시오.",인생:"큰 변화는 때로 조용한 반복에서 시작됩니다. 부드럽지만 포기하지 않는 태도를 기르십시오."},advice:"부드럽게 대한다고 뜻을 굽히는 것은 아닙니다. 목표는 지키되 방법은 유연하게 선택하십시오.",hope:"작은 물방울이 바위를 바꾸듯, 꾸준한 부드러움은 막힌 길에도 틈을 냅니다."},{n:44,title:"만족과 행복",core:"도덕경 44장은 명예와 몸, 재물과 만족을 비교하며 무엇을 더 귀하게 여길지 묻습니다. 지나친 욕망과 소유가 삶을 위태롭게 할 수 있으므로 만족의 기준을 세우라는 가르침입니다.",situation:"더 많이 얻어야 안심할 수 있다는 압박이나 남과 비교하는 마음이 커졌을 수 있습니다. 지금 가진 것과 잃고 싶지 않은 가치를 함께 살펴보십시오.",hidden:"욕망 자체보다 끝을 정하지 않은 욕망이 마음을 소모시킵니다. 성공의 기준을 타인의 시선에 맡기면 얻고도 만족하기 어렵습니다.",steps:["내가 반드시 지키고 싶은 것 세 가지를 적고, 그것을 해치는 과도한 욕심이 있는지 살피십시오.","돈·시간·에너지를 어디에 쓰는지 확인하고 가치와 맞지 않는 지출이나 약속 하나를 조정하십시오.","오늘 이미 충분히 누리고 있는 것 한 가지에 감사하고, 더 원하는 이유를 스스로에게 물으십시오."],domains:{연애:"상대에게 끊임없이 증명을 요구하기보다 함께 누리는 시간과 신뢰를 소중히 여기십시오.",재물:"수익 목표뿐 아니라 감당 가능한 위험과 생활의 안정선을 정하십시오. 더 벌려는 욕심이 기반을 해치지 않도록 하십시오.",사업·일:"외형 확장만을 성공으로 보지 말고 수익성·품질·지속 가능성을 함께 따지십시오.",인간관계:"인맥의 숫자보다 서로 믿고 의지할 수 있는 관계를 소중히 여기십시오.",건강·생활:"몸을 성과의 도구로만 대하지 말고 충분한 휴식과 균형 잡힌 생활을 지키십시오.",인생:"무엇을 더 가질지뿐 아니라 무엇으로 충분한지 정하십시오. 만족은 포기가 아니라 삶의 주도권을 되찾는 기준입니다."},advice:"더 많이 얻는 일과 더 잘 사는 일은 언제나 같지 않습니다. 소중한 것을 지키는 선택이 진정한 풍요를 만듭니다.",hope:"이미 가진 소중함을 알아보는 순간 마음은 한결 넉넉해집니다. 만족을 아는 사람에게 내일을 준비할 힘도 생깁니다."},{n:45,title:"불완전 속의 완전함",core:"도덕경 45장은 크게 완성된 것은 다소 모자란 듯 보이고, 크게 곧은 것은 굽은 듯하며, 큰 기교는 서툰 듯하다고 말합니다. 참된 완성은 겉으로 완벽해 보이는 모습과 다를 수 있습니다.",situation:"완벽하게 해내야 한다는 부담 때문에 시작을 미루거나, 작은 부족함을 실패로 여기고 있을 수 있습니다. 지금은 완벽한 모양보다 실제로 살아 움직이는 완성을 살펴보십시오.",hidden:"겉으로 빈틈없는 모습에 집착하면 배움과 개선의 여지가 사라집니다. 여백과 부족함을 인정할 때 오히려 더 오래 지속되는 완성에 가까워집니다.",steps:["완벽해야 한다는 기준 때문에 미루는 일 하나를 골라 오늘 가능한 첫 단계만 실행하십시오.","결과에서 잘된 점과 보완할 점을 함께 기록하고, 부족함을 자기비난이 아닌 개선 자료로 사용하십시오.","일·휴식·관계의 균형을 점검해 오래 지속할 수 있는 속도와 방식을 정하십시오."],domains:{연애:"완벽한 상대를 찾기보다 서로의 부족함을 존중하고 함께 성장할 수 있는 관계인지 살피십시오.",재물:"완벽한 시장 예측을 기다리기보다 목표와 위험 한도를 정하고, 확인 가능한 정보에 따라 신중히 결정하십시오.",사업·일:"초기 결과가 완벽하지 않아도 고객 반응을 듣고 개선하십시오. 다만 안전과 품질의 필수 기준은 타협하지 마십시오.",인간관계:"실수 없는 사람보다 실수를 인정하고 고칠 줄 아는 사람과 신뢰를 쌓으십시오.",건강·생활:"하루도 빠짐없는 완벽한 루틴보다 다시 돌아올 수 있는 현실적인 습관을 만드십시오.",인생:"삶의 완성은 흠이 없는 상태가 아니라 부족함을 배우고 조정하며 자기 길을 살아가는 과정입니다."},advice:"완벽해질 때까지 기다리지 마십시오. 부족함을 인정하되 오늘 할 수 있는 일을 성실히 해내는 것이 진짜 완성으로 가는 길입니다.",hope:"아직 다 이루지 못했다는 사실은 가능성이 남아 있다는 뜻이기도 합니다. 오늘의 한 걸음이 충분히 의미 있습니다."},{n:46,title:"욕망을 내려놓는 자유",core:"도덕경 46장은 도가 세상에 펼쳐질 때 말이 달리고 전쟁의 말이 들판에서 새끼를 낳는다고 대비합니다. 반대로 도가 사라지면 전쟁과 욕망이 커집니다. 가장 큰 화는 만족할 줄 모르는 데서 오며, 만족을 아는 것이 넉넉함이라고 가르칩니다.",situation:"더 많이 가져야 안심할 수 있다고 느끼거나, 남과 비교하며 이미 가진 것을 작게 여기고 있을 수 있습니다. 목표를 세우는 일 자체가 잘못은 아니지만, 그 목표가 삶을 소진시키고 있는지 살펴볼 때입니다.",hidden:"욕망은 끝없이 다음 목표를 만들지만 만족은 현재의 삶을 회복시킵니다. 이 장은 성장을 포기하라는 뜻이 아니라, 무엇을 위해 더 가지려 하는지 묻습니다. 필요와 과시, 계획과 탐욕을 구별하면 선택의 주도권을 되찾을 수 있습니다.",steps:["지금 원하는 것들을 적고, 생존과 책임에 필요한 것과 비교·과시에서 비롯된 것을 구분하십시오.","소비나 투자 결정을 하기 전 목적·비용·감당 가능한 손실을 확인하고 하루의 숙려 시간을 두십시오.","이미 충분히 잘 유지하고 있는 삶의 요소 세 가지를 기록하고, 그것을 지키는 행동을 하나 정하십시오."],domains:{연애:"사랑을 소유나 확인 경쟁으로 만들지 마십시오. 상대를 바꾸려는 요구보다 함께 누리는 시간과 서로의 자율성을 소중히 여기십시오.",재물:"더 높은 수익만 좇기보다 필요한 자금, 비상 여력, 손실 감내 범위를 먼저 정하십시오. 만족은 무계획이 아니라 기준을 갖는 데서 옵니다.",사업·일:"매출 확대만이 성공의 전부인지 점검하십시오. 수익성·현금흐름·고객 신뢰를 함께 살피고 무리한 확장보다 지속 가능한 성장을 선택하십시오.",인간관계:"남의 성취와 비교해 관계를 평가하지 마십시오. 인정받으려는 경쟁을 줄이고 서로에게 실제로 필요한 도움을 주고받으십시오.",건강·생활:"과로와 과식, 과도한 자극을 줄이고 수면·식사·움직임의 기본을 회복하십시오. 건강 문제는 자기 판단만으로 단정하지 말고 필요한 경우 전문가와 상의하십시오.",인생:"원하는 것을 이루는 일과 지금의 삶을 누리는 일을 함께 놓치지 마십시오. 만족을 아는 사람은 목표를 세우되 목표에 끌려다니지 않습니다."},advice:"더 많이 가지는 것이 언제나 더 나은 삶을 뜻하지는 않습니다. 지금 필요한 것과 지나친 욕심을 구분하고, 지킬 가치가 있는 것을 먼저 지키십시오.",hope:"만족은 가능성을 닫는 포기가 아니라 마음의 평정을 되찾는 힘입니다. 이미 가진 토대 위에서 더 자유롭게 다음 길을 선택할 수 있습니다."},{n:47,title:"멀리 가지 않고 얻는 지혜",core:"도덕경 47장은 문밖에 나가지 않고도 천하를 알고, 창밖을 내다보지 않고도 하늘의 도리를 알 수 있다고 말합니다. 멀리 다니며 지식을 늘리는 것보다 사물의 이치를 깊이 살피는 지혜를 강조합니다.",situation:"새로운 정보와 사람, 장소를 계속 찾아다니지만 정작 자신의 문제를 정리할 시간이 부족할 수 있습니다. 지금은 더 많은 자극을 모으기보다 이미 가진 경험과 자료를 차분히 읽어야 할 때입니다.",hidden:"이 장은 세상에 나가지 말라는 폐쇄적인 가르침이 아닙니다. 외부 정보만 쫓으면 판단이 흔들릴 수 있으니, 관찰과 성찰을 통해 핵심 원리를 알아차리라는 뜻입니다. 가까운 일상에도 큰 흐름을 이해할 단서가 있습니다.",steps:["현재 고민과 관련된 정보 수집을 잠시 멈추고, 이미 확인된 사실과 아직 모르는 점을 나누어 적으십시오.","반복해서 나타나는 원인과 결과를 찾아보십시오. 한 번의 사건보다 여러 번 확인된 패턴을 중시하십시오.","오늘 주변의 작은 일 하나를 주의 깊게 관찰하고, 그 경험에서 배운 점을 다음 결정에 적용하십시오."],domains:{연애:"상대의 마음을 추측하거나 주변의 연애담에 기대기보다 실제 대화와 반복되는 행동을 살피십시오. 가까이에서 듣는 것이 먼 소문보다 정확합니다.",재물:"정보를 많이 보는 것과 잘 판단하는 것은 다릅니다. 재무제표·현금흐름·위험요인을 직접 확인하고 이해하지 못한 상품은 서두르지 마십시오.",사업·일:"경쟁사의 움직임만 따라가기보다 고객이 현장에서 겪는 불편을 관찰하십시오. 가까운 고객의 목소리에서 사업의 방향을 찾을 수 있습니다.",인간관계:"소문보다 당사자의 말과 행동을 확인하십시오. 판단하기 전에 직접 묻고 듣는 태도가 오해를 줄입니다.",건강·생활:"유행하는 건강 정보에 휩쓸리기보다 자신의 생활 습관과 몸의 변화를 기록하십시오. 증상이나 우려가 지속되면 의료 전문가의 평가를 받으십시오.",인생:"먼 곳의 정답을 찾아 헤매기 전에 지금 맡은 일과 가까운 관계를 성실히 살피십시오. 깊은 통찰은 일상의 관찰에서 자랍니다."},advice:"새로운 것을 배우되 정보의 양에 압도되지 마십시오. 가까운 현실을 정확히 관찰하고, 경험에서 원리를 찾아 행동으로 옮기십시오.",hope:"멀리 가지 않아도 오늘의 자리에서 배울 수 있는 지혜가 있습니다. 주의 깊게 바라보는 순간, 다음 한 걸음의 방향이 조금씩 선명해집니다."},{n:48,title:"비움으로 깊어지는 지혜",core:"도덕경 48장은 배움은 날마다 더해 가지만 도를 따르는 일은 날마다 덜어 낸다고 말합니다. 덜고 또 덜어 무위에 이르면 억지로 하지 않아도 이루지 못하는 일이 없다고 설명합니다.",situation:"해야 할 일과 지식, 책임을 계속 쌓아 왔지만 오히려 복잡해지고 지쳐 있을 수 있습니다. 더 배우거나 더 통제하기 전에 불필요한 일과 습관을 덜어 낼 필요가 있습니다.",hidden:"비움은 무책임이나 무지가 아닙니다. 본질을 가리는 과잉을 줄이고, 꼭 필요한 행동에 힘을 모으는 과정입니다. 모든 일을 직접 통제하려는 마음을 내려놓으면 상황이 스스로 움직일 여지도 생깁니다.",steps:["하루의 일정과 반복 업무를 살펴 효과가 적거나 목적이 흐려진 일 하나를 줄이십시오.","문제를 해결할 때 즉시 개입하기 전에 현재 작동하는 질서와 사람들의 자율성을 확인하십시오.","새로운 계획을 추가하기보다 이미 시작한 중요한 일 하나를 단순한 방식으로 마무리하십시오."],domains:{연애:"상대를 바꾸려는 조언과 확인 요구를 줄이고, 함께 있는 시간을 편안하게 만드는 행동에 집중하십시오. 때로는 듣고 기다리는 것이 더 큰 사랑입니다.",재물:"복잡한 투자와 불필요한 지출을 정리하십시오. 이해하는 자산과 감당 가능한 위험에 집중하고, 계획을 자주 바꾸는 습관을 줄이십시오.",사업·일:"회의·보고·절차를 무조건 늘리지 말고 실제 성과에 기여하는 과정만 남기십시오. 권한을 적절히 나누고 현장에 맡길 부분을 구분하십시오.",인간관계:"모든 관계를 관리하거나 모든 갈등을 즉시 해결하려 하지 마십시오. 불필요한 논쟁을 덜고 꼭 필요한 대화에 진심을 다하십시오.",건강·생활:"무리한 자기관리 목표를 추가하기보다 늦은 취침이나 과도한 자극처럼 회복을 방해하는 습관을 하나씩 줄이십시오.",인생:"삶을 복잡하게 만드는 집착과 의무를 살펴 핵심 가치에 맞지 않는 것은 덜어 내십시오. 단순함은 중요한 것에 더 깊이 참여하게 합니다."},advice:"무언가를 더하는 것이 답이 아닐 때가 있습니다. 지금은 불필요한 것을 하나 덜어 내고, 남은 중요한 일에 온전히 집중하십시오.",hope:"비워 낸 자리에는 숨 쉴 여백과 새로운 가능성이 생깁니다. 조금 가벼워진 마음으로도 충분히 앞으로 나아갈 수 있습니다."},{n:49,title:"모든 것을 품는 마음",core:"도덕경 49장은 성인에게 고정된 사사로운 마음이 없고 백성의 마음을 자신의 마음으로 삼는다고 말합니다. 선한 사람을 선하게 대하고 선하지 않은 사람도 선하게 대하며, 신뢰하는 사람과 신뢰하지 않는 사람 모두에게 신의를 지키는 넓은 마음을 이야기합니다.",situation:"사람을 내 편과 남의 편, 믿을 사람과 아닌 사람으로 빠르게 나누고 있을 수 있습니다. 관계에서 상처를 받았더라도 감정에만 끌려가지 말고, 상대의 사정과 자신의 경계를 함께 살펴보십시오.",hidden:"열린 마음은 모든 행동을 허용하거나 무조건 믿으라는 뜻이 아닙니다. 사람을 선입견으로 단정하지 않되 사실을 분명히 보고, 자비와 분별을 함께 갖추라는 지혜입니다. 마음은 넓게, 원칙과 경계는 분명하게 세울 수 있습니다.",steps:["누군가를 단정하고 있는지 돌아보고, 실제로 확인한 사실과 나의 해석을 구분하십시오.","상대의 입장을 한 번 더 들어 보되 반복되는 해로운 행동에는 정중하고 분명한 경계를 세우십시오.","오늘 한 사람에게 조건 없는 친절을 실천하고, 그 행동이 상대와 자신에게 어떤 영향을 주는지 살피십시오."],domains:{연애:"상대를 과거의 실수 하나로 규정하지 말고 변화와 책임 있는 행동을 함께 보십시오. 다만 폭력이나 반복적인 통제는 사랑이라는 이유로 감수하지 마십시오.",재물:"사람의 말만 믿고 돈을 맡기지 말고 계약과 기록, 확인 절차를 갖추십시오. 신뢰는 따뜻한 태도와 투명한 기준이 함께할 때 오래갑니다.",사업·일:"구성원의 배경이나 첫인상보다 실제 역량과 행동을 공정하게 평가하십시오. 의견이 다른 사람의 현장 정보를 듣되 원칙과 책임은 분명히 하십시오.",인간관계:"내 편이 아니라고 적대하지 말고, 다르다고 해서 배척하지 마십시오. 이해하려는 태도와 안전한 거리 두기를 함께 실천하십시오.",건강·생활:"타인의 건강 경험을 자신의 상태에 그대로 적용하지 마십시오. 서로의 차이를 인정하고 개인에게 맞는 전문적 조언을 구하십시오.",인생:"마음의 폭을 넓히되 판단력을 버리지 마십시오. 따뜻함은 누구에게나 향할 수 있고, 신뢰와 책임은 행동을 통해 확인할 수 있습니다."},advice:"사람을 쉽게 단정하지 않는 넓은 마음을 가지십시오. 동시에 자신과 타인을 보호하는 원칙을 분명히 세우는 것이 성숙한 배려입니다.",hope:"마음의 문을 조금 더 넓히면 갈등 속에서도 새로운 이해가 시작될 수 있습니다. 따뜻함과 지혜를 함께 지니고 걸어가십시오."},{n:50,title:"삶과 죽음의 순환",core:"도덕경 50장은 삶으로 나아가고 죽음으로 돌아가는 생명의 흐름을 이야기합니다. 태어남과 죽음의 문제를 두려움과 집착으로만 대하지 말고, 생명을 해치는 과도한 욕망과 위험을 경계하는 지혜를 전합니다.",situation:"변화와 상실, 나이 듦, 건강에 대한 걱정처럼 피하기 어려운 문제 앞에 서 있을 수 있습니다. 두려움을 외면하거나 운명처럼 단정하지 말고, 지금 지킬 수 있는 생명과 일상을 돌보십시오.",hidden:"이 장은 위험을 무시하라는 뜻도, 죽음을 미화하라는 뜻도 아닙니다. 삶이 유한하다는 사실을 알 때 오히려 매 순간을 소중히 여기고 무모함을 줄일 수 있다는 성찰입니다. 생명을 지키는 태도는 오늘의 선택에서 드러납니다.",steps:["미루고 있는 건강 점검이나 안전 조치가 있다면 현실적인 일정으로 정하고 실행하십시오.","위험을 감수해야 하는 일에서는 이익뿐 아니라 최악의 결과와 예방 방법을 먼저 검토하십시오.","소중한 사람에게 고마움과 애정을 표현하고, 오늘 누릴 수 있는 평범한 기쁨을 하나 실천하십시오."],domains:{연애:"언젠가 알게 되겠지 하며 마음을 미루지 마십시오. 고마움과 사랑을 지금 표현하고, 서로의 삶과 안전을 존중하십시오.",재물:"한 번의 큰 기회에 모든 것을 거는 선택을 경계하십시오. 생계와 가족의 안정에 필요한 기반을 지키고 손실 가능성을 관리하십시오.",사업·일:"성과를 위해 사람의 안전과 존엄을 희생하지 마십시오. 안전 규정과 위기 대응 체계를 갖추는 것이 지속 가능한 성과의 토대입니다.",인간관계:"관계가 영원할 것처럼 당연하게 여기지 마십시오. 미뤄 둔 화해와 감사의 말을 전하되, 상처를 주는 관계에는 필요한 보호선을 세우십시오.",건강·생활:"몸의 신호를 무시하거나 검증되지 않은 방법에 의존하지 마십시오. 예방과 검진, 충분한 휴식, 적절한 의료 도움으로 생명을 돌보십시오.",인생:"유한함을 생각하는 일은 삶을 포기하기 위해서가 아니라 오늘을 더 진실하게 살기 위해서입니다. 소중한 것에 시간과 마음을 쓰십시오."},advice:"삶의 유한함을 두려움만으로 바라보지 마십시오. 위험을 줄이고 생명을 돌보며, 지금 곁에 있는 소중한 것에 마음을 기울이십시오.",hope:"오늘 하루는 다시 주어지지 않는 귀한 시간입니다. 작은 돌봄과 진심 어린 표현 하나가 삶을 더 깊고 따뜻하게 만듭니다."},{n:51,title:"낳고 기르는 사랑",core:"도덕경 51장은 도가 만물을 낳고 덕이 기르며, 형체와 환경이 자라게 하고 각 존재가 자기 본성을 이루도록 돕는다고 말합니다. 낳되 소유하지 않고, 이루되 지배하지 않는 태도를 큰 덕으로 설명합니다.",situation:"누군가를 돕거나 무언가를 키우는 과정에서 결과를 내 뜻대로 만들고 싶어질 수 있습니다. 사랑과 책임은 다하되 상대의 성장과 선택을 대신 차지하지 않는 균형이 필요합니다.",hidden:"진정한 돌봄은 소유와 통제가 아닙니다. 생명이 자랄 수 있는 조건을 마련하고, 때가 되면 스스로 설 수 있도록 공간을 내어 주는 것입니다. 성과를 자신의 공으로 독점하지 않는 겸손도 이 장의 핵심입니다.",steps:["돕고 있는 사람이나 프로젝트에서 내가 대신 결정하는 부분과 상대가 스스로 해 볼 수 있는 부분을 구분하십시오.","성장에 필요한 시간·환경·자원을 제공하되 결과를 강요하지 않는 방법을 정하십시오.","성과가 생기면 공을 나누고, 부족한 부분은 비난보다 다음 성장을 위한 피드백으로 다루십시오."],domains:{연애:"사랑하는 사람을 내 뜻대로 만들려 하지 마십시오. 서로의 성장을 응원하고, 돌봄과 자율성이 함께 있는 관계를 가꾸십시오.",재물:"돈을 모으는 목적과 그 돈이 지탱할 삶의 가치를 분명히 하십시오. 자산을 소유하는 데 그치지 말고 책임 있는 관리와 장기적 기반을 생각하십시오.",사업·일:"리더는 구성원이 성장할 환경을 만들고 성과를 독점하지 않아야 합니다. 권한과 공로를 나누면 조직의 자생력이 커집니다.",인간관계:"도움이 필요한 사람에게 손을 내밀되 감사나 복종을 요구하지 마십시오. 상대가 자기 힘으로 설 수 있도록 적절한 거리를 존중하십시오.",건강·생활:"몸을 몰아붙여 성과를 얻으려 하기보다 회복할 환경을 마련하십시오. 건강한 습관은 강압보다 꾸준한 돌봄 속에서 자랍니다.",인생:"무언가를 이루었다면 그것을 움켜쥐고 지배하기보다 다음 생명과 사람에게 도움이 되는 기반으로 남기십시오."},advice:"낳고 기르고 돕되 소유하지 않는 마음을 기억하십시오. 좋은 결과를 만드는 것만큼 그 결과가 스스로 자라도록 놓아주는 태도도 중요합니다.",hope:"주군이 건넨 작은 도움과 정성은 누군가의 삶에서 오래 자랄 수 있습니다. 억지로 붙잡지 않아도 진심으로 기른 것은 저마다의 꽃을 피웁니다."},{n:52,title:"근원으로 돌아가는 길",core:"도덕경 52장은 천하의 시작을 어머니라 부르고, 근원을 알면 그 자식인 만물을 이해할 수 있다고 말합니다. 근원을 지키고 감각과 욕망의 문을 절제하면 삶의 어려움 속에서도 평안할 수 있다는 가르침입니다.",situation:"눈앞의 문제를 각각 따로 해결하느라 지치고 있을 수 있습니다. 여러 문제의 공통된 뿌리, 즉 생활의 기본 질서나 처음 세운 원칙을 다시 살펴볼 때입니다.",hidden:"근원으로 돌아간다는 것은 과거에 머무는 일이 아닙니다. 복잡한 현상 뒤에 있는 기본 원리와 처음의 뜻을 회복하는 것입니다. 작은 틈이 커지기 전에 알아차리고, 말과 욕망이 마음을 끌고 다니지 않도록 중심을 지키라는 뜻도 담겨 있습니다.",steps:["현재 여러 문제에 반복해서 나타나는 공통 원인 하나를 찾아 적으십시오.","처음 시작할 때 중요하게 여겼던 가치와 지금의 행동이 얼마나 일치하는지 점검하십시오.","하루 중 짧은 시간이라도 소음과 화면을 끄고 호흡과 마음을 가라앉히는 시간을 마련하십시오."],domains:{연애:"갈등이 반복된다면 표면의 말다툼뿐 아니라 관계의 기본 약속과 서로의 필요가 지켜지고 있는지 살피십시오.",재물:"복잡한 금융 선택보다 소득·지출·부채·비상자금이라는 기본 구조를 먼저 점검하십시오. 근본이 안정되어야 세부 전략도 힘을 얻습니다.",사업·일:"사업의 출발점인 고객 가치와 핵심 품질을 다시 확인하십시오. 본질에서 멀어진 절차와 확장은 조정할 필요가 있습니다.",인간관계:"오래된 오해를 풀려면 사건 하나만 따지기보다 관계를 지탱하던 약속과 신뢰의 뿌리를 돌아보십시오.",건강·생활:"수면·식사·활동·휴식의 기본을 확인하십시오. 특정 증상을 단순히 생활 문제로 단정하지 말고 필요한 진료를 받으십시오.",인생:"바깥의 평가에 흔들릴 때 처음 소중히 여겼던 가치로 돌아가십시오. 근원을 잊지 않으면 변화 속에서도 방향을 잃지 않습니다."},advice:"문제를 더 복잡하게 만들기 전에 뿌리를 살피십시오. 처음의 뜻과 삶의 기본 질서를 회복하는 것이 많은 혼란을 정리하는 출발점입니다.",hope:"근원으로 돌아가는 길은 언제나 다시 시작할 수 있는 길입니다. 오늘 기본 하나를 바로 세우면 삶의 여러 부분에도 안정이 번져 갑니다."},{n:53,title:"바른길을 지키는 용기",core:"도덕경 53장은 큰 도를 따르는 길은 평탄하지만 사람들은 지름길과 화려함을 좇아 큰길에서 벗어나기 쉽다고 말합니다. 밭은 황폐한데 창고가 가득하고 화려한 옷과 날카로운 무기가 넘치는 모습을 들어 본말이 뒤바뀐 세상을 비판합니다.",situation:"겉으로 드러나는 성과와 편리함을 좇다가 정작 중요한 기반을 놓치고 있지는 않은지 돌아보십시오. 빠른 결과를 약속하는 길이 기본과 원칙을 훼손하고 있는지 살펴야 합니다.",hidden:"큰길은 화려하거나 특별한 비법이 아니라 기본에 충실한 바른 길입니다. 개인의 욕망이나 조직의 과시가 공동체의 삶과 생산 기반을 해치면 겉의 풍요는 오래가지 못합니다. 성취의 크기보다 그것이 누구에게 어떤 결과를 남기는지가 중요합니다.",steps:["지금 추진하는 일의 목표와 실제로 지키고 있는 원칙을 나란히 적어 차이를 확인하십시오.","빠른 이익이나 외형 확대를 위해 품질·안전·신뢰를 희생하는 부분이 없는지 점검하십시오.","성과를 평가할 때 숫자뿐 아니라 사람·환경·고객에게 남기는 장기적 영향을 함께 살피십시오."],domains:{연애:"겉으로 보이는 조건이나 남에게 자랑할 만한 관계보다 서로를 존중하고 책임지는 일상의 태도를 우선하십시오.",재물:"화려한 수익률 광고나 단기 유행보다 자산의 실체와 위험을 확인하십시오. 기본 원칙을 지키는 것이 지름길을 좇는 것보다 중요합니다.",사업·일:"외형 성장과 홍보보다 제품의 품질, 고객 신뢰, 직원의 안전과 지속 가능한 운영을 먼저 지키십시오.",인간관계:"말과 체면보다 실제 행동으로 신뢰를 쌓으십시오. 관계의 겉모습을 꾸미기보다 약속을 지키는 일이 중요합니다.",건강·생활:"극단적인 유행이나 빠른 변화보다 꾸준한 생활 습관과 검증된 건강 관리 원칙을 따르십시오.",인생:"남에게 보여 주기 위한 성공이 삶의 본질을 대신하지 않도록 하십시오. 내가 걷는 길이 바르고 지속 가능한지 정기적으로 돌아보십시오."},advice:"화려한 지름길보다 기본에 충실한 큰길을 선택하십시오. 진정한 풍요는 겉의 장식이 아니라 삶의 기반과 신뢰가 건강할 때 만들어집니다.",hope:"바른길은 때로 느려 보여도 오래 걸을 수 있는 길입니다. 오늘 원칙 하나를 지키는 선택이 내일의 든든한 기반이 됩니다."},{n:54,title:"자신을 바로 세우는 힘",core:"도덕경 54장은 굳게 세운 것은 뽑히지 않고, 잘 품은 것은 빼앗기지 않는다고 말합니다. 덕을 자신에게서 닦고 가정과 마을, 나라와 천하로 넓혀 가며, 가까운 곳에서 실천한 덕으로 멀리까지 살피라고 가르칩니다.",situation:"큰 변화를 한 번에 이루려 하거나 주변을 바꾸려 애쓰느라 정작 자신의 생활과 태도를 돌보지 못했을 수 있습니다. 지금은 가장 가까운 자리에서 실천할 수 있는 원칙을 세우는 것이 우선입니다.",hidden:"세상을 바꾸는 힘은 멀리 있는 구호보다 자신에게서 시작해 관계와 공동체로 확장되는 일관성에 있습니다. 뿌리가 튼튼한 나무처럼 내면의 기준과 일상의 행동이 맞닿을 때 변화도 오래 지속됩니다.",steps:["내가 중요하게 여기는 가치 한 가지를 정하고, 오늘 그것을 보여 줄 구체적인 행동을 정하십시오.","가정이나 일터에서 반복되는 약속 하나를 정해 말보다 행동으로 꾸준히 지키십시오.","나의 행동이 주변 사람과 공동체에 미치는 영향을 살피고, 좋은 영향은 넓히되 강요하지 마십시오."],domains:{연애:"관계를 바꾸려면 상대에게 요구하기 전에 내가 지킬 약속부터 분명히 하십시오. 일관된 존중과 책임이 신뢰의 뿌리가 됩니다.",재물:"재정의 기초를 세우십시오. 기록, 예산, 위험 관리처럼 반복 가능한 원칙을 꾸준히 지키는 것이 장기적 안정에 도움이 됩니다.",사업·일:"조직의 문화를 선언문으로만 만들지 말고 리더와 구성원이 매일 지키는 기준으로 정착시키십시오. 작은 현장의 신뢰가 조직 전체로 확장됩니다.",인간관계:"가까운 사람에게 먼저 예의와 신의를 실천하십시오. 가까운 관계에서 지키지 못하는 원칙은 넓은 관계에서도 힘을 얻기 어렵습니다.",건강·생활:"건강 목표를 크게 선언하기보다 반복 가능한 수면·식사·움직임 습관을 세우십시오. 몸의 상태에 맞춰 무리하지 않고 지속하십시오.",인생:"자신을 바로 세운다는 것은 완벽해지는 것이 아니라 가치와 행동의 간격을 줄이는 일입니다. 가까운 곳에서 시작한 선한 영향은 차츰 넓어집니다."},advice:"세상을 바로잡으려 하기 전에 자신의 뿌리를 단단히 하십시오. 자신에게서 시작한 진실한 실천을 가정과 일터, 공동체로 넓혀 가십시오.",hope:"큰 변화도 가까운 한 사람의 작은 실천에서 시작됩니다. 오늘 주군이 바로 세운 한 가지 원칙이 내일 더 넓은 신뢰의 뿌리가 될 수 있습니다."},{n:55,title:"어린아이의 순수함",core:"도덕경 55장은 덕이 충만한 사람을 갓난아이에 비유합니다. 아이처럼 부드럽고 생명력이 온전하다는 뜻이지, 세상 물정을 모르거나 무조건 순진하라는 뜻은 아닙니다. 힘을 과시하지 않고도 생명을 지키는 온전함을 말합니다.",situation:"성과와 경쟁에 마음을 빼앗겨 자신을 지나치게 몰아붙이고 있지는 않은지 살펴볼 때입니다. 몸과 마음이 보내는 작은 신호, 호기심과 기쁨을 다시 회복할 필요가 있습니다.",hidden:"강함은 긴장과 통제에서만 나오지 않습니다. 불필요한 경직을 풀고 기본적인 생명력을 돌볼 때 오래가는 힘이 생깁니다. 순수함은 판단력을 버리는 것이 아니라 편견을 덜어 내는 태도입니다.",steps:["하루 중 몸이 편안해지는 순간과 지치는 순간을 기록해 생활 리듬을 살피십시오.","무언가를 잘해야 한다는 부담을 잠시 내려놓고, 호기심으로 할 수 있는 작은 활동을 해 보십시오.","수면·식사·휴식의 기본을 지키고, 무리한 목표 하나를 현실적인 수준으로 조정하십시오."],domains:{연애:"상대에게 완벽한 모습을 보이려 애쓰기보다 편안하고 솔직한 마음을 나누십시오. 다만 순수함을 이유로 경계나 약속을 흐리지 마십시오.",재물:"한 번의 큰 성과보다 꾸준한 저축과 지출 관리가 생활의 안정감을 키웁니다. 충동적인 소비를 줄이고 기본 원칙을 지키십시오.",사업·일:"초심과 고객의 실제 필요를 다시 확인하십시오. 복잡한 절차를 덜어 내되 안전과 품질에 필요한 기준은 지키십시오.",인간관계:"계산적인 말보다 진심 어린 경청이 관계를 부드럽게 합니다. 상대의 미숙함을 무조건 감싸기보다 함께 성장할 방법을 찾으십시오.",건강·생활:"몸을 과도하게 몰아붙이지 말고 규칙적인 수면·식사·가벼운 움직임을 회복하십시오. 불편이나 증상이 지속되면 의료 전문가와 상의하십시오.",인생:"삶의 기쁨을 성취 뒤로만 미루지 마십시오. 작은 호기심과 배움이 삶의 생기를 되살릴 수 있습니다."},advice:"오늘은 더 강해지려고 애쓰기보다 이미 가진 생명력을 보살피십시오. 부드러움은 약함이 아니라 오래 살아 움직이는 힘입니다.",hope:"마음의 긴장을 조금 풀어도 괜찮습니다. 주군의 삶에는 다시 생기를 틔울 작은 시작이 언제든 있습니다."},{n:56,title:"침묵 속의 깊은 지혜",core:"도덕경 56장은 참으로 아는 사람은 함부로 말하지 않고, 말로만 아는 사람은 모든 것을 단정하기 쉽다고 일깨웁니다. 침묵은 무관심이나 비밀주의가 아니라 말과 행동을 신중히 하는 깊은 이해입니다.",situation:"설명과 설득을 많이 해도 오해가 풀리지 않거나, 말이 앞서 갈등이 커지는 상황이라면 잠시 멈추어 들을 때입니다. 무엇을 말할지뿐 아니라 언제 말하지 않을지도 살펴보십시오.",hidden:"말을 줄이면 상대의 말을 들을 공간과 자신의 마음을 관찰할 공간이 생깁니다. 다만 침묵이 회피나 부당함에 대한 방관이 되지 않도록 필요한 진실은 차분히 밝혀야 합니다.",steps:["답하기 전에 상대의 말을 끝까지 듣고, 들은 내용을 한 문장으로 확인하십시오.","확실히 아는 사실과 추측·감정을 구분해 말하십시오.","지금 말하는 것이 문제 해결에 도움이 되는지 살핀 뒤, 필요한 말은 짧고 분명하게 전하십시오."],domains:{연애:"상대를 고치려는 긴 설명보다 충분히 듣고 마음을 확인하는 대화가 도움이 됩니다. 중요한 감정과 약속은 침묵으로 감추지 말고 솔직히 나누십시오.",재물:"투자나 계약에서 화려한 말보다 문서와 조건을 확인하십시오. 모르는 부분은 아는 척하지 말고 질문하고 검증하십시오.",사업·일:"회의에서 말의 양보다 정확한 정보와 실행 가능한 제안이 중요합니다. 불필요한 소문은 옮기지 말고 핵심을 기록하십시오.",인간관계:"모든 논쟁에 참여할 필요는 없습니다. 다만 침묵이 오해를 키운다면 사실과 자신의 경계를 정중하게 밝혀 주십시오.",건강·생활:"몸의 상태를 무시하거나 혼자 참지 마십시오. 증상과 변화를 구체적으로 기록해 필요할 때 전문가에게 정확히 설명하십시오.",인생:"많이 아는 사람처럼 보이기보다 계속 배우는 사람이 되십시오. 고요한 관찰이 더 깊은 판단을 낳습니다."},advice:"말을 아끼되 진실을 외면하지 마십시오. 먼저 듣고 충분히 살핀 뒤 꼭 필요한 말을 건네는 것이 지혜입니다.",hope:"조용히 살피는 시간은 멈춤이 아니라 이해가 깊어지는 시간입니다. 서두르지 않아도 길은 또렷해질 수 있습니다."},{n:57,title:"비움으로 다스리는 세상",core:"도덕경 57장은 세상을 다스리는 데 지나친 금령과 인위적인 간섭을 늘리기보다 바른 원칙과 절제, 백성의 자율성을 중시합니다. 개인의 삶에도 불필요한 통제를 줄이고 스스로 바로 설 여지를 주라는 뜻으로 읽을 수 있습니다.",situation:"규칙과 계획을 계속 늘리는데도 일이 복잡해진다면, 무엇을 더할지보다 무엇을 덜어야 할지 점검할 때입니다. 통제하려는 마음이 문제를 키우고 있지는 않은지 살펴보십시오.",hidden:"질서가 없어서가 아니라 규칙이 지나치게 많아 움직임을 막을 수도 있습니다. 핵심 원칙은 분명히 하되 세부적인 모든 일을 움켜쥐지 않는 균형이 필요합니다.",steps:["현재 지키는 규칙과 반복 업무를 적고, 목적이 사라진 절차를 찾아 줄이십시오.","반드시 지켜야 할 핵심 기준과 자율적으로 맡길 영역을 구분하십시오.","결과를 확인하되 과정 전체를 통제하지 말고, 작은 자율 실험을 해 보십시오."],domains:{연애:"상대의 일정을 일일이 통제하기보다 신뢰와 합의된 약속을 세우십시오. 자유에는 서로 지켜야 할 책임도 따릅니다.",재물:"복잡한 투자 규칙을 늘리기보다 예산·비상자금·위험 한도 같은 기본 원칙을 명확히 하십시오. 계획은 단순하고 지속 가능해야 합니다.",사업·일:"불필요한 보고와 승인 단계를 줄이고 목표·책임·안전 기준을 명확히 하십시오. 자율성을 주되 결과를 함께 점검하십시오.",인간관계:"상대를 바꾸려는 잔소리를 줄이고 자신의 요청을 구체적으로 전하십시오. 서로의 선택권을 존중하면 갈등이 줄어듭니다.",건강·생활:"지나치게 많은 건강 규칙보다 지속할 수 있는 기본 습관 두세 가지부터 지키십시오. 개인별 건강 문제는 전문가의 안내를 따르십시오.",인생:"모든 일을 계획대로 통제하려 하지 마십시오. 중요한 방향은 지키면서 세부 과정에는 유연성을 허용하십시오."},advice:"핵심은 분명하게, 나머지는 가볍게 하십시오. 덜 통제할수록 스스로 움직일 공간이 생깁니다.",hope:"복잡한 것을 하나씩 덜어 내면 다시 움직일 여유가 생깁니다. 단순함은 새로운 가능성을 여는 힘입니다."},{n:58,title:"불행 속에 깃든 행운",core:"도덕경 58장은 정치와 삶의 형편이 한쪽으로 치우치면 그 반작용이 생기며, 화와 복이 서로 기대어 있음을 말합니다. 지금의 행운이나 어려움을 영원한 것으로 단정하지 말고 변화의 흐름을 살피라는 지혜입니다.",situation:"좋은 일이 생겼다고 방심하거나 어려움이 닥쳤다고 모든 가능성을 닫아 버리기 쉬운 때입니다. 현재의 결과를 최종 판결처럼 여기지 말고 조건이 어떻게 바뀌는지 살피십시오.",hidden:"복과 화는 고정된 꼬리표가 아닙니다. 어려움은 점검과 배움의 계기가 될 수 있고, 성공도 오만과 과욕으로 이어지면 위험이 될 수 있습니다. 그렇다고 고통 자체를 미화하거나 잘못을 운명으로 받아들이라는 뜻은 아닙니다.",steps:["현재 상황에서 내가 통제할 수 있는 요소와 통제할 수 없는 요소를 나누십시오.","잘 풀릴 때는 위험과 부작용을 점검하고, 어려울 때는 도움과 대안을 구체적으로 찾으십시오.","성급한 결론을 하루 미루고, 사실이 바뀌었는지 확인한 뒤 다음 행동을 정하십시오."],domains:{연애:"관계의 한 번의 다툼이나 좋은 순간만으로 미래를 단정하지 마십시오. 반복되는 행동과 서로의 책임을 차분히 살피십시오.",재물:"수익이 났을 때도 손실 가능성을 점검하고, 손실이 났을 때 만회하려는 무리한 베팅을 피하십시오. 분산과 감당 가능한 위험이 중요합니다.",사업·일:"호황일수록 현금 흐름과 품질을 점검하고, 어려울수록 고객의 필요와 비용 구조를 다시 살피십시오. 변화에 대응할 여지를 남기십시오.",인간관계:"상대의 한 번의 실수나 친절만으로 사람 전체를 판단하지 마십시오. 다만 반복되는 해로운 행동에는 분명한 경계를 세우십시오.",건강·생활:"컨디션이 좋을 때도 기본 관리를 이어가고, 몸이 불편할 때는 원인을 확인하십시오. 증상을 단순히 좋은 징조나 나쁜 징조로 해석하지 마십시오.",인생:"오늘의 형편이 인생 전체를 결정하지 않습니다. 상황의 변화 속에서도 지킬 가치와 조정할 방법을 함께 찾으십시오."},advice:"좋을 때 겸손하고 어려울 때 가능성을 놓지 마십시오. 상황은 변하지만 그 안에서 선택하는 태도는 오늘부터 가꿀 수 있습니다.",hope:"지금의 형편이 마지막 장면은 아닙니다. 차분한 점검과 작은 선택이 다음 흐름을 바꿀 수 있습니다."},{n:59,title:"절제와 축적의 힘",core:"도덕경 59장은 사람과 일을 다스리는 데 절제와 아낌, 덕의 축적이 중요하다고 말합니다. 큰일을 이루는 힘은 한순간의 과시보다 오래도록 자신을 다스리고 기반을 쌓는 데서 나옵니다.",situation:"당장 성과를 내고 싶지만 에너지와 자원이 빠듯하다면 확장보다 보존과 축적을 먼저 생각할 때입니다. 시간·돈·체력·신뢰를 어떻게 쓰고 있는지 돌아보십시오.",hidden:"절제는 단순히 참는 것이 아니라 중요한 것을 오래 지키기 위한 자원 관리입니다. 눈에 띄지 않는 꾸준함이 위기에도 흔들리지 않는 기반을 만듭니다.",steps:["이번 달 꼭 필요한 지출과 미뤄도 되는 지출을 구분하고 작은 여유 자원을 확보하십시오.","매일 반복할 수 있는 짧은 실천을 정해 꾸준히 이어가십시오.","약속과 신뢰를 쌓는 행동을 선택하고, 무리한 확장이나 과시성 결정을 늦추십시오."],domains:{연애:"큰 이벤트보다 약속을 지키고 배려를 반복하는 일이 신뢰를 쌓습니다. 감정과 시간을 아끼되 무관심으로 만들지는 마십시오.",재물:"비상자금과 지출 통제를 우선하고, 장기 목표에 맞춰 꾸준히 축적하십시오. 수익을 서두르는 고위험 선택은 경계하십시오.",사업·일:"인력·현금·재고·시간을 무리하게 소진하지 말고 지속 가능한 운영 기반을 만드십시오. 작은 개선을 축적하십시오.",인간관계:"도움을 주고받을 때 능력과 한계를 솔직히 밝히십시오. 신뢰는 큰 말보다 반복되는 책임감에서 생깁니다.",건강·생활:"수면과 회복 시간을 자원처럼 관리하십시오. 과로를 줄이고 지속 가능한 운동·식사 습관을 쌓으십시오.",인생:"멀리 가려면 자신을 소진하지 않아야 합니다. 매일의 작은 축적이 시간이 지나 큰 기반이 됩니다."},advice:"오늘은 더 많이 쓰고 더 빨리 얻기보다 소중한 자원을 지키고 쌓는 선택을 하십시오. 오래가는 힘은 절제에서 자랍니다.",hope:"작은 축적은 당장 눈에 띄지 않아도 사라지지 않습니다. 꾸준히 지켜 온 하루가 든든한 내일의 바탕이 됩니다."},{n:60,title:"세심하고 조용한 다스림",core:"도덕경 60장은 큰 나라를 다스리는 일을 작은 생선을 굽는 일에 비유합니다. 자주 뒤집고 지나치게 손대면 부서지듯, 지나친 간섭과 소란은 일을 망칠 수 있습니다. 신중하고 절제된 운영을 말합니다.",situation:"일이 잘 진행되지 않아 자꾸 수정하고 개입하고 싶은 마음이 들 수 있습니다. 하지만 잦은 변경이 오히려 혼란을 키우는지, 안정적으로 지켜볼 시간이 필요한지 살펴보십시오.",hidden:"손을 놓으라는 뜻이 아니라 필요한 만큼만 개입하라는 뜻입니다. 기본 조건과 안전을 챙기고, 과정이 자리 잡을 시간을 주는 것이 중요합니다.",steps:["현재 진행 중인 일에서 꼭 필요한 개입과 불안해서 하는 개입을 구분하십시오.","한 번 정한 실행 계획은 점검 시점을 정해 두고, 중간에 사소한 이유로 계속 바꾸지 마십시오.","문제가 생기면 사람을 탓하기 전에 구조·절차·정보의 원인을 먼저 확인하십시오."],domains:{연애:"상대의 감정과 행동을 계속 확인하거나 재촉하지 마십시오. 대화할 시간을 정하고 서로의 속도를 존중하십시오.",재물:"시세의 작은 흔들림마다 계획을 뒤집지 말고, 사전에 정한 위험 기준과 점검 주기를 따르십시오. 중요한 변화는 근거를 확인해 대응하십시오.",사업·일:"직원과 동료에게 세부 방법까지 과도하게 간섭하기보다 목표와 기준을 명확히 하십시오. 안전·품질 문제에는 즉시 대응하십시오.",인간관계:"작은 말실수마다 반응을 키우지 말고 맥락을 살피십시오. 반복되는 문제는 차분한 대화로 다루십시오.",건강·생활:"검증되지 않은 방법을 자주 바꾸기보다 안전하고 지속 가능한 생활 습관을 유지하십시오. 치료나 약물 변경은 의료진과 상의하십시오.",인생:"모든 변화에 즉시 반응할 필요는 없습니다. 관찰하고 기다리는 시간도 책임 있는 선택이 될 수 있습니다."},advice:"필요한 곳에는 단단히 개입하고, 나머지는 자라날 시간을 주십시오. 절제된 손길이 일을 온전하게 만듭니다.",hope:"조급한 손길을 잠시 거두면 상황을 더 정확히 볼 수 있습니다. 차분한 관리 속에서 좋은 흐름이 자리 잡을 수 있습니다."},{n:61,title:"낮은 곳에서 이루는 화합",core:"도덕경 61장은 큰 나라와 작은 나라의 관계를 낮은 곳으로 모이는 큰 물에 비유하며, 겸손과 양보가 화합의 바탕이 될 수 있음을 말합니다. 낮아짐은 굴복이 아니라 상대를 이해하고 관계를 이어 가는 힘입니다.",situation:"서로 주도권을 잡으려 하거나 규모와 힘의 차이 때문에 관계가 불편해졌다면, 누가 이길지보다 어떻게 함께 살아갈 수 있을지 살펴볼 때입니다.",hidden:"먼저 낮추는 태도는 상대의 입장을 들을 공간을 만듭니다. 그러나 일방적인 희생이나 부당한 종속을 뜻하지는 않습니다. 존엄과 안전을 지키면서 협력의 접점을 찾는 것이 핵심입니다.",steps:["상대가 중요하게 여기는 필요와 내가 지켜야 할 원칙을 각각 적어 보십시오.","양쪽이 받아들일 수 있는 작은 교환이나 협력 방안을 제안하십시오.","합의한 내용과 책임을 분명히 하고, 한쪽에만 희생이 쏠리지 않는지 점검하십시오."],domains:{연애:"누가 옳은지 겨루기보다 서로의 필요를 듣고 양보 가능한 부분을 찾으십시오. 존중과 안전의 경계는 분명히 지켜야 합니다.",재물:"협력이나 공동투자는 역할·비용·수익·책임을 투명하게 합의하십시오. 관계가 좋다는 이유만으로 중요한 조건을 생략하지 마십시오.",사업·일:"규모가 다른 조직과 협력할 때 상대의 현실을 이해하고 상호 이익을 설계하십시오. 협력의 조건과 의사결정 권한을 명확히 하십시오.",인간관계:"먼저 사과하거나 양보하는 것이 관계를 회복하는 계기가 될 수 있습니다. 다만 반복적인 무례와 착취를 감내할 필요는 없습니다.",건강·생활:"혼자 모든 것을 감당하지 말고 주변의 도움을 요청하십시오. 서로 돌보는 생활망이 회복에 힘이 됩니다.",인생:"낮은 곳에서 배우고 연결될 때 더 넓은 길이 열립니다. 겸손과 자기 존중을 함께 지키십시오."},advice:"먼저 이해하려는 마음은 화합의 문을 엽니다. 낮아지되 자신을 잃지 않는 균형을 지키십시오.",hope:"서로의 자리를 인정하면 함께 갈 길이 생깁니다. 작은 양보와 공정한 약속이 새로운 연결을 만들 수 있습니다."},{n:62,title:"세상에서 가장 귀한 보물",core:"도덕경 62장은 도가 만물의 깊은 보물이며 선한 사람에게는 귀한 바탕이고, 그렇지 못한 사람에게도 돌아올 수 있는 자리라고 말합니다. 참된 가치는 배제와 낙인보다 누구에게나 열려 있는 근원적 선함과 회복의 가능성에 있습니다.",situation:"실수나 실패 때문에 자신 또는 타인을 쉽게 단정하고 있지는 않은지 돌아보십시오. 지금 필요한 것은 비난만이 아니라 잘못을 바로잡고 다시 시작할 수 있는 기준입니다.",hidden:"포용은 잘못을 없던 일로 만드는 것이 아닙니다. 사람의 존엄을 인정하면서 행동의 책임을 묻고, 회복과 개선의 길을 열어 두는 태도입니다.",steps:["문제 행동과 사람 자체를 구분해 무엇을 바로잡아야 하는지 구체적으로 적으십시오.","사과·보상·재발 방지 등 책임 있는 회복 조치를 실천하십시오.","도움이 필요한 사람에게 조언만 하기보다 실제로 가능한 지원 한 가지를 건네십시오."],domains:{연애:"상대의 실수를 무조건 덮기보다 책임과 회복의 가능성을 함께 살피십시오. 용서 여부는 안전과 신뢰가 회복되는지에 따라 신중히 결정하십시오.",재물:"돈을 판단의 유일한 기준으로 삼지 말고 정직한 거래와 신뢰를 지키십시오. 손실이나 실수는 사실을 확인하고 책임 있게 바로잡으십시오.",사업·일:"실패를 숨기기보다 원인을 공개적으로 점검하고 개선책을 마련하십시오. 구성원이 다시 배울 수 있는 환경을 만드십시오.",인간관계:"사람을 한 번의 실수로 낙인찍지 말되 반복되는 해로운 행동에는 경계를 세우십시오. 존중과 책임을 함께 요구하십시오.",건강·생활:"도움이 필요할 때 낙인에 대한 두려움 없이 전문적인 지원을 구하십시오. 회복은 혼자 견디는 일이 아닙니다.",인생:"자신의 가치가 성과나 실수 하나로 결정되는 것은 아닙니다. 잘못을 인정하고 바로잡는 과정에서 새로운 길을 찾을 수 있습니다."},advice:"사람의 존엄을 지키면서 잘못은 바로잡으십시오. 포용과 책임이 함께할 때 회복은 깊어집니다.",hope:"누구에게나 다시 배울 기회가 있습니다. 오늘의 정직한 한 걸음이 회복의 시작이 될 수 있습니다."},{n:63,title:"작은 실천의 위대한 힘",core:"도덕경 63장은 무위로 행하고, 어려운 일을 쉬울 때부터 다루며, 큰일은 작은 일에서 시작한다고 말합니다. 억지로 밀어붙이지 않되 미루지도 않는 실천의 지혜입니다.",situation:"해야 할 일이 너무 커 보여 시작을 미루거나, 반대로 한 번에 끝내려 무리하고 있을 수 있습니다. 지금 필요한 것은 일을 작게 나누고 가장 쉬운 첫 단계부터 움직이는 것입니다.",hidden:"작은 시작은 목표를 낮추는 일이 아니라 현실의 조건을 존중하는 방법입니다. 문제가 커지기 전에 조짐을 살피고, 부담을 나누어 꾸준히 처리하면 큰일도 감당할 수 있습니다.",steps:["미뤄 둔 일을 10~15분 안에 할 수 있는 첫 행동으로 쪼개십시오.","문제가 커지기 전에 오늘 확인하거나 예방할 작은 항목 하나를 처리하십시오.","결과를 억지로 통제하기보다 오늘 할 몫을 정해 실행하고, 다음 단계를 이어갈 시간을 잡으십시오."],domains:{연애:"관계를 한 번의 대화로 완성하려 하지 말고 안부 묻기와 약속 지키기 같은 작은 행동을 이어가십시오.",재물:"큰돈을 한 번에 마련하려 하기보다 예산 작성과 자동 저축 등 실행 가능한 작은 습관부터 시작하십시오. 투자 결정은 충분히 검토하십시오.",사업·일:"큰 프로젝트를 단계와 책임자로 나누고, 작은 시제품이나 시험 실행으로 위험을 줄이십시오. 초기에 문제를 발견하는 것이 비용을 아낍니다.",인간관계:"쌓인 오해를 한 번에 풀려 하지 말고 먼저 사실을 확인하고 짧은 대화를 시작하십시오. 작은 신뢰 회복을 반복하십시오.",건강·생활:"갑작스러운 무리보다 짧은 걷기, 규칙적인 취침 등 지속 가능한 습관 하나부터 시작하십시오. 건강 문제는 적절한 전문가와 상의하십시오.",인생:"큰 꿈은 오늘의 작은 실천을 만나야 현실이 됩니다. 시작을 작게 만들고 꾸준히 이어가십시오."},advice:"큰일을 걱정하기 전에 오늘 할 수 있는 작은 일을 시작하십시오. 무리하지 않는 꾸준함이 길을 엽니다.",hope:"작은 시작도 시작입니다. 오늘의 한 걸음이 쌓이면 언젠가 돌아볼 만한 큰 변화가 됩니다."},{n:64,title:"시작을 지키는 지혜",core:"도덕경 64장은 아직 안정되어 있을 때 바로잡고, 일이 커지기 전에 살피며, 천 리 길도 발밑에서 시작한다고 말합니다. 끝까지 신중함을 잃지 않는 태도가 시작의 뜻을 지켜 줍니다.",situation:"새로운 계획을 시작했거나 중요한 일을 마무리하는 단계일 수 있습니다. 처음의 의욕만큼이나 작은 징후를 살피고 마지막까지 기본을 지키는 일이 중요합니다.",hidden:"일이 어려워지는 까닭은 대개 작은 틈을 오래 방치하기 때문입니다. 큰 결심보다 평소의 점검과 꾸준한 태도가 일을 안정적으로 완성합니다. 이미 이룬 성과에도 자만하지 말라는 뜻이 담겨 있습니다.",steps:["지금 진행 중인 일에서 아직 작을 때 손볼 문제 한 가지를 찾아 바로 조치하십시오.","목표를 시작 단계·중간 점검·마무리 단계로 나누고 각 단계의 기준을 적으십시오.","끝이 가까워졌을수록 확인 절차를 생략하지 말고, 처음 세운 원칙을 다시 읽어 보십시오."],domains:{연애:"관계를 처음 시작할 때의 존중과 배려를 익숙해진 뒤에도 지키십시오. 서운함이 작을 때 대화하면 큰 갈등을 예방할 수 있습니다.",재물:"작은 지출과 수수료, 부채의 변화를 초기에 확인하십시오. 투자나 계약은 마감 직전의 조급함보다 사전 점검과 분산된 위험 관리가 중요합니다.",사업·일:"프로젝트의 초기 위험과 품질 기준을 미리 정하십시오. 마무리 단계에서도 검수와 인수인계를 생략하지 마십시오.",인간관계:"작은 오해를 추측으로 키우지 말고 사실을 확인하십시오. 약속을 지키는 반복이 신뢰를 완성합니다.",건강·생활:"피로와 생활 리듬의 작은 변화를 일찍 알아차리고 휴식·수면 습관을 조정하십시오. 지속되는 증상은 의료 전문가와 상의하십시오.",인생:"큰 목표는 오늘 발밑의 한 걸음에서 시작됩니다. 시작의 겸손함과 끝까지 살피는 신중함을 함께 지니십시오."},advice:"시작할 때의 마음을 끝까지 지키는 것이 완성의 비결입니다. 작은 일을 가볍게 여기지 말고 오늘의 한 걸음을 정돈하십시오.",hope:"아직 늦지 않은 작은 손질이 큰 길을 지켜 줍니다. 차분히 살피고 한 걸음씩 나아가면 시작한 일을 더 단단하게 맺을 수 있습니다."},{n:65,title:"꾸밈없는 순수한 지혜",core:"도덕경 65장은 옛 성현이 백성을 억지로 영리하게 만들기보다 소박하고 자연스러운 삶으로 이끌었다고 말합니다. 여기서 말하는 지혜는 지식을 없애자는 뜻이 아니라, 교묘한 계산과 과도한 술수로 삶을 복잡하게 만들지 않는 지혜로 읽을 수 있습니다.",situation:"정보와 선택지가 너무 많아 오히려 판단이 흐려졌을 수 있습니다. 복잡한 설명이나 유행을 좇기보다 실제로 도움이 되는 원칙과 단순한 기준을 되찾아 보십시오.",hidden:"지식 자체보다 지식을 이용해 남을 조종하거나 우위를 차지하려는 태도가 문제입니다. 진정한 지혜는 아는 것을 과시하는 데 있지 않고, 복잡함을 덜어 모두가 이해하고 실천할 수 있게 하는 데 있습니다.",steps:["현재의 고민을 꾸밈없는 한 문장으로 다시 표현하고, 불필요한 가정을 걷어 내십시오.","결정을 내릴 때 사용할 핵심 기준을 세 가지 이내로 줄이십시오.","내가 아는 것을 상대를 압도하는 데 쓰지 말고, 서로 이해할 수 있도록 쉽게 설명하십시오."],domains:{연애:"상대의 마음을 시험하거나 심리전을 벌이기보다 원하는 것과 불편한 점을 솔직하게 나누십시오.",재물:"복잡한 수익 약속보다 비용·위험·현금흐름을 이해할 수 있는 상품인지 먼저 확인하십시오. 모르는 구조에는 서두르지 마십시오.",사업·일:"전문성을 과시하기보다 고객이 실제로 이해하고 쓸 수 있는 제품과 절차를 만드십시오. 핵심 품질을 단순하고 투명하게 관리하십시오.",인간관계:"말을 꾸며 이득을 얻으려 하기보다 사실을 분명하게 전하십시오. 모르는 것은 모른다고 인정하는 태도가 신뢰를 만듭니다.",건강·생활:"유행하는 방법을 무조건 따르지 말고 기본적인 생활 습관과 검증된 정보를 중심에 두십시오. 치료나 건강 판단은 전문가와 확인하십시오.",인생:"많이 아는 것보다 무엇이 중요한지 분별하는 힘을 기르십시오. 단순함은 무지가 아니라 본질을 남기는 선택입니다."},advice:"복잡한 꾀보다 정직하고 단순한 원칙을 선택하십시오. 지혜는 삶을 더 어렵게 만드는 것이 아니라 바르게 살아갈 길을 밝힙니다.",hope:"모든 것을 알아야만 좋은 선택을 하는 것은 아닙니다. 본질을 붙드는 맑은 기준 하나가 다음 걸음을 밝혀 줄 수 있습니다."},{n:66,title:"낮춤으로 얻는 위대한 힘",core:"도덕경 66장은 강과 바다가 모든 골짜기의 아래에 있기 때문에 큰물이 된다고 비유합니다. 사람들 위에 서고자 한다면 말과 태도에서 자신을 낮추고, 앞서고자 한다면 다투지 않는 자세를 지녀야 한다는 가르침입니다.",situation:"리더십이나 관계에서 인정받고 싶은 마음이 커졌을 수 있습니다. 힘으로 앞서려 하기보다 먼저 듣고 책임을 맡는 태도가 주변의 신뢰를 얻는 길인지 살펴보십시오.",hidden:"낮춤은 자기 가치를 부정하거나 부당한 대우를 참으라는 뜻이 아닙니다. 자신을 과시하지 않고 타인의 필요를 살피는 넉넉함이 사람들을 모으는 힘이라는 뜻입니다. 겸손과 분명한 경계는 함께 갈 수 있습니다.",steps:["대화에서 먼저 결론을 말하기보다 상대의 생각을 끝까지 듣고 요점을 확인하십시오.","공동의 일에서 공을 독차지하지 말고 기여한 사람을 구체적으로 인정하십시오.","양보할 수 있는 일과 원칙상 지켜야 할 일을 구분하고, 필요한 경계는 차분히 밝히십시오."],domains:{연애:"누가 옳은지 겨루기보다 서로의 마음을 먼저 이해하려 하십시오. 다만 일방적인 희생이 반복되지 않도록 서로의 필요를 말하십시오.",재물:"과시를 위한 소비나 무리한 경쟁을 줄이고 장기적인 안정에 우선순위를 두십시오. 재정적 책임을 겸손하게 점검하십시오.",사업·일:"좋은 리더는 지시만 하는 사람이 아니라 현장의 목소리를 듣고 공을 나누는 사람입니다. 책임은 회피하지 말고 성과는 함께 나누십시오.",인간관계:"먼저 인사하고 상대의 입장을 묻는 작은 낮춤이 관계의 문을 엽니다. 겸손을 이용해 무례하게 구는 사람에게는 정중하게 선을 그으십시오.",건강·생활:"몸의 한계를 인정하고 무리한 경쟁을 멈추십시오. 휴식과 도움을 요청하는 일도 자신을 돌보는 책임입니다.",인생:"높아지는 것만이 성공은 아닙니다. 넓게 품고 오래 함께 갈 수 있는 사람이 되는 것도 큰 성취입니다."},advice:"낮춤은 작아지는 일이 아니라 더 많은 것을 품을 수 있도록 마음의 자리를 넓히는 일입니다. 겸손하되 자신의 존엄과 원칙은 지키십시오.",hope:"다투지 않아도 영향력을 만들 수 있습니다. 주군의 차분한 배려와 책임감이 오래가는 신뢰의 바탕이 될 것입니다."},{n:67,title:"사랑·검소·겸손의 세 가지 보물",core:"도덕경 67장은 자신에게 세 가지 보물이 있다고 밝힙니다. 자애, 검소함, 세상 앞에 나서서 우두머리가 되려 하지 않는 태도입니다. 자애가 용기를 낳고, 검소함이 넉넉함을 낳으며, 앞서려 하지 않음이 참된 지도력을 가능하게 한다고 말합니다.",situation:"성과와 경쟁을 위해 중요한 가치를 뒤로 미루고 있지는 않은지 돌아볼 때입니다. 무엇을 더 얻을지뿐 아니라 무엇을 지키며 살아갈지 세 가지 기준을 세워 보십시오.",hidden:"이 세 가지 보물은 서로 연결됩니다. 자애는 사람을 해치지 않는 힘이고, 검소함은 자원을 낭비하지 않는 절제이며, 앞서려 하지 않음은 권력과 인정에 집착하지 않는 태도입니다. 이것들이 삶의 지속 가능성을 지켜 줍니다.",steps:["오늘 누군가에게 실제 도움이 되는 친절을 한 가지 실천하십시오.","물건·시간·돈 가운데 낭비하고 있는 한 가지를 찾아 줄이십시오.","주도권을 다투기보다 공동의 결과에 기여하고, 필요한 책임은 피하지 마십시오."],domains:{연애:"상대를 바꾸려 하기보다 자애로운 말과 행동으로 관계를 돌보십시오. 사랑은 소유가 아니라 존중과 배려의 실천입니다.",재물:"검소함은 무조건 아끼는 것이 아니라 가치 있는 곳에 쓰는 분별입니다. 과시성 지출을 줄이고 비상자금과 장기 계획을 돌보십시오.",사업·일:"사람과 자원을 소모품처럼 다루지 마십시오. 품질과 신뢰를 지키고, 단기 성과를 위해 무리한 확장을 삼가십시오.",인간관계:"친절하되 경계를 잃지 않고, 공을 나누되 책임을 회피하지 마십시오. 겸손한 협력이 관계를 단단하게 합니다.",건강·생활:"몸을 아끼는 절제와 타인을 돌보는 배려를 함께 실천하십시오. 과로를 줄이고 규칙적인 휴식으로 생활의 균형을 지키십시오.",인생:"자애·검소·겸손을 중요한 선택의 기준으로 삼으십시오. 이 세 가지는 어려운 때에도 삶의 중심을 잃지 않게 하는 보물입니다."},advice:"더 많이 차지하는 것보다 더 소중한 것을 지키십시오. 자애와 절제와 겸손은 약함이 아니라 오래 지속되는 삶의 힘입니다.",hope:"세 가지 보물은 큰돈이나 특별한 조건 없이 오늘부터 실천할 수 있습니다. 작은 선택이 쌓여 주군의 삶을 더욱 넉넉하게 만들 것입니다."},{n:68,title:"다투지 않는 승리",core:"도덕경 68장은 훌륭한 장수는 무력을 뽐내지 않고, 잘 싸우는 사람은 분노하지 않으며, 잘 이기는 사람은 맞서 다투지 않는다고 말합니다. 사람을 잘 쓰는 이는 자신을 낮추는 덕을 지닌다고 하여 이를 다투지 않는 덕이라 부릅니다.",situation:"갈등이나 경쟁에서 반드시 이겨야 한다는 압박을 느낄 수 있습니다. 지금 필요한 것이 정면충돌인지, 목표를 지키면서 피해를 줄이는 더 나은 방법인지 따져 보십시오.",hidden:"다투지 않는다는 것은 불의에 침묵하거나 위험을 방치하라는 뜻이 아닙니다. 분노에 휘둘리지 않고 상황을 정확히 판단해 불필요한 충돌을 피하는 능력입니다. 진짜 실력은 힘을 쓸 때와 쓰지 않을 때를 아는 데 있습니다.",steps:["감정이 격해졌다면 답하기 전에 잠시 멈추고, 확인된 사실과 추측을 나누십시오.","갈등의 목표를 승패가 아니라 문제 해결과 피해 최소화로 다시 정하십시오.","대화·중재·절차적 해결 등 충돌을 줄이는 방법을 먼저 검토하고, 안전과 권리를 지켜야 할 때는 적절한 도움을 구하십시오."],domains:{연애:"말다툼에서 이기는 것보다 서로의 문제를 해결하는 것이 중요합니다. 모욕이나 폭력이 있다면 안전을 우선하고 도움을 요청하십시오.",재물:"손실을 만회하려는 감정적 매매나 무리한 경쟁을 피하십시오. 투자 원칙과 손실 감내 범위를 미리 정해 두십시오.",사업·일:"경쟁사를 비방하기보다 제품과 서비스의 실력을 높이십시오. 협상에서는 감정적 대립보다 기준과 근거를 활용하십시오.",인간관계:"상대의 도발에 즉각 반응하지 말고 대화의 목적을 분명히 하십시오. 다툼을 피하되 부당한 요구에는 차분히 거절하십시오.",건강·생활:"분노와 긴장이 지속되면 휴식과 감정 조절을 우선하십시오. 갈등으로 안전이 위협받는다면 혼자 해결하려 하지 말고 도움을 구하십시오.",인생:"모든 싸움에 참여할 필요는 없습니다. 지켜야 할 가치에 힘을 쓰고, 자존심을 위한 충돌은 내려놓으십시오."},advice:"다투지 않는 지혜는 물러서기만 하는 태도가 아니라 힘을 낭비하지 않고 바른 목적에 쓰는 절제입니다.",hope:"오늘 한 번의 차분한 선택이 불필요한 상처를 막을 수 있습니다. 평화를 지키면서도 필요한 원칙을 세울 수 있습니다."},{n:69,title:"물러섬으로 지키는 힘",core:"도덕경 69장은 전쟁을 대하는 신중함을 말하며, 먼저 공격적으로 나서기보다 주도권을 함부로 쥐려 하지 말고 한 걸음 물러서는 태도를 강조합니다. 상대를 가볍게 여기지 않고 생명을 귀하게 여기는 경계의 가르침입니다.",situation:"경쟁이나 대립에서 먼저 움직여야 유리하다는 생각이 들 수 있습니다. 그러나 성급한 선제 행동이 갈등을 키우거나 되돌리기 어려운 손실을 낳지 않는지 점검하십시오.",hidden:"물러섬은 두려움이나 패배의 표시가 아닙니다. 상대와 상황을 과소평가하지 않고, 불필요한 충돌을 만들지 않는 전략적 신중함입니다. 이 장의 전쟁 비유는 공격을 권하는 것이 아니라 폭력의 무게를 잊지 말라는 경고로 읽어야 합니다.",steps:["지금 맞서려는 대상과 실제로 지켜야 할 목적을 분리해 적으십시오.","상대의 능력과 상황을 과소평가하고 있지 않은지 반대 관점에서 검토하십시오.","즉각적인 대응 대신 시간을 두고 협의·중재·안전 확보 등 피해를 줄이는 선택지를 마련하십시오."],domains:{연애:"감정이 격해진 순간 상대를 몰아붙이지 말고 대화를 잠시 멈출 수 있습니다. 다만 위협이나 폭력이 있다면 거리를 두고 안전을 확보하십시오.",재물:"시장의 움직임을 보고 조급하게 뛰어들기보다 손실 가능성과 반대 시나리오를 먼저 검토하십시오. 빚을 내어 승부를 걸지 마십시오.",사업·일:"경쟁자의 행동에 즉흥적으로 맞대응하기보다 시장과 고객의 변화를 확인하십시오. 무리한 확장보다 방어력과 지속 가능성을 점검하십시오.",인간관계:"상대의 말을 공격으로 단정하기 전에 의도를 확인하십시오. 필요하면 한발 물러나되 반복되는 침해에는 분명한 경계를 세우십시오.",건강·생활:"몸이 보내는 경고를 무시하고 한계를 시험하지 마십시오. 위험한 상황에서는 대결보다 안전한 거리와 전문적인 도움을 선택하십시오.",인생:"앞서 나가는 것만이 용기는 아닙니다. 때로는 멈추고 물러서서 더 큰 손실을 막는 판단이 삶을 지킵니다."},advice:"상황을 가볍게 여기지 말고, 먼저 다투려는 마음을 경계하십시오. 지켜야 할 것을 분명히 한 뒤 가장 적은 피해로 목적에 다가가십시오.",hope:"한 걸음 물러서면 보이지 않던 길이 보일 수 있습니다. 신중한 선택은 다음 기회를 지키는 힘이 됩니다."},{n:70,title:"쉬운 말 속의 깊은 진리",core:"도덕경 70장은 자신의 말은 매우 알기 쉽고 행하기도 쉽지만 세상 사람들이 알아듣거나 따르지 않는다고 말합니다. 그 까닭은 깊은 진리가 흔하고 단순해 보여 사람들이 가볍게 여기기 때문이라고 설명합니다. 참된 지혜의 가치를 알아보는 눈을 말합니다.",situation:"좋은 원칙을 알고도 실천이 어렵거나, 주변에서 단순한 조언을 대수롭지 않게 여기는 상황일 수 있습니다. 새롭고 복잡한 답을 찾기 전에 이미 알고 있는 기본을 실제로 지키고 있는지 살펴보십시오.",hidden:"지혜는 화려한 말이나 어려운 표현에만 있지 않습니다. 쉬운 말은 얕다는 뜻이 아니며, 단순한 원칙을 삶에서 꾸준히 지키는 일은 오히려 깊은 수련을 요구합니다. 이해했다고 여기는 것과 실제로 행하는 것 사이의 간격을 줄이는 것이 핵심입니다.",steps:["이미 알고 있지만 미루고 있는 기본 원칙 한 가지를 정하십시오.","그 원칙을 오늘 실행할 수 있는 행동으로 바꾸고 실천 여부를 확인하십시오.","남에게 가르치려 하기 전에 내 행동이 말과 일치하는지 돌아보십시오."],domains:{연애:"사랑과 존중이라는 기본을 거창한 말보다 약속 지키기와 경청으로 보여 주십시오. 말과 행동의 일치가 신뢰를 만듭니다.",재물:"수입보다 적게 쓰고 위험을 이해한 뒤 결정한다는 기본을 꾸준히 지키십시오. 복잡한 비법보다 투명한 원칙이 중요합니다.",사업·일:"고객에게 필요한 품질과 약속을 지키는 기본을 반복하십시오. 쉬운 원칙일수록 조직 전체가 실제로 실천하도록 체계를 만드십시오.",인간관계:"상대에게 바라는 존중을 먼저 행동으로 보여 주십시오. 좋은 말보다 일관된 태도가 관계를 설명합니다.",건강·생활:"규칙적인 수면과 움직임, 균형 잡힌 식사처럼 기본적인 생활 습관을 꾸준히 지키십시오. 특별한 방법을 찾기 전에 기본을 점검하십시오.",인생:"이미 알고 있는 진리를 생활 속에서 실천할 때 지혜가 됩니다. 아는 것을 하나씩 삶으로 옮기십시오."},advice:"새로운 지식을 더하기 전에 알고 있는 좋은 원칙 하나를 오늘 실천하십시오. 깊이는 말의 어려움이 아니라 삶의 일관성에서 드러납니다.",hope:"작고 평범한 실천도 결코 하찮지 않습니다. 오늘 지킨 기본 하나가 주군의 내일을 더 단단하게 만들 것입니다."},{n:71,title:"모름을 아는 지혜",core:"도덕경 71장은 모르는 것을 모른다고 아는 것이 가장 높은 지혜이며, 알지 못하면서 안다고 여기는 것은 병이라고 말합니다. 자신의 한계를 알아차리는 태도가 오히려 마음을 맑게 하고 배움의 길을 엽니다.",situation:"확신을 요구받거나 중요한 판단을 내려야 하는 상황일 수 있습니다. 모르는 부분을 감추기보다 무엇을 알고 무엇을 아직 확인하지 못했는지 구분할 때 실수가 줄어듭니다.",hidden:"겸손은 자신을 낮게 평가하는 일이 아니라 지식의 경계를 정확히 아는 일입니다. 모른다는 사실을 인정하면 질문하고 검증하고 배울 수 있습니다. 반대로 근거 없는 확신은 잘못된 결정을 굳힐 수 있습니다.",steps:["현재 판단에서 확인된 사실, 추정, 아직 모르는 점을 각각 적으십시오.","중요한 결정을 내리기 전에 신뢰할 만한 자료나 전문 지식을 통해 빈틈을 확인하십시오.","새로운 사실이 나오면 체면보다 정확성을 우선해 생각을 수정하십시오."],domains:{연애:"상대의 속마음을 안다고 단정하지 말고 직접 묻고 들으십시오. 오해가 있었다면 변명보다 먼저 인정하고 바로잡으십시오.",재물:"이해하지 못한 금융상품이나 투자 구조는 안다고 여기지 마십시오. 모르는 위험을 확인할 때까지 결정을 미루는 것도 현명합니다.",사업·일:"전문가의 의견을 구하고 현장 데이터를 확인하십시오. 모르는 영역을 인정하는 리더가 조직의 오류를 줄일 수 있습니다.",인간관계:"소문이나 일부 정보만으로 사람을 판단하지 마십시오. 모르는 사정이 있음을 인정하고 질문하는 태도를 가지십시오.",건강·생활:"자가 판단만으로 증상이나 치료법을 단정하지 마십시오. 불확실하거나 지속되는 문제는 의료 전문가에게 확인하십시오.",인생:"배움은 모르는 것을 인정하는 순간 시작됩니다. 확신을 조금 내려놓으면 더 넓은 진실을 받아들일 수 있습니다."},advice:"모른다고 말할 수 있는 용기를 가지십시오. 그것은 부족함의 고백이 아니라 정확함과 배움으로 향하는 출발점입니다.",hope:"오늘 모르는 것을 하나 발견했다면 이미 배움이 시작된 것입니다. 열린 마음은 언제든 더 나은 판단으로 나아갈 수 있습니다."},{n:72,title:"자신을 존중하는 삶",core:"도덕경 72장은 백성이 위압과 억압을 두려워하게 만들지 말라고 경계하고, 스스로 삶을 가볍게 여기지 말며 자기 거처를 사랑하라고 말합니다. 자신을 존중하는 사람은 함부로 자신을 낮추거나 해치지 않으며, 억지로 드러내지 않아도 존엄을 지킵니다.",situation:"외부의 평가나 압박 때문에 자신의 감정과 필요를 무시하고 있지는 않은지 살펴보십시오. 타인의 기대를 모두 만족시키려 하기보다 내가 지켜야 할 생활의 기반과 존엄을 확인할 때입니다.",hidden:"자기 존중은 자만이나 자기중심성이 아닙니다. 자신의 삶을 소중히 여기기에 타인의 삶도 함부로 대하지 않는 태도입니다. 두려움으로 사람을 움직이는 방식은 결국 신뢰를 무너뜨리며, 존엄을 인정하는 관계가 오래갑니다.",steps:["최근 스스로를 함부로 대했던 순간을 돌아보고, 바꾸고 싶은 경계 한 가지를 정하십시오.","타인의 기대와 자신의 책임을 구분하고, 감당하기 어려운 요구에는 정중하게 한계를 알리십시오.","몸과 마음이 머무는 공간을 정돈하고, 자신을 돌보는 작은 일정을 실제로 지키십시오."],domains:{연애:"사랑받기 위해 자신의 존엄과 경계를 포기하지 마십시오. 서로를 존중하는 관계인지 살피고, 위협이나 폭력이 있다면 안전을 우선하십시오.",재물:"남에게 보이기 위한 소비로 자신을 압박하지 마십시오. 자신의 생활 기반과 미래의 안정에 맞는 재정 계획을 세우십시오.",사업·일:"성과를 위해 사람의 존엄을 희생시키지 마십시오. 부당한 요구에는 근거를 갖춰 경계를 세우고, 동료의 권리도 존중하십시오.",인간관계:"모든 사람에게 인정받으려 애쓰지 않아도 됩니다. 서로의 경계를 존중하는 사람들과 신뢰를 쌓으십시오.",건강·생활:"자신의 몸을 소중히 여기고 충분한 휴식과 돌봄을 마련하십시오. 건강 문제를 방치하지 말고 필요한 도움을 받으십시오.",인생:"자신의 삶을 귀하게 여기는 태도는 매일의 선택에서 드러납니다. 남의 시선보다 존엄과 가치에 맞는 방향을 선택하십시오."},advice:"자신을 존중하는 일은 삶을 가볍게 여기지 않는 데서 시작합니다. 겸손하되 자신을 함부로 대하지 말고, 타인에게도 같은 존엄을 허락하십시오.",hope:"주군의 삶은 남의 평가만으로 정해지지 않습니다. 자신을 소중히 대하는 작은 선택들이 더 평온하고 단단한 내일을 만들어 갑니다."},{n:73,title:"용기와 하늘의 이치",core:"《도덕경》 73장은 무모하게 밀어붙이는 용기와 하늘의 도리에 따르는 담대한 태도를 구별합니다. 참된 용기는 과시하거나 상대를 해치는 힘이 아니라, 결과를 겸허히 받아들이며 바른 일을 선택하는 용기입니다.",situation:"중요한 결정을 앞두고 망설이거나, 강하게 나서야 할지 물러서야 할지 고민하는 때일 수 있습니다. 두려움 때문에 피하는 것인지, 신중함 때문에 기다리는 것인지 먼저 구분해 보십시오.",hidden:"이 장은 인간의 계산만으로 모든 결과를 통제할 수 없음을 일깨웁니다. 용기란 결과를 장담하는 태도가 아니라, 자신이 책임질 수 있는 선택을 하고 그 결과를 겸허히 감당하는 자세입니다.",steps:["지금 결정을 미루게 하는 두려움과 실제 위험을 종이에 나누어 적으십시오.","내가 통제할 수 있는 행동과 통제할 수 없는 결과를 구분하십시오.","타인에게 해를 덜 주고 오래 보아도 부끄럽지 않을 선택을 한 가지 실행하십시오."],domains:{연애:"상대의 반응을 억지로 얻으려 하지 말고, 필요한 마음을 솔직하고 차분하게 표현하십시오. 거절이나 차이를 존중하는 용기도 필요합니다.",재물:"큰 수익을 장담하는 말보다 손실 가능성과 감당할 수 있는 범위를 먼저 확인하십시오. 중요한 결정은 충분히 검토하고 분산과 여유를 고려하십시오.",사업·일:"불확실한 상황에서도 원칙을 지키되, 무리한 확장이나 과시성 경쟁은 경계하십시오. 작은 검증과 책임 있는 실행이 담대한 길입니다.",인간관계:"갈등을 피하기만 하지 말고 필요한 말을 정중하게 하십시오. 다만 상대를 굴복시키려는 대결은 용기와 다릅니다.",건강·생활:"몸의 한계를 무시하는 것이 강함은 아닙니다. 위험 신호를 살피고 필요한 진료와 휴식을 선택하는 것이 자신을 지키는 용기입니다.",인생:"모든 결과를 미리 알 수 없어도 가치 있는 방향은 선택할 수 있습니다. 오늘 감당할 수 있는 한 걸음을 내딛으십시오."},advice:"두려움에 끌려가지도, 자신감에 취하지도 마십시오. 바른 방향을 확인하고 책임질 수 있는 만큼 담대하게 나아가십시오.",hope:"용기는 두려움이 사라진 뒤에만 생기는 것이 아닙니다. 두려움 속에서도 바른 한 걸음을 선택할 때 자랍니다."},{n:74,title:"생명의 질서를 존중하는 지혜",core:"《도덕경》 74장은 죽음과 형벌을 함부로 다루는 통치의 위험을 말합니다. 생명의 질서를 존중하고, 공포와 처벌만으로 사람을 움직이려는 태도의 한계를 보여 줍니다.",situation:"누군가를 강하게 통제하거나 잘못을 즉시 벌하고 싶은 마음이 생길 수 있습니다. 또는 자신을 지나치게 몰아붙이며 실수에 가혹한 벌을 내리고 있을 수도 있습니다.",hidden:"이 장의 중심에는 생명과 권한의 경계가 있습니다. 누구도 삶과 죽음의 주인이 될 수 없듯, 타인의 삶을 함부로 좌우하려는 태도는 결국 두려움과 더 큰 혼란을 낳습니다.",steps:["문제의 원인과 재발을 막을 조건을 먼저 살피고, 비난은 잠시 멈추십시오.","내가 결정할 권한이 있는 일과 타인의 몫인 일을 구분하십시오.","처벌보다 안전·회복·책임 있는 개선을 우선하는 해결책을 마련하십시오."],domains:{연애:"상대를 벌주듯 침묵하거나 위협하지 마십시오. 상처를 말하고 필요한 경계를 세우되, 서로의 선택권을 인정하십시오.",재물:"손실을 만회하려고 더 큰 위험을 감수하지 마십시오. 이미 발생한 손실을 냉정하게 확인하고 재정 계획을 다시 세우십시오.",사업·일:"공포로 조직을 움직이면 문제를 숨기게 됩니다. 명확한 기준과 공정한 책임, 개선할 기회를 함께 마련하십시오.",인간관계:"상대의 실수를 낙인으로 만들지 말고 사실과 영향, 필요한 변화를 구체적으로 이야기하십시오.",건강·생활:"자신을 벌주는 방식의 절식·과로·무리한 운동은 피하십시오. 안전한 회복 계획을 세우고 필요하면 전문가와 상의하십시오.",인생:"삶을 통제하려는 마음을 내려놓고 생명과 시간의 한계를 존중하십시오. 오늘 할 수 있는 돌봄과 책임에 집중하십시오."},advice:"두려움으로 다스리기보다 생명을 존중하는 질서를 세우십시오. 자신과 타인에게 공정하고 안전한 선택이 오래갑니다.",hope:"실수는 생명을 포기할 이유가 아니라 배움과 회복의 출발점입니다. 존중과 책임은 언제든 다시 세울 수 있습니다."},{n:75,title:"욕심 없는 세상",core:"《도덕경》 75장은 백성이 굶주리는 까닭을 백성의 탓으로 돌리지 않고, 지나친 세금과 위정자의 욕심을 비판합니다. 삶을 어렵게 만드는 구조와 과도한 욕망을 돌아보라는 가르침입니다.",situation:"노력해도 여유가 생기지 않거나, 해야 할 일과 부담이 계속 늘어나는 상황일 수 있습니다. 개인의 의지만 탓하기 전에 부담의 크기와 환경을 함께 살펴보십시오.",hidden:"부족함은 언제나 개인의 게으름에서 비롯되는 것이 아닙니다. 지나친 요구와 불공정한 분배, 끝없는 욕심이 사람들의 삶을 팍팍하게 만들 수 있음을 이 장은 지적합니다.",steps:["한 달 동안 꼭 필요한 지출과 줄일 수 있는 지출, 외부에서 부과된 부담을 구분해 보십시오.","내가 스스로 늘린 과도한 목표나 비교 기준 한 가지를 내려놓으십시오.","불공정하거나 감당하기 어려운 부담이 있다면 근거를 정리해 도움과 조정을 요청하십시오."],domains:{연애:"관계에서 한쪽만 희생하거나 계속 요구하는 구조가 있는지 살펴보십시오. 사랑은 부담을 일방적으로 떠넘기지 않는 데서 자랍니다.",재물:"소득이 부족하다고 자신만 탓하지 말고 고정비·부채·금리·생활비 구조를 점검하십시오. 무리한 차입보다 지속 가능한 예산이 우선입니다.",사업·일:"구성원에게 감당할 수 없는 목표를 계속 부과하지 마십시오. 자원과 일정, 보상을 현실적으로 조정해야 성과도 지속됩니다.",인간관계:"호의가 의무로 굳어져 있지는 않은지 확인하십시오. 부탁과 책임의 범위를 분명히 하고 서로의 형편을 존중하십시오.",건강·생활:"과도한 일정과 스트레스가 생활을 잠식하는지 살펴보십시오. 휴식과 기본 생활을 사치가 아닌 필수 조건으로 두십시오.",인생:"더 많이 가져야만 행복하다는 기준을 잠시 내려놓으십시오. 삶을 힘들게 하는 불필요한 부담을 덜어 내는 것도 중요한 진전입니다."},advice:"부족함을 개인의 잘못으로만 해석하지 마십시오. 욕심과 부담의 구조를 살피고, 삶을 지탱하는 데 필요한 것을 먼저 회복하십시오.",hope:"짐을 조금 덜어 내면 다시 숨 쉴 공간이 생깁니다. 작은 여유를 되찾는 일부터 시작해도 충분합니다."},{n:76,title:"부드러움은 생명의 힘",core:"《도덕경》 76장은 살아 있는 것은 부드럽고 유연하지만 죽은 것은 굳고 뻣뻣하다는 비유로, 유연함이 생명의 힘임을 말합니다. 강함만 고집하면 오히려 쉽게 꺾일 수 있습니다.",situation:"변화에 적응하기 어렵거나, 자신의 방식과 기준을 지키느라 관계와 일에서 긴장이 커졌을 수 있습니다. 원칙은 지키되 방법은 조정할 수 있는지 살펴보십시오.",hidden:"부드러움은 약함이나 무원칙이 아닙니다. 살아 있는 힘은 상황을 읽고 조정하며 다시 자라나는 능력입니다. 굳어 버린 생각과 습관을 조금 풀어 주면 새로운 길이 생깁니다.",steps:["최근 갈등에서 반드시 지켜야 할 원칙과 바꿀 수 있는 방법을 구분하십시오.","상대의 관점이나 새로운 정보를 한 번 더 듣고 내 판단을 점검하십시오.","몸과 마음의 긴장을 낮추는 작은 습관—호흡, 산책, 휴식 중 하나를 실천하십시오."],domains:{연애:"상대와 다르다는 이유로 이기려 하지 말고 대화의 방식을 조정하십시오. 부드럽게 말하되 중요한 경계는 분명히 하십시오.",재물:"시장이나 소득 환경의 변화에 맞춰 계획을 유연하게 조정하십시오. 원래 계획에 집착해 위험을 키우지 마십시오.",사업·일:"기존 방식이 통하지 않을 때 개선을 받아들이십시오. 핵심 원칙은 유지하면서 업무 과정과 협업 방식은 유연하게 바꾸십시오.",인간관계:"모든 말을 맞서 받아칠 필요는 없습니다. 한 박자 쉬고 듣는 태도가 관계를 지키는 힘이 됩니다.",건강·생활:"무리하게 버티기보다 회복 가능한 강도로 움직이십시오. 몸 상태에 맞춘 꾸준함이 극단적인 노력보다 오래갑니다.",인생:"변화는 실패의 증거가 아닙니다. 유연하게 배우고 방향을 조정하는 능력이 삶을 계속 살아 움직이게 합니다."},advice:"단단함만으로 자신을 증명하려 하지 마십시오. 지켜야 할 뜻은 지키되, 살아 있는 방식으로 부드럽게 조정하십시오.",hope:"휘어질 줄 아는 나무가 바람을 견디듯, 유연함은 다시 일어설 힘을 남겨 줍니다."},{n:77,title:"균형을 바로잡는 지혜",core:"《도덕경》 77장은 하늘의 도가 활을 당기는 것처럼 넘치는 곳에서는 덜어 내고 부족한 곳은 보태어 균형을 이룬다고 설명합니다. 사람의 도는 종종 부족한 곳에서 더 거두어 넉넉한 곳에 보태는 방향으로 흐른다고 경계합니다.",situation:"성과와 자원이 한쪽에 쏠리거나, 내 삶의 여러 영역 중 어느 한 곳이 지나치게 소모되고 있을 수 있습니다. 무엇이 넘치고 무엇이 부족한지 차분히 살펴보십시오.",hidden:"균형은 모두에게 똑같이 나누는 기계적인 평등만을 뜻하지 않습니다. 넘치는 것을 덜어 부족한 곳을
